/*  9д. Корни √ в записи                                         */
/* ============================================================ */
function replaceRadicals(src){
  function rootOf(x, txt){
    if(x<0) throw new Error("Корень из отрицательного числа не извлекается.");
    const r=Math.sqrt(x);
    if(Math.abs(r-Math.round(r))<1e-9) return String(Math.round(r));
    throw new Error("√"+txt+" — иррациональное число: точного значения в обыкновенной дроби нет (≈ "+n2s(r,4)+
      "). Для точного ответа оставьте корень в записи или округлите сами.");
  }
  let s=String(src);
  /* √(a/b) и √(a) и √a */
  s=s.replace(/√\s*\(\s*(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)\s*\)/g, function(all,a,b){
    const A=parseFloat(a.replace(",",".")), B=parseFloat(b.replace(",","."));
    const ra=Math.sqrt(A), rb=Math.sqrt(B);
    if(Math.abs(ra-Math.round(ra))<1e-9 && Math.abs(rb-Math.round(rb))<1e-9)
      return "("+Math.round(ra)+"/"+Math.round(rb)+")";
    return rootOf(A/B, a+"/"+b);
  });
  s=s.replace(/√\s*\(\s*(\d+(?:[.,]\d+)?)\s*\)/g, function(all,a){
    return rootOf(parseFloat(a.replace(",",".")), a);
  });
  s=s.replace(/√\s*(\d+(?:[.,]\d+)?)/g, function(all,a){
    return rootOf(parseFloat(a.replace(",",".")), a);
  });
  return s;
}

/* ---- ГПСЧ с зерном (B7): вариант можно воспроизвести по коду ----
   mulberry32: быстрый, без зависимостей, одинаковый результат на всех устройствах */
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15), 1|a);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
let RND=mulberry32((Date.now()^0x9e3779b9)>>>0);
function seedRandom(seed){
  RND=mulberry32((seed>>>0)||1);
}
function rand(){ return RND(); }
/* код варианта → зерно: «7B-24» и «7b24» дают одно и то же */
function codeToSeed(code){
  const s=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!s) return 0;
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0);
}

function pluralRu(n,forms){
  const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return forms[2];
  if(b===1) return forms[0];
  if(b>=2&&b<=4) return forms[1];
  return forms[2];
}

function genSheet(key, count){
  const gen=GEN_TYPES[key]||GEN_TYPES.lin;
  const out=[];
  let guard=0;
  while(out.length<count && guard++<count*30){
    let q=null;
    try{ q=gen.make(); }catch(e){ continue; }
    if(!q) continue;
    let ans=null;
    try{
      const r=solve(q);
      ans=String(r.answer).replace(/&nbsp;/g," ");
    }catch(e){ continue; }
    if(!ans || /^(—|корней нет|решений нет)/.test(ans) && key!=="quad") continue;
    /* в контрольную и в тест не должны попадать «пустые» задания:
       4(x + 0), дробь 9/9, несокращённая 6/3 — это выглядит как ошибка составителя */
    if(/[(]\s*x\s*[+−]\s*0\s*[)]/.test(q)) continue;
    if(/[+−]\s*0\s*=/.test(q)) continue;      /* 9x + 0 = 54 */
    if(/\b(\d+)\s*\/\s*\1\b/.test(q)) continue;
    if((q.match(/\d+\s*\/\s*\d+/g)||[]).some(function(fr){
      const p=fr.split("/").map(function(z){ return parseInt(z.trim(),10); });
      if(p[0]>=p[1] && p[0]%p[1]===0) return true;      /* 6/3, 8/4 — это целое */
      let a=p[0], b=p[1]; while(b){ const t=a%b; a=b; b=t; }
      return a>1 && p[0]>p[1];                            /* 8/6 — сократимая неправильная */
    })) continue;
    /* время в ответе удобнее десятичной дробью, а не 35/12 */
    if(key==="work"){
      ans=ans.replace(/(\d+)\/(\d+)/g, function(all,n,d){
        const v=n/d;
        return (Math.abs(v-Math.round(v))<1e-9)? String(Math.round(v)) : n2s(v,2);
      });
    }
    out.push({q:q, a:ans});
  }
  return out;
}

function solveWord(text){
  const low=text.toLowerCase().replace(/ё/g,"ё");
  const models=[mChain,mMix,mPercent,mWork,mAge,mSumDiff,mPurchase,mSimple,mWater,mGeometry,mMotion];
  for(const f of models){
    let r=null;
    try{ r=f(low,text); }catch(e){ r=null; }
    if(r) return r;
  }
  return null;
}

function solve(input){
  let s=(input||"").trim();
  if(!s) throw new Error("Введите уравнение или условие задачи.");
  s=s.replace(/^(реши|решите|вычисли|вычислите|найди|найдите|посчитай|посчитайте|помоги решить|сколько будет|посчитай)(?![а-яёa-z])[:\s]*/i,"").trim();
  s=s.replace(/^систем[уыа]?\s+(уравнени[а-яё]*\s*)?/i,"").trim();
  /* хвостовая пунктуация: «2+2?», «5 км в метры.» */
  s=s.replace(/[?!.]+\s*$/,"").trim();
  /* «найди x: 5x-10=0» — после команды осталась буква с двоеточием */
  s=s.replace(/^[a-zа-яё]\s*:\s*/i,"").trim();
  if(!s) throw new Error("Введите уравнение или условие задачи.");
  /* задания новых тем (C7): НОД, пропорции, модуль, степени, прогрессии и др. */
  if(typeof window.__extraSolve==="function"){
    let ex=null;
    try{ ex=window.__extraSolve(s); }catch(e){ ex=null; }
    if(ex) return ex;
  }
  /* русская «х» вместо латинской — самая частая опечатка при наборе с клавиатуры */
  if(/[хХ]/.test(s) && !/[а-яё]{2,}/i.test(s)) s=s.replace(/[хХ]/g,"x");
  /* корни в записи: √9 → 3; иррациональные объясняем отдельно */
  if(s.indexOf("√")>=0) s=replaceRadicals(s);

  /* система двух уравнений: два знака «равно» */
  if((s.match(/=/g)||[]).length===2){
    const mathPart=s;
    if(mathPart && mathPart.indexOf("=")>=0){
      try{
        const sys=solveSystemString(mathPart);
        if(sys) return sys;
      }catch(e){
        /* запись похожа на систему — показываем её ошибку, а не «не распознано» */
        if(!/[а-яё]{3,}/i.test(mathPart.replace(/систем[а-яё]*/gi,""))) throw e;
      }
    }
  }

  /* «выражение при x = 0,25» — подстановка значения, а не уравнение */
  const conv=solveConvert(s);
  if(conv) return conv;

  const sub=solveSubstitution(s);
  if(sub) return sub;

  const hasCyr=/[а-яё]{3,}/i.test(s);
  const hasEq=s.indexOf("=")>=0;

  if(!hasCyr){
    if(hasEq) return solveEquationString(s);
    if(!/[a-z]/i.test(s)) return solvePlain(s);
    throw new Error("Похоже на выражение с буквой, но нет знака «=». Запишите уравнение целиком, например: 2x + 5 = 13.");
  }

  const w=solveWord(s);
  if(w) return w;

  /* в тексте могло встретиться уравнение */
  const m=s.match(/[-−0-9a-zA-ZxX+\-*/^().,\s]+=[-−0-9a-zA-ZxX+\-*/^().,\s]+/);
  if(m && /[a-z]/i.test(m[0])){
    const r=solveEquationString(m[0].replace(/[−–—]/g,"-"));
    r.steps.unshift({h:"Достаём уравнение из текста", b:eq(esc(m[0].trim()),true)+
      "<p>В условии нашлось готовое уравнение — решаем его.</p>"});
    return r;
  }

  /* похоже на попытку перевода единиц — подскажем именно про единицы */
  const looksLikeUnits=/^\s*[-−]?\d+\S*(?:\s+[а-яёa-z][а-яёa-z\/]*){0,3}\s+в\s+[а-яёa-z][а-яёa-z\/]*\s*[.?]?\s*$/i;
  if(looksLikeUnits.test(s)){
    throw new Error("Похоже на перевод единиц, но я не знаю такие единицы. "+
      "Перевожу длину (мм, см, дм, м, км), массу (мг, г, кг, ц, т), "+
      "скорость (км/ч, м/с, м/мин, км/мин, км/с) и время (с, мин, ч, сут, нед).");
  }

  throw new Error("Условие не распознано. Попробуйте переформулировать или сразу записать уравнение.");
}

/* копирование ответа (с запасным способом для file://) */
function copyFallback(text){
  return new Promise(function(res,rej){
    try{
      const ta=document.createElement("textarea");
      ta.value=text;
      ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0,text.length);
      const ok=document.execCommand("copy");
      document.body.removeChild(ta);
      ok? res() : rej(new Error("copy"));
    }catch(e){ rej(e); }
  });
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).catch(function(){ return copyFallback(text); });
  }
  return copyFallback(text);
}

});

let ringRAF=null;
function runRing(el){
  if(!el) return;
  if(ringRAF) cancelAnimationFrame(ringRAF);
  el.classList.remove("ring","lit");
  el.style.removeProperty("--ring-ang");
  if(!GLOW_ON) return;

  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.classList.add("ring");

  if(reduced){ el.classList.add("lit"); return; }

  /* два оборота за 4,8 с, затем остаётся мягкое свечение */
  const PERIOD=2400, TOTAL=PERIOD*2;
  const t0=performance.now();
  function step(now){
    const t=now-t0;
    if(t>=TOTAL){
      el.style.removeProperty("--ring-ang");
      el.classList.remove("ring");
      el.classList.add("lit");
      ringRAF=null;
      return;
    }
    el.style.setProperty("--ring-ang", ((t%PERIOD)/PERIOD*360).toFixed(1)+"deg");
    ringRAF=requestAnimationFrame(step);
  }
  ringRAF=requestAnimationFrame(step);
}

function parseConvValue(txt){
  let t=(txt||"").trim().replace(/\s+/g," ").replace(/[−–—]/g,"-");
  if(!t) return null;
  const mix=/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/.exec(t);
  if(mix) return new Frac(+mix[1],1).add(new Frac(+mix[2],+mix[3]));
  t=t.replace(/\s/g,"").replace(",",".");
  if(/^-?\d+(\.\d+)?$/.test(t)) return fracFromStr(t.replace(".",","));
  const fr=/^(-?\d+)\/(\d+)$/.exec(t);
  if(fr) return fracFromStr(fr[1]).div(fracFromStr(fr[2]));
  return null;
}

  const uf=unitByKey(convCatId, cvFrom.value);

  cvHint.className="cvhint";
  if(!uf || !ut){ cvOut.textContent="—"; cvRel.textContent=""; return; }

  const raw=cvIn.value;
  const val=parseConvValue(raw);

  if(val===null){
    cvOut.textContent="—";
    cvRel.textContent="";
    cvHint.textContent = raw.trim()? "Не понял число. Можно 5 · 2,5 · 1/2 · 2 1/2" : "";
    cvHint.classList.add("bad");
    cvSteps.innerHTML="";

  if(uf.key===ut.key){
    cvOut.innerHTML=fracAnswerHtml(val);
    cvRel.textContent="одна и та же единица";
    cvHint.textContent="Выберите разные единицы — сейчас слева и справа одно и то же.";
    cvHint.classList.add("bad");
    cvSteps.innerHTML="";
    return;
  }

  const fromF=unitFrac(uf), toF=unitFrac(ut);
  const res=val.mul(fromF).div(toF);
  const relOne=F1().mul(fromF).div(toF);

  cvOut.innerHTML=fracAnswerHtml(res);
  cvRel.textContent="1 "+uf.key+" = "+fmtFracNice(relOne)+" "+ut.key;

  const dec=fmtFracNice(res);
  const exact=Math.abs(res.val()-Math.round(res.val()*1e6)/1e6)<1e-12;
  let note="";
  if(dec.indexOf("/")>=0){
    note="≈ "+n2s(res.val(),4)+" "+ut.key+" — точное значение: "+dec+" "+ut.key;
  } else if(!exact){
    note="точное значение: "+dec+" "+ut.key;
  }
  cvHint.textContent=note;
  renderConvSteps(raw.trim()+" "+uf.key+" в "+ut.key);
}

    subLine.style.display = (testsMode||classMode||dashMode)? "none":"";
  }
  if(convMode){ cvSteps.innerHTML=""; updateConv(); }
  if(testsMode){
    if(TEST && !TEST.done) tRenderQuestion();
    else if(TEST && TEST.done) tFinish();
    else tRenderTopics();

  if(classMode){ clRenderPanel(); }

  if(other){

  lsSet("mode", mode);
}

function plainHtml(html){
  return String(html)
    .replace(/<span class="fr"><span class="frn">(-?\d+)<\/span><span class="frd">(\d+)<\/span><\/span>/g,"$1/$2")
    .replace(/<br\s*\/?>/g,"\n")
    .replace(/<sup>(.*?)<\/sup>/g,"^$1")
    .replace(/<li>/g,"• ")
    .replace(/<\/(p|li|div|h3)>/g,"\n")
    .replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ")
    .replace(/&minus;/g,"−")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/[ \t]+\n/g,"\n")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function exportPNG(res){
  const W=1000, P=54, CW=W-P*2;
  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");
  const FAM="'Segoe UI',Roboto,-apple-system,Arial,sans-serif";
  function setF(size,weight){ ctx.font=(weight||400)+" "+size+"px "+FAM; }
  function wrap(text,size,weight){
    setF(size,weight);
    const lines=[];
    text.split("\n").forEach(function(par){
      par=par.replace(/\s+$/,"");
      if(!par){ lines.push(""); return; }
      let cur="";
      par.split(/\s+/).forEach(function(w){
        const t=cur? cur+" "+w : w;
        if(ctx.measureText(t).width>CW-40 && cur){ lines.push(cur); cur=w; }
        else cur=t;
      });
      if(cur) lines.push(cur);
    });
    return lines;
  }
  const blocks=[];
  blocks.push({type:"kind", text:res.kind});
  blocks.push({type:"answer", text:"Ответ: "+plainHtml(String(res.answer))});
  res.steps.forEach(function(st,i){
    blocks.push({type:"head", text:(i+1)+". "+plainHtml(st.h)});
    blocks.push({type:"body", text:plainHtml(st.b)});
  });
  blocks.push({type:"foot", text:"Пошаговый решатель · "+new Date().toLocaleDateString("ru-RU")});
  let h=150;
  blocks.forEach(function(b){
    const conf = b.type==="kind"? [15,600,22]
      : b.type==="answer"? [23,700,31]
      : b.type==="head"? [17,700,24]
      : b.type==="foot"? [13,400,19] : [15,400,22];
    b.size=conf[0]; b.weight=conf[1]; b.lh=conf[2];
    b.padTop = b.type==="answer"? 18 : 0;
    b.padBot = b.type==="answer"? 20 : (b.type==="head"? 8 : (b.type==="kind"? 26 : 6));
    b.lines=wrap(b.text,b.size,b.weight);
    b.height=b.padTop + b.lines.length*b.lh + b.padBot;
    h+=b.height;
  });
  h+=40;
  c.width=W; c.height=Math.max(h,340);

  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#7c6cff"; ctx.fillRect(0,0,W,7);

  let y=52;
  setF(20,700);
  ctx.fillStyle="#111827";
  ctx.fillText("Пошаговый решатель", P, y);
  y+=18;
  ctx.fillStyle="#e5e7f2"; ctx.fillRect(P,y,W-P*2,1);
  y+=30;

  blocks.forEach(function(b){
    if(b.type==="answer"){
      const bh=b.lines.length*b.lh + b.padTop + b.padBot - 6;
      ctx.fillStyle="#f1fdf7";
      roundRect(ctx,P-14,y+2,W-P*2+28,bh,14);
      ctx.fill();
      ctx.strokeStyle="#b9efcf"; ctx.lineWidth=1; ctx.stroke();
    }
    const indent = b.type==="body"? 28 : 0;
    let startY = y + b.padTop;
    setF(b.size,b.weight);
    ctx.fillStyle = b.type==="kind"? "#4f46e5"
      : b.type==="answer"? "#065f46"
      : b.type==="head"? "#111827"
      : b.type==="foot"? "#9aa3bd" : "#2b3350";
    b.lines.forEach(function(line){
      ctx.fillText(line, P+indent+(b.type==="answer"?8:0), startY+b.size);
      startY+=b.lh;
    });
    y += b.height;
  });

  function roundRect(ctx,x,y,w,hh,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+hh,r);
    ctx.arcTo(x+w,y+hh,x,y+hh,r);
    ctx.arcTo(x,y+hh,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  const dataUrl=c.toDataURL("image/png");
  /* в Android-приложении сохраняем через мост в галерею, в браузере — обычным скачиванием */
  if(window.NativeApp && window.NativeApp.saveImage){
    try{ window.NativeApp.saveImage(dataUrl.split(",")[1], "решение-"+todayKey()+".png"); return; }catch(e){}
  }
  const a=document.createElement("a");
  a.download="решение-"+todayKey()+".png";
  a.href=dataUrl;
  a.click();
}

/* --- состояние --- */
let TEST=null;

function tAnswerText(s){
  return String(s).replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
}
/* все числа в строке ответа, вместе со знаком минус */
function tNumbers(s){
  const out=[];
  const re=/(−|-)?(\d+(?:[.,]\d+)?)/g;
  let m;
  while((m=re.exec(s))){
    const txt=m[2];
    let val=parseFloat(txt.replace(",","."));
    let start=m.index, neg=!!m[1];
    if(neg){ val=-val; }
    out.push({start:start, end:m.index+m[0].length, raw:m[0], val:val, dec:txt.indexOf(",")>=0});
  }
  return out;
}
function tFmt(v){
  const r=Math.round(v*1000)/1000;
  let s=String(Math.abs(r));
  if(s.indexOf(".")>=0) s=s.replace(".",",");
  return (r<0? "−":"")+s;
}
function tSwapSigns(s){
  return s.replace(/−\d/g,function(m){ return m.slice(1); })
          .replace(/(^|[\s=,(])-?\d/g,function(m){ return m; });
}
/* три правдоподобных неверных варианта.
   Ошибки берём «человеческие»: забыл удвоить, перепутал знак, округлил,
   посчитал процент от старой цены. Каждая — из своей категории, чтобы
   варианты не выстраивались в 2071/2072/2073.                            */
function tWrongOptions(correct, qText, genKey){
  const nums=tNumbers(correct);
  const cyr=/[а-яё]/i.test(correct);
  /* если в ответе есть «=», портим только правую часть — левая это условие */
  const eq=correct.indexOf("=");
  const zone=nums.filter(function(n){ return eq<0 || n.start>eq; });
  const pool=[];

  const correctCount={};
  nums.forEach(function(n){ correctCount[n.val]=(correctCount[n.val]||0)+1; });

  function push(x, kind, weight){
    x=tAnswerText(x);
    if(!x || x===correct) return;
    if(pool.some(function(p){ return p.s===x; })) return;
    const inner=tNumbers(x);
    const cnt={};
    inner.forEach(function(n){ cnt[n.val]=(cnt[n.val]||0)+1; });
    for(const k in cnt){
      /* значение повторилось там, где в верном ответе его нет: x₁=−3, x₂=−3 */
      if(cnt[k]>1 && cnt[k]>(correctCount[k]||0)) return;
    }
    pool.push({s:x, kind:kind, w:weight});
  }
  function swap(n, v){
    /* полуцелые там, где в ответе целые числа, выглядят по-школьному глупо */
    if(!n.dec && Math.abs(v-Math.round(v))>1e-9) return null;
    return correct.slice(0,n.start)+tFmt(v)+correct.slice(n.end);
  }
  function trySwap(n, v, kind, weight){
    const x=swap(n, v);
    if(x) push(x, kind, weight);
  }

  /* самый частый промах в текстовой задаче — подставить число из условия:
     старую цену вместо новой, сторону вместо площади. Ставим такие первыми. */
  const single=tNumbers(correct);
  const isUnits=(genKey==="units");
  if(isUnits && zone.length){
    const n=zone[zone.length-1];
    const head=correct.slice(0,n.start), tail=correct.slice(n.end);
    const v=n.val;
    [[v/10,0],[v*10,1],[v/100,2],[v*2,3],[v*5,4],[v/5,5],[v+10,6],[v-10,7]].forEach(function(pair){
      if(pair[0] && Math.abs(pair[0]-v)>1e-9 && Math.abs(pair[0]-Math.round(pair[0]))<1e-9) push(head+tFmt(pair[0])+tail, "unit"+pair[1], pair[1]);
    });
    if(qText){
      tNumbers(String(qText)).forEach(function(x){
        if(x.val!==v) push(head+tFmt(x.val)+tail, "fromq", -1);
      });
    }
  }
  if(cyr && qText && single.length===1 && !isUnits){
    const n=single[0];
    const head=correct.slice(0,n.start), tail=correct.slice(n.end);
    const qNums=[];
    tNumbers(String(qText)).forEach(function(x){
      if(qNums.indexOf(x.val)<0) qNums.push(x.val);
    });
    qNums.forEach(function(v){
      if(v===n.val) return;
      push(head+tFmt(v)+tail, "fromq", -1);
    });
  }

  if(!isUnits) zone.forEach(function(n){
    const v=n.val;
    trySwap(n, v*2, "mul", cyr? 6 : 0);
    trySwap(n, -v, "sign", cyr? 9 : 1);
    if(Math.abs(v)>0.001){
      trySwap(n, v/2, "half", cyr? 5 : 2);
      const pct=Math.round(v*0.9*100)/100;
      if(pct!==v) trySwap(n, pct, "pct", cyr? 1 : 3);
    }
    /* у цены и площади «на единицу» — не ошибка, а описка: сдвигаем на десяток */
    trySwap(n, cyr? v+10 : v+1, "one", cyr? 2 : 5);
    trySwap(n, cyr? v-10 : v-1, "one", cyr? 2 : 5);
    trySwap(n, v*3, "mul3", 8);
    trySwap(n, v+2, "two", cyr? 3 : 7);
  });
  /* поменять местами два значения (корни, x и y) */
  if(zone.length>=2 && !/\//.test(correct)){
    const A=zone[zone.length-2], B=zone[zone.length-1];
    const x=correct.slice(0,A.start)+tFmt(B.val)+correct.slice(A.end,B.start)+
            tFmt(A.val)+correct.slice(B.end);
    push(x, "swap", 1);
  }

  pool.sort(function(a,b){ return a.w-b.w; });
  const out=[], kinds={};
  for(let i=0;i<pool.length && out.length<3;i++){
    if(kinds[pool[i].kind]) continue;
    kinds[pool[i].kind]=1;
    out.push(pool[i].s);
  }
  for(let i=0;i<pool.length && out.length<3;i++){
    if(out.indexOf(pool[i].s)<0) out.push(pool[i].s);
  }
  while(out.length<3) out.push("другой ответ №"+(out.length+1));
  return out.slice(0,3);
}
function tShuffle(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=r[i]; r[i]=r[j]; r[j]=t;
  }
  return r;
}

function tBuild(key, count){
  const topic=TEST_TOPICS.filter(function(t){ return t.k===key; })[0]||TEST_TOPICS[0];
  const items=[];
  let guard=0;
  while(items.length<count && guard++<count*40){
    let genKey=topic.gen;
    if(!genKey){
      const pool=["lin","quad","frac","percent","area","units"];
      genKey=pool[Math.floor(rand()*pool.length)];
    }
    const made=genSheet(genKey, 1);
    if(!made.length) continue;
    const q=made[0].q;
    if(items.some(function(it){ return it.q===q; })) continue;
    let correct=null;
    try{
      const r=solve(q);
      correct=tAnswerText(r.answer);
    }catch(e){ continue; }
    if(!correct || correct.length>34) continue;
    if(/≈/.test(correct)) continue;
    const opts=tShuffle([correct].concat(tWrongOptions(correct, q, genKey)));
    items.push({q:q, correct:correct, options:opts, chosen:null, ok:false, shown:false});
  }
  return {key:key, name:topic.name, items:items, i:0, done:false};
}

/* --- сохранение лучших результатов --- */
function tBestAll(){
  try{ return JSON.parse(lsGet("testbest","{}"))||{}; }catch(e){ return {}; }
}
function tBestOf(k){
  const b=tBestAll()[k];
  return b? b : null;
}
function tSaveBest(k, score, total){
  const all=tBestAll();
  const prev=all[k];
  if(!prev || score>prev.score){
    all[k]={score:score, total:total, d:todayKey()};
    lsSet("testbest", JSON.stringify(all));
  }
}

function tRenderQuestion(){

function tChoose(idx){
  const it=TEST.items[TEST.i];
  if(it.chosen!==null) return;
  const picked=it.options[idx];
  it.chosen=picked;
  it.ok=(picked===it.correct);

  const btns=testPanel.querySelectorAll("[data-opt]");
  btns.forEach(function(b){
    const i=parseInt(b.getAttribute("data-opt"),10);
    b.disabled=true;
    if(it.options[i]===it.correct) b.classList.add("right");
    else if(i===idx) b.classList.add("wrong");
    else b.classList.add("mute");
  });

  const last=(TEST.i===TEST.items.length-1);
  const foot=document.getElementById("tfoot");
  foot.innerHTML=
    '<span class="tverdict '+(it.ok? "ok":"no")+'">'+
      (it.ok? "Верно" : "Правильный ответ — "+esc(it.correct))+'</span>'+
    '<button type="button" class="tact" id="tshow">Разбор</button>'+
    '<button type="button" class="tact primary" id="tnext">'+(last? "Итог":"Дальше")+'</button>';

  const showBtn=document.getElementById("tshow");
  showBtn.addEventListener("click", function(){
    const box=document.getElementById("tbreak");
    if(!box.hidden){ box.hidden=true; showBtn.textContent="Разбор"; showBtn.classList.remove("on"); return; }
    tShowBreakdown(box, it.q);
    showBtn.textContent="Скрыть";
    showBtn.classList.add("on");
  });
  document.getElementById("tnext").addEventListener("click", function(){
    if(last) tFinish(); else { TEST.i++; tRenderQuestion(); }
  });
}

function tShowBreakdown(box, q){
  box.hidden=false;
  box.innerHTML='<div class="tk">как решается</div><div id="tsteps">…</div>';
  const target=box.querySelector("#tsteps");
  try{
    const res=solve(q);
    target.innerHTML=stepsHtml(res.steps);
    if(typeof colorizeMath==="function"){
      target.querySelectorAll(".eq, .rval").forEach(colorizeMath);
    }
    const why=target.querySelectorAll(".why");
    why.forEach(function(w){
      w.addEventListener("click", function(){
        const id=w.getAttribute("data-why");
        const b=target.querySelector('.whybox[data-box="'+id+'"]');
        if(!b) return;
        b.hidden=!b.hidden;
        w.classList.toggle("on", !b.hidden);
        w.textContent=b.hidden? "почему?" : "скрыть";
      });
    });
  }catch(e){
    target.innerHTML='<p>Не удалось построить разбор для этого задания.</p>';
  }
}

function tFinish(){
  TEST.done=true;
  const total=TEST.items.length;
  const score=TEST.items.filter(function(x){ return x.ok; }).length;
  tSaveBest(TEST.key, score, total);
  try{ if(typeof V4!=="undefined") V4.onTestFinish(TEST.name, score, total); }catch(e){}
  const pct=Math.round(score/total*100);
  const msg = pct===100? "<b>Чисто.</b> Тема закрыта — можно брать следующую."
    : pct>=80? "<b>Хорошо.</b> Пара мест ещё шатается — посмотри разбор."
    : pct>=50? "<b>Нормально.</b> Ошибки полезны: разбери каждую."
    : "<b>Тема пока не далась.</b> Это не страшно — разбери ошибки по шагам и пройди снова.";
  const wrong=TEST.items.filter(function(x){ return !x.ok; });
  const best=tBestOf(TEST.key);

  testPanel.innerHTML=
    '<div class="tcard">'+
      '<div class="tresult">'+
        '<div class="tbig">'+score+'<small> / '+total+'</small></div>'+
        '<div class="trperc">'+pct+'%</div>'+
        '<p class="tmsg">'+msg+'</p>'+
        (best? '<div class="tbest">'+
          (best.score>score? 'Твой рекорд по теме: '+best.score+' из '+best.total+' — есть куда расти.'
                            : 'Это твой лучший результат по теме.')+'</div>':'')+
      '</div>'+
      (wrong.length?
        '<div class="tk" style="font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#8a93b4">разобрать ошибки</div>'+
        '<ul class="tlist">'+wrong.map(function(x,i){
          return '<li><span class="mq">'+esc(x.q)+'</span>'+
            '<span class="ma">'+esc(x.correct)+'</span>'+
            (x.chosen? '<span class="mch">твой ответ: '+esc(x.chosen)+'</span>':'')+
            '<button type="button" class="mb" data-w="'+i+'">разбор</button>'+
            '<div class="mbrk" id="mbrk-'+i+'" hidden></div></li>';
        }).join("")+'</ul>'
        : '<p class="tmsg">Ошибок нет — ни одной.</p>')+
      '<div class="tfoot">'+
        '<button type="button" class="tact primary" id="tagain">Ещё пять</button>'+
        '<button type="button" class="tact" id="tother">Другая тема</button>'+
      '</div>'+
    '</div>';

  testPanel.querySelectorAll("[data-w]").forEach(function(b){
    b.addEventListener("click", function(){
      const i=parseInt(b.getAttribute("data-w"),10);
      const box=document.getElementById("mbrk-"+i);
      if(!box) return;
      if(!box.hidden){ box.hidden=true; return; }
      box.hidden=false;
      tShowBreakdown(box, wrong[i].q);
    });

/* один вариант: per заданий, темы идут по кругу, чтобы в каждом варианте было поровну */
function clMakeVariant(used, per, offset){
  const topics=CLASS_STATE.topics.slice();
  const out=[];
  let guard=0, idx=offset;
  while(out.length<per && guard++<per*60){
    const key=topics[idx%topics.length]; idx++;
    const made=genSheet(key, 1);
    if(!made.length) continue;
    const q=made[0].q;
    if(used.indexOf(q)>=0) continue;
    let ans=null;
    try{ ans=tAnswerText(solve(q).answer); }catch(e){ continue; }
    if(!ans) continue;
    used.push(q);
    out.push({q:q, a:ans, topic:key});
  }
  return out;
}

function clNewCode(){
  const A="ACDEFGHJKLMNPQRTUVWXY23456789"; /* без похожих букв: 0/O, 1/I, B/8, S/5 */
  let c="";
  const r=mulberry32((Date.now()^(Math.random()*1e9))>>>0);
  for(let i=0;i<4;i++) c+=A[Math.floor(r()*A.length)];
  return c;
}
function clBuild(){
  /* B7: задания строит ГПСЧ с зерном, поэтому работу можно повторить по коду */
  const codeEl=document.getElementById("clcode");
  let code=((codeEl && codeEl.value)||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!code) code=clNewCode();
  seedRandom(codeToSeed(code)||1);
  CLASS_STATE.code=code;
  if(codeEl) codeEl.value=code;

  const used=[];
  const variants=[];
  for(let v=0; v<CLASS_STATE.vars; v++){
    /* сдвиг по темам, чтобы варианты начинались с разных тем */
    const items=clMakeVariant(used, CLASS_STATE.per, v);
    if(items.length<CLASS_STATE.per){ /* не хватило уникальных — добираем повтором тем же генератором */
      let g=0;
      while(items.length<CLASS_STATE.per && g++<40){
        const key=CLASS_STATE.topics[items.length%CLASS_STATE.topics.length];
        const made=genSheet(key,1);
        if(!made.length) continue;
        let ans=null;
        try{ ans=tAnswerText(solve(made[0].q).answer); }catch(e){ continue; }
        items.push({q:made[0].q, a:ans, topic:key});
      }
    }
    variants.push(items);
  }
  variants.forEach(function(items){
    for(let i=items.length-1;i>0;i--){
      const j=Math.floor(rand()*(i+1));
      const t=items[i]; items[i]=items[j]; items[j]=t;
    }
  });
  CLASS_STATE.built={variants:variants, title:CLASS_STATE.title, date:todayKey(), code:code};
  /* дальше снова живое зерно, чтобы следующая работа не была копией этой */
  seedRandom((Date.now()^0x5bf03635)>>>0);
  clDrawSheets();
  const sh=document.getElementById("clsheets");
  if(sh) sh.scrollIntoView({behavior:"smooth", block:"nearest"});
}

  /* ---------------- ОПЫТ И УРОВЕНЬ ---------------- */
  const MAXLVL=10;

  function renderXP(animate){
    const x=xp(), lv=level();

    if(!n) return;
    const before=level();
    LS.set("xp", xp()+n);
    renderXP(true);
    floatXP("+"+n+" XP", ev);
    const after=level();
    if(after>before){
      mascotSay("Уровень "+after+"! Так держать.", "happy");
      if(after===2) unlock("level2");

    const el=document.createElement("div");

        return '<div class="quest'+(q.done? " done":"")+'">'+
          '<span class="qi">'+q.icon+'</span>'+
          '<div class="qm"><div class="qt">'+esc(q.text)+'</div>'+
            '<div class="qb"><i style="width:'+pct+'%"></i></div></div>'+
          '<span class="qn">'+q.progress+'/'+q.target+'</span>'+
        '</div>';
      }).join("");
    }
    return st;
  }
  function questEvent(kind, amount){
    const st=questsState();
    let changed=false;
    st.list.forEach(function(q){
      if(q.done || q.kind!==kind) return;
      q.progress=Math.min(q.target, q.progress+(amount||1));
      if(q.progress>=q.target){ q.done=true; changed=true; }
    });
    LS.set("quests",st);
    if(changed){
      const all=st.list.every(function(q){ return q.done; });
      if(all && !st.rewarded){
        st.rewarded=true; LS.set("quests",st);
        addXP(30,"все квесты дня");
        mascotSay("Все квесты дня закрыты! +30 XP", "happy");
        confetti();
      }
    }
    renderQuests();
  }
  function checkQuestProgress(){ renderQuests(); }

  /* ---------------- МАСКОТ ---------------- */
  let bubbleTimer=0;
  function mascotSay(text, mood){
    const m=$("mascot"), b=$("mascotBubble");
    if(!m||!b) return;
    if(document.body.classList.contains("exam-mode")) return;
    b.textContent=text;
    b.classList.add("on");
    m.classList.remove("happy","sad");
    if(mood==="happy"){
      m.classList.add("happy");
      const mouth=$("mascotMouth");
      if(mouth) mouth.setAttribute("d","M38 53 Q50 65 62 53");
      setTimeout(function(){ m.classList.remove("happy"); if(mouth) mouth.setAttribute("d","M40 55 Q50 62 60 55"); },1300);
    }else if(mood==="sad"){
      m.classList.add("sad");
      const mouth=$("mascotMouth");
      if(mouth) mouth.setAttribute("d","M40 60 Q50 52 60 60");
      setTimeout(function(){ m.classList.remove("sad"); if(mouth) mouth.setAttribute("d","M40 55 Q50 62 60 55"); },1900);
    }
    clearTimeout(bubbleTimer);
    bubbleTimer=setTimeout(function(){ b.classList.remove("on"); },4200);
  }
  const TIPS=[
    "Вставьте условие целиком — с вопросом в конце.",
    "Не сходится ответ? Нажмите «почему?» у шага.",
    "Ошибка — это данные. Смотрите, на каком шаге свернули не туда.",
    "Проверка подстановкой внизу — быстрый способ поймать описку.",
    "В тестах разбор открывается даже после верного ответа.",
    "Знак «−» и «минус» — одно и то же, можно не искать правильный.",
    "Дроби пишите как 3/4, смешанные — как 2 1/2."
  ];
  function mascotTip(){
    mascotSay(TIPS[Math.floor(Math.random()*TIPS.length)]);
  }

  /* ---------------- КОНФЕТТИ ---------------- */
  let cv=null, ctx=null, parts=[], rafId=0;
  function confetti(){
    if(reduceMotion()) return;
    if(!cv){
      cv=document.createElement("canvas");
      cv.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:9997";
      document.body.appendChild(cv);
      ctx=cv.getContext("2d");
    }
    cv.width=window.innerWidth*Math.min(2,window.devicePixelRatio||1);
    cv.height=window.innerHeight*Math.min(2,window.devicePixelRatio||1);
    cv.style.width=window.innerWidth+"px"; cv.style.height=window.innerHeight+"px";
    const dpr=cv.width/window.innerWidth;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const colors=["#7c6cff","#35d0ff","#34d399","#f59e0b","#f472b6","#a78bfa"];
    parts=[];
    for(let i=0;i<52;i++){
      parts.push({
        x:window.innerWidth/2+(Math.random()-.5)*160,
        y:window.innerHeight*0.42,
        vx:(Math.random()-.5)*9,
        vy:-Math.random()*11-3,
        g:0.32+Math.random()*0.16,
        size:3+Math.random()*5,
        rot:Math.random()*6.28,
        vr:(Math.random()-.5)*0.3,
        c:colors[Math.floor(Math.random()*colors.length)],
        life:1
      });
    }
    cancelAnimationFrame(rafId);
    const t0=performance.now();
    (function frame(){
      const dt=Math.min(2,(performance.now()-t0)/16.7);
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      let alive=false;
      parts.forEach(function(p){
        p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
        p.life-=0.014*dt;
        if(p.life>0 && p.y<window.innerHeight*0.85){
          alive=true;
          ctx.save();
          ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.globalAlpha=Math.max(0,p.life);
          ctx.fillStyle=p.c;
          ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);
          ctx.restore();
        }
      });
      if(alive) rafId=requestAnimationFrame(frame);
      else ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    })();
  }

  /* ---------------- РЕАКЦИИ НА СОБЫТИЯ ---------------- */
  function isWordTask(res){
    if(!res) return false;
    if(/систем|уравнен|пример/i.test(res.kind||"")) return false;
    return /задач|процент|движен|работ|смес|возраст|покуп|вод|геометр|перевод/i.test(res.kind||"");
  }
  function quadTask(text){ return /x\s*[²^]|x\s*\*\s*x|x\s*x/i.test(text||""); }

  function onSolve(text, res){
    touchDayStreak();
    const c=counters();
    c.total=(c.total|0)+1;
    c.byDay=c.byDay||{};
    c.byDay[today()]=(c.byDay[today()]|0)+1;
    const dayCount=c.byDay[today()];
    const testStreak=c.testsPerfectStreak|0;

    const activeMode=lsGet("mode","solve");
    const isConv=(activeMode==="convert") || /перевод/i.test(res.kind||"");
    let xpGain=10;
    addXP(xpGain,"решение");

    questEvent("solve",1);
    if(isWordTask(res)) questEvent("word",1);
    if(quadTask(text)) questEvent("quad",1);
    if(isConv) questEvent("convert",1);

    if(dayCount>=10) unlock("ten_day");
    if(c.total>=100) unlock("marathon");
    unlock("first");
    saveCounters(c);

    if(res && res.kind) mascotSay(maskKind(res.kind), "happy");
  }
  function maskKind(kind){
    if(/уравнен/i.test(kind)) return "Уравнение разобрано. Внизу — проверка.";
    if(/процент/i.test(kind)) return "Проценты: главное — от чего считаем.";
    if(/движен/i.test(kind)) return "Движение: рисуем схему — и всё сходится.";
    if(/работ/i.test(kind)) return "Работа: складываем не время, а скорости.";
    if(/перевод/i.test(kind)) return "Перевод единиц готов.";
    return "Разбор готов — листайте шаги.";
  }
  function onTestFinish(topicName, score, total){
    touchDayStreak();
    /* верный ответ в тесте — тоже решение: 10 XP за каждый */
    if(score>0) addXP(score*10, "тест");
    if(score===total) addXP(20, "тест без ошибок");
    questEvent("test",1);
    questEvent("testans", score);
    if(score===total){
      unlock("perfect");
      const c=counters();
      c.testsPerfectStreak=(c.testsPerfectStreak|0)+1;
      saveCounters(c);
      if(c.testsPerfectStreak>=5) unlock("sniper");
    }else{
      const c=counters(); c.testsPerfectStreak=0; saveCounters(c);
    }
    if(score===total) mascotSay("Пять из пяти. Чисто!", "happy");
    else if(score<=total/2) mascotSay("Разберите ошибки — и станет проще.", "sad");
  }

  /* ---------------- ПАНЕЛИ ---------------- */
  function openPanels(which){
    const m=$("panelModal");
    if(!m) return;
    m.hidden=false;
    const st=questsState();
    if(which==="quests"){
      $("panelTitle").textContent="Квесты на сегодня";
      $("panelBody").innerHTML='<div class="quests">'+st.list.map(function(q){
        const pct=Math.round(q.progress/q.target*100);
        return '<div class="quest'+(q.done? " done":"")+'">'+
          '<span class="qi">'+q.icon+'</span>'+
          '<div class="qm"><div class="qt">'+esc(q.text)+'</div>'+
            '<div class="qb"><i style="width:'+pct+'%"></i></div></div>'+
          '<span class="qn">'+q.progress+' / '+q.target+'</span>'+
        '</div>';
      }).join("")+'</div>'+
      '<p style="font-size:12px;color:var(--ink-dim);margin:14px 0 0">'+
        'Квесты обновляются каждый день. За все три — 30 XP.</p>';
    }else{
      $("panelTitle").textContent="Достижения";
      const got=gotList();
      $("panelBody").innerHTML='<div class="achv-grid">'+ACHV.map(function(a){
        const on=got.indexOf(a.k)>=0;
        return '<div class="achv'+(on? " got":"")+'">'+
          '<span class="ai">'+a.icon+'</span>'+
          '<div><div class="an">'+a.name+'</div><div class="ad">'+a.desc+'</div></div>'+
        '</div>';
      }).join("")+'</div>'+
      '<p style="font-size:12px;color:var(--ink-dim);margin:14px 0 0">'+
        'Открыто '+got.length+' из '+ACHV.length+'. Каждая награда — это ещё 20 XP.</p>';
    }
  }

  return {
    applyTheme:applyTheme, themeNow:themeNow,
    addXP:addXP, renderXP:renderXP, xp:xp, level:level,
    renderDayStreak:renderDayStreak, touchDayStreak:touchDayStreak,
    onSolve:onSolve, onTestFinish:onTestFinish,
    unlock:unlock, renderAchvCount:renderAchvCount, renderQuests:renderQuests,
    openPanels:openPanels, mascotSay:mascotSay, mascotTip:mascotTip, renderDash:renderDash,
    confetti:confetti, questEvent:questEvent,
    _achv:ACHV, _quests:questsState, _counters:counters
  };
})();

  function renderExamTime(){

  /* ---------------- АНИМАЦИЯ ЗАДАЧИ НА ДВИЖЕНИЕ ---------------- */
  let mcv=null, mctx=null, mraf=0;
  function parseMotion(text){
    /* ищем два скорости и расстояние: «60 км/ч», «80 км/ч», «420 км» */
    const speeds=[];
    const re=/(\d+(?:[.,]\d+)?)\s*км\/ч/gi;
    let m;
    while((m=re.exec(text))) speeds.push(parseFloat(m[1].replace(",",".")));
    const dist=text.match(/(\d+(?:[.,]\d+)?)\s*км(?!\/)/i);
    if(speeds.length<2 || !dist) return null;
    const S=parseFloat(dist[1].replace(",","."));
    if(!(S>0)) return null;
    const v1=speeds[0], v2=speeds[1];
    const meeting=(S/(v1+v2));
    return {v1:v1, v2:v2, S:S, t:meeting, catchUp:/вдогон|догон/i.test(text)};
  }
  function motionDraw(progress){
    if(!mctx||!mcv||!motion) return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const W=mcv.width/dpr, H=mcv.height/dpr;
    mctx.setTransform(dpr,0,0,dpr,0,0);
    mctx.clearRect(0,0,W,H);
    const padL=34, padR=34, roadY=H*0.62;
    const span=W-padL-padR;
    const isLight=document.body.classList.contains("light");

    /* дорога */
    mctx.strokeStyle=isLight? "rgba(20,25,45,.16)":"rgba(255,255,255,.14)";
    mctx.lineWidth=2;
    mctx.beginPath(); mctx.moveTo(padL,roadY); mctx.lineTo(W-padR,roadY); mctx.stroke();
    /* точки A и B */
    [[padL,"A"],[W-padR,"B"]].forEach(function(p){
      mctx.beginPath(); mctx.arc(p[0],roadY,4,0,6.29);
      mctx.fillStyle=isLight? "#6b7280":"#8a93b4"; mctx.fill();
      mctx.fillStyle=isLight? "#6b7280":"#8a93b4";
      mctx.font="12px -apple-system,Segoe UI,sans-serif"; mctx.textAlign="center";
      mctx.fillText(p[1], p[0], roadY+22);
    });

    const p=progress;
    /* к моменту встречи разводим машины на пару пикселей, иначе они наложатся */
    const gap=26*p;
    const x1=padL+span*0.5*p-gap, x2=W-padR-span*0.5*p+gap;
    /* машины */
    function car(x,color,label,dir){
      mctx.save();
      mctx.translate(x,roadY-14);
      if(dir<0) mctx.scale(-1,1);
      mctx.fillStyle=color;
      mctx.beginPath();
      mctx.roundRect ? mctx.roundRect(-15,-9,30,16,5) : mctx.rect(-15,-9,30,16);
      mctx.fill();
      mctx.beginPath(); mctx.arc(-7,8,4,0,6.29); mctx.arc(7,8,4,0,6.29);
      mctx.fillStyle=isLight? "#374151":"#cbd5e1"; mctx.fill();
      mctx.restore();
      mctx.fillStyle=color;
      mctx.font="600 12px -apple-system,Segoe UI,sans-serif";
      mctx.textAlign="center";
      if(label) mctx.fillText(label, x, roadY-34);
    }
    car(x1,"#7c6cff", "", 1);
    car(x2,"#35d0ff", "", -1);

    /* подписи скоростей — по краям, чтобы не наезжали друг на друга */
    mctx.font="700 12px -apple-system,Segoe UI,sans-serif";
    mctx.textAlign="left";  mctx.fillStyle="#7c6cff";
    mctx.fillText(speedLabel(motion.v1)+" →", padL, 16);
    mctx.textAlign="right"; mctx.fillStyle="#35d0ff";
    mctx.fillText("← "+speedLabel(motion.v2), W-padR, 16);

    /* подпись расстояния */
    mctx.fillStyle=isLight? "rgba(20,25,45,.5)":"rgba(255,255,255,.5)";
    mctx.font="12px -apple-system,Segoe UI,sans-serif";
    mctx.textAlign="center";
    mctx.fillText(motion.S+" км", W/2, roadY+22);
    /* показать момент встречи */
    if(p>=1){
      mctx.fillStyle="#34d399";
      mctx.font="700 13px -apple-system,Segoe UI,sans-serif";
      mctx.textAlign="center";
      mctx.fillText("встреча через "+fmtNum(motion.t)+" ч", W/2, H-8);
    }
  }
  function speedLabel(v){ return fmtNum(v)+" км/ч"; }
  function fmtNum(v){
    const r=Math.round(v*100)/100;
    return String(r).replace(".",",");
  }
  let motion=null;
  function motionShow(text){
    const box=$("motionBox");

    box.hidden=false;
    mcv=$("motionCanvas"); mctx=mcv.getContext("2d");
    const w=Math.max(260, box.clientWidth-2);
    const dpr=Math.min(2,window.devicePixelRatio||1);

  }
  function motionPlay(){
    if(!motion) return;
    cancelAnimationFrame(mraf);
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ motionDraw(1); return; }
    const t0=performance.now(), dur=2200;
    (function frame(){
      const p=Math.min(1,(performance.now()-t0)/dur);
      motionDraw(p);
      if(p<1) mraf=requestAnimationFrame(frame);
    })();
  }

  /* ---------------- ИСТОРИЯ: ТЕГИ И ПОИСК ---------------- */
  const TAGS=["Домашка","Контрольная","Сложно"];
  let histFilter="", histQuery="";

  function histReadAll(){
    try{ return JSON.parse(lsGet("hist","[]"))||[]; }catch(e){ return []; }
  }
  function histSetTag(item, tag){
    const list=histReadAll();
    /* запись ищем по времени и тексту — этого достаточно */
    for(let i=list.length-1;i>=0;i--){
      if(list[i].d===item.d && list[i].t===item.t && list[i].q===item.q){
        list[i].tags=list[i].tags||[];
        const k=list[i].tags.indexOf(tag);
        if(k>=0) list[i].tags.splice(k,1); else list[i].tags.push(tag);
        break;
      }
    }
    try{ lsSet("hist", JSON.stringify(list.slice(-60))); }catch(e){}
    renderHistV4();
  }
  function renderHistV4(){
    const box=$("hist");
    if(!box) return;
    const all=histReadAll().filter(function(x){ return x.d===todayKey(); });
    const q=histQuery.trim().toLowerCase();
    const list=all.filter(function(x){
      if(histFilter && (x.tags||[]).indexOf(histFilter)<0) return false;

        }).join("")+
      '</div>';

    if(!list.length){
      html+='<div class="histempty">'+(all.length? "Ничего не нашлось — сбросьте фильтр." : "Сегодня ещё ничего не решали.")+'</div>';

                (tags.indexOf(t)>=0? "✓ "+t : t)+'</button>';

    box.innerHTML=html;

    const s=$("histSearch");

    /* ---- код переноса: прогресс текстом, без файла (для телефона и мессенджера) ---- */
    function b64enc(str){
      const bytes=new TextEncoder().encode(str);
      let bin="";
      for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
      return btoa(bin);
    }
    function b64dec(b64){
      const bin=atob(String(b64).replace(/[\s\r\n]+/g,""));
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    function transferOpen(){
      let code="";
      try{ code=b64enc(JSON.stringify(STORE.snapshot())); }

      const long=code.length>6000;

          '<textarea id="trIn" rows="3" spellcheck="false" placeholder="Вставьте код сюда" '+
            'style="width:100%;font-family:ui-monospace,monospace;font-size:12px"></textarea>'+
          '<div class="perr" id="trErr"></div>'+
          '<div class="dbrow" style="margin-top:10px">'+
            '<button type="button" class="trbtn" id="trApply">Применить код</button>'+
            '<button type="button" class="trbtn ghost" id="trClose">Закрыть</button>'+
          '</div>'+
        '</div>';
      document.body.appendChild(m);
      const close=function(){ m.remove(); };
      m.addEventListener("click", function(e){ if(e.target===m) close(); });
      document.getElementById("trClose").addEventListener("click", close);
      document.getElementById("trCopy").addEventListener("click", function(){
        const ta=document.getElementById("trOut");
        ta.select();
        let ok=false;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(ta.value).then(function(){}, function(){});
          ok=true;
        }
        try{ ok=document.execCommand("copy") || ok; }catch(e){}
        document.getElementById("trErr").textContent = ok? "Код скопирован." : "Скопируйте вручную — выделено.";
      });
      document.getElementById("trApply").addEventListener("click", function(){
        const err=document.getElementById("trErr");
        const val=String(document.getElementById("trIn").value||"").trim();
        if(!val){ err.textContent="Поле пустое."; return; }

        if(!obj || typeof obj!=="object" || !obj.data){ err.textContent="Код не похож на сохранение прогресса."; return; }

          location.reload();

        if(pm2 && !pm2.hidden) pm2.hidden=true;
      }
    });

    const m=$("mascot");
    if(m){
      m.addEventListener("click", V4.mascotTip);
      /* при прокрутке вниз маскот уходит в полупрозрачный режим, чтобы не закрывать шаги */
      let lastY=0;
      window.addEventListener("scroll", function(){
        const y=window.pageYOffset||document.documentElement.scrollTop;
        if(Math.abs(y-lastY)<40) return;
        lastY=y;
        m.classList.toggle("mini", y>320);
        if(y>320){ const b=$("mascotBubble"); if(b) b.classList.remove("on"); }
      }, {passive:true});
      m.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); V4.mascotTip(); }
      });
    }

    /* пружинистое нажатие на главных кнопках */
    document.addEventListener("pointerdown", function(e){
      const t=e.target.closest(".solve,.act,.clbtn,.tact,.modebtn,.topic,.opt");
      if(t) t.classList.add("v4-press");
    }, true);
    document.addEventListener("animationend", function(e){
      if(e.animationName==="v4-bounce") e.target.classList.remove("v4-press");
    }, true);

    /* перерисовать историю в новом виде при открытии */
    const hb=$("histbtn");
    if(hb) hb.addEventListener("click", function(){ setTimeout(renderHistV4,0); });

    V4.applyTheme(V4.themeNow());
    V4.renderXP();
    V4.renderDayStreak();
    V4.renderAchvCount();
    V4.renderQuests();
    setTimeout(function(){
      if(!document.body.classList.contains("exam-mode"))
        V4.mascotSay("Привет! Я подскажу, если что-то не сойдётся.", "happy");
    }, 1200);
  }

  window.__dashRefresh=function(){
    const p=document.getElementById("dashPanel");
    if(p && !p.hidden){ try{ renderDash(); }catch(e){} }
  };
  return {init:function(){ window.__v4hist=renderHistV4; init(); },
          renderDash:renderDash, renderHistV4:renderHistV4, motionShow:motionShow,
          examSet:examSet, cheatToggle:cheatToggle, parseMotion:parseMotion};
})();

/*  ТРЕНИРОВКА: ответ, шаги, подсказки, ошибки (C1–C5)           */
/* ============================================================ */
(function(){
  const $=function(id){ return document.getElementById(id); };
  const esc2=function(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
  const plain=function(html){ return String(html).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim(); };
  const L=function(){ return window.__LEARN; };

  const TR={
    topic:"lin", task:null, typed:"", tries:0, hintLvl:0, shown:false, ok:0, total:0, done:false,
    mode:"answer", steps:null, revealed:0, stepErr:0, stepPick:null, wrongNote:"", mistakeId:null, helped:false
  };

  /* подсказки: 1 — направление, 2 — правило, 3 — почти ответ (тексты в learn.js) */
  function hintText(lvl){
    if(!L()) return "";
    return L().hint(TR.topic, lvl, TR.task);
  }

  function taskLevel(){
    return L()? L().level(TR.topic) : 1;
  }
  const LVL_NAME=["","простое","обычное","сложное"];

  function trAward(n){
    if(!n) return;
    try{
      if(typeof V4!=="undefined" && V4.addXP) V4.addXP(n, "тренировка");
      if(typeof V4!=="undefined" && V4.questEvent) V4.questEvent("solve", 1);
    }catch(e){}
  }

  function newTask(forceTask, mistakeId){
    TR.task=null; TR.typed=""; TR.tries=0; TR.hintLvl=0; TR.shown=false; TR.done=false;
    TR.steps=null; TR.revealed=0; TR.stepErr=0; TR.stepPick=null; TR.wrongNote=""; TR.helped=false;
    TR.mistakeId=mistakeId||null;
    TR.shuffledFor=-1; TR.shuffled=null;

    if(forceTask){
      TR.task=forceTask;
    }else if(L()){
      try{ TR.task=L().pickTask(TR.topic, taskLevel()); }catch(e){ TR.task=null; }
    }
    if(!TR.task){
      let made=[];
      try{ made=genSheet(TR.topic, 1); }catch(e){ made=[]; }
      if(made.length) TR.task=made[0];
    }
    if(TR.task){ TR.task.topic=TR.topic; TR.total++; }
    /* шаги берём из решателя: своей логики не дублируем */
    try{
      const r=solve(TR.task.q);
      TR.steps=(r && r.steps && r.steps.length>1)? r.steps : null;
    }catch(e){ TR.steps=null; }
    if(TR.mode==="steps" && !TR.steps) TR.mode="answer";
  }

  function chipsHtml(){
    const G=window.__GEN_TYPES||{};
    return Object.keys(G).map(function(k){
      return '<button type="button" class="clchip'+(k===TR.topic? " on":"")+'" data-tr="'+k+'">'+
        '<span class="bx">'+(k===TR.topic? "✓":"")+'</span>'+esc2(G[k].title)+'</button>';
    }).join("");
  }

  function stepsHtmlFor(task){
    try{
      const res=solve(task.q);
      return '<div class="steps-title">Как получили</div>'+stepsHtml(res.steps);
    }catch(e){
      return '<p class="dashnote">Разбор недоступен: '+esc2(e.message||"ошибка")+'</p>';
    }
  }

  /* варианты ответа для шага: верный заголовок + два чужих из этого же решения */
  function stepOptions(){
    if(!TR.steps) return [];
    const cur=TR.revealed;
    if(cur>=TR.steps.length) return [];
    if(TR.shuffled && TR.shuffledFor===cur) return TR.shuffled;
    const right=plain(TR.steps[cur].h);
    const others=[];
    for(let i=0;i<TR.steps.length;i++){
      if(i===cur) continue;
      const t=plain(TR.steps[i].h);
      if(t && t!==right && others.indexOf(t)<0) others.push(t);
    }
    const extra=["Сразу записываем ответ","Меняем знак только у одного слагаемого","Умножаем обе части на 0"];
    for(let i=0;i<extra.length && others.length<2;i++){
      if(extra[i]!==right && others.indexOf(extra[i])<0) others.push(extra[i]);
    }
    const opts=[{t:right, ok:true}].concat(others.slice(0,2).map(function(t){ return {t:t, ok:false}; }));
    for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=opts[i]; opts[i]=opts[j]; opts[j]=x; }
    TR.shuffled=opts; TR.shuffledFor=cur;
    return opts;
  }

  function stepWord(n){
    const a=Math.abs(n)%100, b=a%10;
    if(a>10&&a<20) return "шагов";
    if(b===1) return "шаг";
    if(b>=2&&b<=4) return "шага";
    return "шагов";
  }

  function renderStepsArea(){
    if(!TR.steps) return "";
    let out='<div class="strbox">';
    for(let i=0;i<TR.revealed;i++){
      const st=TR.steps[i];
      out+='<div class="strdone"><div class="strnum">'+(i+1)+'</div>'+
        '<div class="strbody"><div class="strh">'+st.h+'</div><div class="strb">'+st.b+'</div></div></div>';
    }
    if(TR.revealed<TR.steps.length){
      const opts=stepOptions();
      out+='<div class="strask">Шаг '+(TR.revealed+1)+' из '+TR.steps.length+': что делаем дальше?</div>'+
        '<div class="strops">'+opts.map(function(o){
          const cls=TR.stepPick===o.t? (o.ok? " ok":" bad") : "";
          return '<button type="button" class="strop'+cls+'" data-opt="'+esc2(o.t)+'">'+esc2(o.t)+"</button>";
        }).join("")+"</div>";
      if(TR.wrongNote) out+='<div class="strnote">'+TR.wrongNote+"</div>";
    }else{
      out+='<div class="strfin">Решено за '+TR.steps.length+" "+stepWord(TR.steps.length)+
        ", ошибок "+TR.stepErr+".</div>";
    }
    out+="</div>";
    return out;
  }

  function render(){
    const box=$("trainPanel");
    if(!box) return;
    if(!TR.task) newTask();
    const t=TR.task;
    if(!t){
      box.innerHTML='<div class="trcard trmain"><p class="dashnote">Не удалось собрать задание. Смените тему.</p></div>';
      return;
    }
    const long=(t.q.length>26);
    const hintLeft=3-TR.hintLvl;
    const lvl=taskLevel();

    let verdict="";
    if(TR.done && TR.mode!=="steps"+"" || (TR.done && !TR.steps)){
      verdict = TR.lastOk
        ? '<div class="trverdict ok">Верно! <span class="ans">'+esc2(t.a)+'</span> засчитано'+
          (TR.lastXp? ' · +'+TR.lastXp+' XP':'')+(TR.helped? (TR.shown? " · решение было открыто — в освоение не идёт" : " · разобрано с подсказкой"):"")+'</div>'
        : '<div class="trverdict bad">Пока нет. Правильный ответ — <span class="ans">'+esc2(t.a)+
          '</span>. Разберите решение и попробуйте следующее.</div>';
    }
    let hint="";
    if(TR.hintLvl>0 && TR.mode==="answer"){
      hint='<div class="trhintbox"><b>Подсказка '+TR.hintLvl+' из 3.</b> '+esc2(hintText(TR.hintLvl))+"</div>";
    }

    const modeBar=
      '<div class="trmodes" role="group" aria-label="Режим тренировки">'+
        '<button type="button" class="trmode'+(TR.mode==="answer"?" on":"")+'" data-trmode="answer">Ответом</button>'+
        '<button type="button" class="trmode'+(TR.mode==="steps"?" on":"")+'" data-trmode="steps"'+
          (TR.steps? "":" disabled")+'>По шагам</button>'+
      "</div>";

    const body = (TR.mode==="steps" && TR.steps)
      ? renderStepsArea()
      : '<div class="trrow">'+
          '<input id="trin" type="text" inputmode="text" autocomplete="off" spellcheck="false" '+
            'placeholder="Твой ответ" value="'+esc2(TR.typed)+'"'+(TR.done? " disabled":"")+'>'+
          '<button type="button" class="trbtn" id="trcheck"'+(TR.done? " disabled":"")+'>Проверить</button>'+
        '</div>'+verdict+hint;

    box.innerHTML=
      '<div class="trcard trmain">'+
        '<div class="trhead"><span class="trnum">задание · '+esc2(LVL_NAME[lvl]||"обычное")+'</span>'+
          '<span class="trscore">верно '+TR.ok+' из '+Math.max(1,TR.total)+'</span></div>'+
        '<div class="trq'+(long? " long":"")+'">'+esc2(t.q)+'</div>'+
        modeBar+
        body+
        '<div class="tracts">'+
          (TR.mode==="answer"? '<button type="button" class="trbtn ghost" id="trhint"'+
            (TR.done||hintLeft<=0? " disabled":"")+'>Подсказка · '+Math.max(0,hintLeft)+'</button>' : "")+
          (TR.mode==="answer"? '<button type="button" class="trbtn ghost" id="trshow">Показать решение</button>' : "")+
          (TR.done|| (TR.mode==="steps" && TR.steps && TR.revealed>=TR.steps.length)?
            '<button type="button" class="trbtn ghost" id="trhow">Покажи, как решается</button>' : "")+
          '<button type="button" class="trbtn" id="trnext">Дальше →</button>'+
        '</div>'+
        '<div class="trsteps" id="trsteps"'+(TR.shown? '':' hidden')+'>'+
          (TR.shown? stepsHtmlFor(t) : '')+
        '</div>'+
      '</div>'+
      '<details class="trcard trtopics" id="trTopics">'+
        '<summary>Тема: '+esc2((window.__GEN_TYPES[TR.topic]||{title:"Линейные уравнения"}).title)+' · сменить</summary>'+
        '<div class="clchips" id="trchips">'+chipsHtml()+'</div>'+
      '</details>';

    box.querySelectorAll("[data-tr]").forEach(function(b){
      b.addEventListener("click", function(){
        TR.topic=b.getAttribute("data-tr");
        TR.ok=0; TR.total=0;
        newTask(); render();
      });
    });
    box.querySelectorAll("[data-trmode]").forEach(function(b){
      b.addEventListener("click", function(){
        const m=b.getAttribute("data-trmode");
        if(m==="steps" && !TR.steps) return;
        TR.mode=m; TR.shuffledFor=-1; TR.stepPick=null; TR.wrongNote="";
        render();
      });
    });
    const inp=$("trin");
    if(inp){
      inp.addEventListener("input", function(){ TR.typed=inp.value; });
      inp.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); checkAnswer(); }
      });
      if(!TR.done) setTimeout(function(){ inp.focus(); }, 30);
    }
    const ck=$("trcheck"); if(ck) ck.addEventListener("click", checkAnswer);
    const hb=$("trhint"); if(hb) hb.addEventListener("click", function(){
      TR.hintLvl=Math.min(3,TR.hintLvl+1);
      if(TR.hintLvl===3) TR.helped=true;
      render();
    });
    const sh=$("trshow"); if(sh) sh.addEventListener("click", function(){
      TR.shown=true; TR.helped=true; render();
    });
    const nx=$("trnext"); if(nx) nx.addEventListener("click", function(){
      /* режим запоминаем: кто тренируется по шагам — продолжает по шагам */
      TR.shown=false; newTask(); render();
    });
    const hw=$("trhow"); if(hw) hw.addEventListener("click", function(){ showInSolver(); });

    box.querySelectorAll("[data-opt]").forEach(function(b){
      b.addEventListener("click", function(){ pickStep(b.getAttribute("data-opt")); });
    });
  }

  /* ---- ответ ---- */
  function checkAnswer(){
    if(!TR.task || TR.done) return;
    const inp=$("trin");
    const val=inp? inp.value : TR.typed;
    TR.typed=val;
    if(!String(val).trim()){
      if(inp){ inp.focus(); inp.classList.add("v4-shake"); setTimeout(function(){ inp.classList.remove("v4-shake"); }, 500); }
      return;
    }
    TR.tries++;
    const ok=L()? L().isRight(val, TR.task.a) : false;
    TR.lastOk=ok;
    /* C2: 10 → 6 → 2 → 0 за уровни подсказок */
    let gain=0;
    if(ok && !TR.shown){
      gain = TR.hintLvl===0? 10 : TR.hintLvl===1? 6 : TR.hintLvl===2? 2 : 0;
    }
    if(ok){ TR.ok++; trAward(gain); }
    TR.lastXp=gain;
    TR.done=true;
    if(!ok) TR.shown=false;
    record(ok, val);
    render();
  }

  /* ---- шаг ---- */
  function pickStep(text){
    if(!TR.steps || TR.revealed>=TR.steps.length) return;
    const right=plain(TR.steps[TR.revealed].h);
    TR.stepPick=text;
    if(text===right){
      TR.revealed++;
      TR.wrongNote="";
      TR.shuffledFor=-1;
      TR.stepPick=null;
      if(TR.revealed>=TR.steps.length){
        TR.done=true; TR.lastOk=true;
        const gain=TR.stepErr===0? 10 : TR.stepErr===1? 6 : TR.stepErr===2? 2 : 0;
        TR.lastXp=gain;
        if(gain) TR.ok++;
        trAward(gain);
        record(true, "по шагам");
      }
    }else{
      TR.stepErr++;
      TR.wrongNote="<b>Не так.</b> Сейчас важно: "+esc2(hintText(1))+
        " Выбранное действие относится к другому шагу — вернитесь к тому, что дано в условии.";
    }
    render();
  }

  /* ---- запись результата: освоение, повторение, ошибки ---- */
  function record(ok, userAnswer){
    if(!L()) return;
    try{
      L().attempt(TR.topic, ok, TR.hintLvl>0 || TR.helped, TR.task, userAnswer);
      /* антифарм: ошибка закрывается только своим ответом. Списал с «Показать
         решение» — ответ верный, но ошибка остаётся в списке: иначе её «закрывают»
         просмотром ответа, и разбора не происходит. */
      if(ok && TR.mistakeId && !TR.helped){ L().closeMistake(TR.mistakeId); TR.mistakeId=null; }
    }catch(e){ logErr("learn: "+e.message); }
    if(typeof window.__dashRefresh==="function") window.__dashRefresh();
  }

  /* «покажи, как решается» — открывает ту же задачу в решателе */
  function showInSolver(){
    if(!TR.task) return;
    const q=document.getElementById("q");
    const bar=document.getElementById("backBar");
    setModeGroup("solve");
    if(q){ q.value=TR.task.q; }
    try{ run(TR.task.q); }catch(e){}
    if(bar) bar.hidden=false;
    const out=document.getElementById("out");
    if(out) setTimeout(function(){ out.scrollIntoView({behavior:"smooth",block:"nearest"}); }, 60);
  }

  function trainTopic(key){
    TR.topic=(window.__GEN_TYPES[key]? key : "lin");
    TR.ok=0; TR.total=0;
    const bar=document.getElementById("backBar");
    if(bar) bar.hidden=true;
    newTask();
    setModeGroup("train");
    render();
  }

  /* «решить похожую» из «Моих ошибок» */
  function trainWith(task, mistakeId){
    TR.ok=0; TR.total=0;
    if(task && task.topic){ TR.topic=task.topic; }
    const bar=document.getElementById("backBar");
    if(bar) bar.hidden=true;
    newTask(task, mistakeId);
    setModeGroup("train");
    render();
  }

  document.addEventListener("click", function(e){
    const t=e.target;
    if(t && t.id==="backBtn"){
      const bar=document.getElementById("backBar");
      if(bar) bar.hidden=true;
      setModeGroup("train");
    }
  });

  window.__trainRender=render;
  window.__trainTopic=trainTopic;
  window.__trainWith=trainWith;
  window.__trainState=TR;
})();


/* ============================================================ */
/*  РОЛЬ «УЧИТЕЛЬ» (v4.2): ключи к вариантам только под PIN      */
/* ============================================================ */
(function(){
  const KEY="v4.teacher";
  let FAIL={n:0, until:0};

  function getPin(){
    try{ const v=STORE.get(KEY,""); return v? String(v) : ""; }catch(e){ return ""; }
  }
  function setPin(p){
    try{ STORE.set(KEY, String(p)); }catch(e){}
  }
  function isTeacher(){
    try{ return sessionStorage.getItem("v4.teacherOn")==="1"; }catch(e){ return window.__teacherOn===true; }
  }
  function setTeacherOn(on){
    window.__teacherOn=!!on;
    try{ if(on) sessionStorage.setItem("v4.teacherOn","1"); else sessionStorage.removeItem("v4.teacherOn"); }catch(e){}
  }

  /* модалка PIN: создаётся один раз */
  let modal=null;
  function ensureModal(){
    if(modal) return modal;
    modal=document.createElement("div");
    modal.className="pinmodal"; modal.id="pinModal"; modal.hidden=true;
    modal.innerHTML=
      '<div class="pincard" role="dialog" aria-modal="true" aria-labelledby="pinTitle">'+
        '<h4 id="pinTitle">Вход для учителя</h4>'+
        '<p id="pinHint">Код нужен, чтобы школьник не распечатал контрольную вместе с ответами. '+
          'Код хранится только на этом устройстве.</p>'+
        '<input id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" '+
          'placeholder="••••" aria-label="Код учителя">'+
        '<div class="perr" id="pinErr"></div>'+
        '<div class="pacts">'+
          '<button type="button" class="trbtn ghost" id="pinCancel">Отмена</button>'+
          '<button type="button" class="trbtn" id="pinOk">Войти</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(modal);
    modal.addEventListener("click", function(e){ if(e.target===modal) close(); });
    document.getElementById("pinCancel").addEventListener("click", close);
    document.getElementById("pinOk").addEventListener("click", submit);
    document.getElementById("pinInput").addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); submit(); }
    });
    return modal;
  }
  let cb=null, setup=false;
  function close(){ if(modal) modal.hidden=true; const f=cb; cb=null; setup=false; return f; }
  function open(needSetup, callback){
    ensureModal();
    cb=callback; setup=needSetup;
    document.getElementById("pinTitle").textContent = needSetup? "Придумайте код учителя" : "Вход для учителя";
    document.getElementById("pinHint").textContent = needSetup
      ? "Четыре цифры. Код понадобится, чтобы печатать варианты с ключом и видеть отчёт. Запомните его — восстановить нельзя."
      : "Введите код, который вы задали. Код хранится только на этом устройстве.";
    document.getElementById("pinOk").textContent = needSetup? "Сохранить" : "Войти";
    document.getElementById("pinInput").value="";
    document.getElementById("pinErr").textContent="";
    modal.hidden=false;
    setTimeout(function(){ const i=document.getElementById("pinInput"); if(i) i.focus(); }, 40);
  }
  function submit(){
    const inp=document.getElementById("pinInput");
    const err=document.getElementById("pinErr");
    const val=String(inp.value||"").trim();
    const now=Date.now();
    if(FAIL.until>now){
      err.textContent="Слишком много попыток. Подождите "+Math.ceil((FAIL.until-now)/1000)+" с.";
      return;
    }
    if(setup){
      if(!/^\d{4}$/.test(val)){ err.textContent="Нужно ровно 4 цифры."; return; }
      setPin(val); setTeacherOn(true);
      const done=close(); if(done) done();
      return;
    }
    if(val===getPin()){
      FAIL={n:0, until:0};
      setTeacherOn(true);
      const done=close(); if(done) done();
      return;
    }
    FAIL.n++;
    if(FAIL.n>=3){
      FAIL={n:0, until:now+30000};
      err.textContent="Три неверные попытки. Пауза 30 секунд.";
    }else{
      err.textContent="Неверный код. Осталось попыток: "+(3-FAIL.n)+".";
    }
    inp.value="";
  }

  function ask(callback){
    if(isTeacher()){ callback(); return; }
    if(!getPin()) open(true, callback);
    else open(false, callback);
  }
  function logout(){
    setTeacherOn(false);
    try{ CLASS_STATE.answers=false; }catch(e){}
    if(document.getElementById("classPanel") && !document.getElementById("classPanel").hidden) clRenderPanel();
    if(document.getElementById("dashPanel") && !document.getElementById("dashPanel").hidden) V4UI.renderDash();
  }

  /* делегирование: кнопки в «Дэше» и в «Классе» */
  document.addEventListener("click", function(e){
    const t=e.target.closest && e.target.closest("#teacherBtn, #teacherOut");
    if(!t) return;
    if(t.id==="teacherOut"){ logout(); return; }
    ask(function(){
      V4UI.renderDash();
      const cp=document.getElementById("classPanel");
      if(cp && !cp.hidden) clRenderPanel();
    });
  });

  /* после входа/выхода перерисовываем «Дэш» */
  window.__teacher={ask:ask, isTeacher:isTeacher, logout:logout, hasPin:function(){ return !!getPin(); }};
})();

/* ============================================================ */
/*  ПЕРЕХВАТ ОШИБОК (B3): вместо пустого экрана — понятная карточка */
/* ============================================================ */
(function(){
  let shown=false;
  let card=null;

  function report(){
    let errs=[];
    try{ errs=JSON.parse(sessionStorage.getItem("v4.errlog")||"[]"); }catch(e){}
    const nav=window.navigator||{};
    return [
      "Решатель "+APP_VERSION,
      "страница: "+location.href,
      "устройство: "+screen.width+"×"+screen.height+" @"+(window.devicePixelRatio||1),
      "браузер: "+(nav.userAgent||"—"),
      "язык: "+(nav.language||"—"),
      "схема данных: "+STORE.get("v4.schema",0)+", хранилище: "+(STORE.degraded()? "недоступно":"ок"),
      "время: "+new Date().toISOString(),
      "ошибки:",
      errs.length? errs.map(function(e,i){
        return "  "+(i+1)+") "+e.t+" "+e.msg+(e.src? " ("+e.src+":"+e.line+")":"");
      }).join("\n") : "  нет"
    ].join("\n");
  }

  function el(tag,cls,text){
    const n=document.createElement(tag);
    if(cls) n.className=cls;
    if(text) n.textContent=text;
    return n;
  }
  function build(){
    if(card) return card;
    card=el("div","crashcard"); card.id="crashCard";
    card.setAttribute("role","alertdialog");
    card.setAttribute("aria-live","assertive");
    const h=el("b",null,"Что-то пошло не так");
    const p=el("p",null,"Приложение продолжает работать, прогресс не потерян. Можно сообщить об ошибке учителю — просто скопируйте отчёт.");
    const row=el("div","crashacts");
    const b1=el("button","trbtn","Перезагрузить"); b1.type="button";
    const b2=el("button","trbtn ghost","Скопировать отчёт"); b2.type="button";
    const b3=el("button","trbtn ghost","Продолжить"); b3.type="button";
    b1.addEventListener("click",function(){ location.reload(); });
    b2.addEventListener("click",function(){
      const txt=report();
      const done=function(ok){
        b2.textContent = ok? "Скопировано ✓" : "Не вышло, выделите текст";
        if(!ok){
          const ta=el("textarea","crashcopy"); ta.value=txt; ta.readOnly=true;
          card.appendChild(ta); ta.select();
        }
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
      }else{
        try{
          const ta=el("textarea","crashcopy"); ta.value=txt; document.body.appendChild(ta);
          ta.select(); const ok=document.execCommand && document.execCommand("copy");
          document.body.removeChild(ta); done(ok);
        }catch(e){ done(false); }
      }
    });
    b3.addEventListener("click",function(){ card.hidden=true; });
    row.appendChild(b1); row.appendChild(b2); row.appendChild(b3);
    card.appendChild(h); card.appendChild(p); card.appendChild(row);
    document.body.appendChild(card);
    return card;
  }

  function show(msg,extra){
    logErr(msg,extra);
    if(shown) return;
    shown=true;
    try{
      const c=build();
      c.hidden=false;
      /* не мешаем читать: карточка уходит сама через минуту */
      setTimeout(function(){ if(card) card.hidden=true; }, 60000);
    }catch(e){}
  }

  window.addEventListener("error", function(e){
    if(!e) return;
    /* ошибки загрузки картинок и прочих ресурсов сюда тоже попадают — отфильтруем */
    if(e.target && e.target!==window && e.target.tagName) return;
    show(e.message||"неизвестная ошибка", {src:e.filename, line:e.lineno});
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    const r=e && e.reason;
    show(r && r.message? r.message : String(r), {src:"promise"});
  });
  window.__crash={report:report, show:show};
})();

window.__storeNotice=function(){
  if(document.getElementById("storeWarn")) return;
  const n=document.createElement("div");
  n.id="storeWarn"; n.className="storewarn"; n.setAttribute("role","status");

function fmt(v){
  if(!isFinite(v)) return "—";
  if(Math.abs(v-Math.round(v))<1e-9) return String(Math.round(v)).replace("-",MINUS);

}

  <div class="modesw" id="modesw" role="tablist" aria-label="Режим работы">
    <button type="button" class="modebtn on" data-mode="solve" role="tab" aria-selected="true">
      <span class="mi">ƒ</span> Решатель
    </button>
    <button type="button" class="modebtn" data-mode="train" role="tab" aria-selected="false" hidden>
      <span class="mi">🎓</span> Тренировка
    </button>
    <button type="button" class="modebtn" data-mode="convert" role="tab" aria-selected="false">
      <span class="mi">⇄</span> Конвертер
    </button>
    <button type="button" class="modebtn" data-mode="tests" role="tab" aria-selected="false">
      <span class="mi">✓</span> Тесты
    </button>
    <button type="button" class="modebtn" data-mode="class" role="tab" aria-selected="false">
      <span class="mi">▤</span> Класс
    </button>
    <button type="button" class="modebtn" data-mode="dash" role="tab" aria-selected="false">
      <span class="mi">▦</span> Дэш
    </button>
  </div>

  <section class="convpanel" id="convpanel" hidden>
    <div class="convcat" id="convcat">
      <button type="button" class="catpill on" data-cat="length">Длина</button>
      <button type="button" class="catpill" data-cat="mass">Масса</button>
      <button type="button" class="catpill" data-cat="speed">Скорость</button>
      <button type="button" class="catpill" data-cat="time">Время</button>
    </div>

    <div class="convbox">
      <div class="cvline">
        <input id="cvin" type="text" inputmode="decimal" spellcheck="false" value="5"
               aria-label="Значение для перевода">

      <div class="cvmiddle">

        <span class="cvrel" id="cvrel"></span>

        <div class="cvout" id="cvout">—</div>
        <select id="cvto" aria-label="В какую единицу"></select>
      </div>
    </div>

    <p class="cvhint" id="cvhint"></p>

    <details class="cvstepsbox">
      <summary><span>Как это считается</span><span class="chev">▾</span></summary>
      <div class="cvsteps" id="cvsteps"></div>

    <div class="chips cvexamples" id="cvexamples"></div>

  <section class="testpanel" id="testPanel" hidden></section>

    <span class="ico">⌕</span>

      placeholder="Вставьте уравнение или текст задачи">

  <div class="toolrow">

    </button>

      <span class="b" aria-hidden="true"></span><span>Проверь меня</span>
    </button>
    <button type="button" class="fx-toggle" id="fxtoggle" title="Бегущая обводка вокруг готового ответа">
      <span class="b" aria-hidden="true"></span><span>✨ Подсветка</span>
    </button>
    <button type="button" class="fx-toggle" id="kbbtn" title="Экранная клавиатура: x, ², дроби">
      <span class="b" aria-hidden="true"></span><span>Клавиатура</span>
    </button>
    <button type="button" class="clear-btn" id="histbtn" title="Что решали сегодня">История</button>

    <div class="mhead">

      <span class="mnote" id="motionNote"></span>

<script>
(function(){
"use strict";

/* ============================================================ */
/*  0. ХРАНИЛИЩЕ, СХЕМА ДАННЫХ, ПЕРЕХВАТ ОШИБОК (B3, B4, B6)    */
/* ============================================================ */
const APP_VERSION="4.4.0";
const STORE=(function(){
  const SCHEMA=5;
  const mem=Object.create(null);
  let ok=true, degraded=false, warned=false;

  /* проверяем не «есть ли объект», а «можно ли записать»: в приватном режиме
     Safari localStorage существует, но падает на первой записи */
  try{
    const probe="__probe__"+Date.now();
    localStorage.setItem(probe,"1");
    localStorage.removeItem(probe);
  }catch(e){
    ok=false; degraded=true;
  }

  function notice(){
    if(warned) return;
    warned=true;
    try{ if(typeof window.__storeNotice==="function") window.__storeNotice(); }catch(e){}
  }
  function getRaw(k){
    if(!ok) return (k in mem)? mem[k] : null;
    try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k] : null; }
  }
  function setRaw(k,v){
    if(!ok){ mem[k]=v; notice(); return; }
    try{ localStorage.setItem(k,v); }
    catch(e){
      ok=false; degraded=true; mem[k]=v; notice();
    }
  }
  function delRaw(k){
    if(!ok){ delete mem[k]; return; }
    try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; }
  }
  function get(k,d){
    const raw=getRaw(k);
    if(raw===null||raw===undefined) return d;
    try{ return JSON.parse(raw); }catch(e){ return d; }
  }
  function set(k,v){ setRaw(k, JSON.stringify(v)); }
  /* для ключей, где лежит уже готовая строка (история, настройки «solver.*»):
     JSON.stringify поверх строки добавил бы кавычки и данные разъехались бы */
  function setStr(k,v){ setRaw(k, String(v)); }
  function keys(prefix){
    const out=[];
    if(!ok){ for(const k in mem){ if(!prefix||k.indexOf(prefix)===0) out.push(k); } return out; }
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && (!prefix||k.indexOf(prefix)===0)) out.push(k);
      }
    }catch(e){}
    return out;
  }

  /* ---- миграции: старые данные приводим к текущей схеме ---- */
  function num(v,d){ const n=parseInt(v,10); return isFinite(n)? n : d; }
  const MIGRATE={
    /* v5: приводим типы в порядок и чиним возможные «строки вместо чисел» */
    5:function(){
      const xp=get("v4.xp",0); if(typeof xp!=="number") set("v4.xp", num(xp,0));
      const st=get("v4.daystreak",{n:0,d:""});
      if(typeof st!=="object"||st===null) set("v4.daystreak",{n:0,d:""});
      else set("v4.daystreak",{n:num(st.n,0), d:String(st.d||"")});
      const achv=get("v4.achv",[]);
      if(!Array.isArray(achv)) set("v4.achv",[]);
      const hist=get("v4.hist",[]);
      if(!Array.isArray(hist)) set("v4.hist",[]);
      const c=get("v4.counters",{total:0,byDay:{}});
      if(typeof c!=="object"||c===null) set("v4.counters",{total:0,byDay:{}});
      else{
        c.total=num(c.total,0);
        if(typeof c.byDay!=="object"||c.byDay===null) c.byDay={};
        set("v4.counters",c);
      }
      const q=get("v4.quests",null);
      if(q && typeof q!=="object") set("v4.quests",null);
      const th=get("v4.theme","light");
      if(["light","dark","neon","retro"].indexOf(th)<0) set("v4.theme","light");
    }
  };
  function migrate(){
    let from=num(get("v4.schema",0),0);
    const first=!from;
    if(from<SCHEMA){
      for(let v=from+1; v<=SCHEMA; v++){
        const fn=MIGRATE[v];
        if(fn){ try{ fn(); }catch(e){ logErr("migrate "+v+": "+e.message); } }
      }
    }
    set("v4.schema",SCHEMA);
    return {from:from, to:SCHEMA, first:first};
  }

  /* ---- экспорт и импорт прогресса (B5) ---- */
  function snapshot(){
    const data={};
    keys("").forEach(function(k){
      if(k.indexOf("v4.")===0 || k.indexOf("solver.")===0){
        const raw=getRaw(k);
        if(raw!==null && raw!==undefined) data[k]=raw;
      }
    });
    return {
      app:"reshatel", version:APP_VERSION, schema:SCHEMA,
      exported:new Date().toISOString(),
      data:data
    };
  }
  function restore(obj){
    if(!obj || typeof obj!=="object") throw new Error("Файл не похож на сохранение прогресса.");
    if(obj.app && obj.app!=="reshatel") throw new Error("Это файл от другого приложения.");
    if(!obj.data || typeof obj.data!=="object") throw new Error("В файле нет данных прогресса.");
    let n=0;
    Object.keys(obj.data).forEach(function(k){
      if(k.indexOf("v4.")!==0 && k.indexOf("solver.")!==0) return;
      const v=obj.data[k];
      if(typeof v!=="string") return;
      setRaw(k,v); n++;
    });
    set("v4.schema",SCHEMA);
    return n;
  }
  function clearAll(){
    keys("").forEach(function(k){
      if(k.indexOf("v4.")===0 || k.indexOf("solver.")===0) delRaw(k);
    });
  }
  function isDegraded(){ return degraded; }

  return {SCHEMA:SCHEMA, get:get, set:set, setStr:setStr, remove:delRaw, keys:keys, migrate:migrate,
          snapshot:snapshot, restore:restore, clearAll:clearAll, degraded:isDegraded,
          getRaw:getRaw};
})();

/* журнал последних ошибок — только в памяти вкладки (B3) */
function logErr(msg, extra){
  try{
    let arr=[];
    try{ arr=JSON.parse(sessionStorage.getItem("v4.errlog")||"[]"); }catch(e){ arr=[]; }
    arr.push({t:new Date().toISOString(), msg:String(msg).slice(0,300),
              src:String((extra&&extra.src)||"").slice(0,120), line:(extra&&extra.line)||0});
    while(arr.length>5) arr.shift();
    sessionStorage.setItem("v4.errlog", JSON.stringify(arr));
  }catch(e){}
}

/* ============================================================ */
/*  1. Точные дроби                                              */
/* ============================================================ */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}

class Frac{
  constructor(n,d){
    if(d===undefined) d=1;
    if(!isFinite(n)||!isFinite(d)) throw new Error("Слишком большое число");
    if(d===0) throw new Error("Деление на ноль");
    if(d<0){n=-n;d=-d;}
    const g=gcd(n,d)||1;
    this.n=n/g; this.d=d/g;
  }
  add(o){return new Frac(this.n*o.d+o.n*this.d, this.d*o.d);}
  sub(o){return new Frac(this.n*o.d-o.n*this.d, this.d*o.d);}
  mul(o){return new Frac(this.n*o.n, this.d*o.d);}
  div(o){ if(o.n===0) throw new Error("Деление на ноль"); return new Frac(this.n*o.d, this.d*o.n); }
  neg(){return new Frac(-this.n,this.d);}
  abs(){return new Frac(Math.abs(this.n),this.d);}
  isZero(){return this.n===0;}
  isOne(){return this.n===1&&this.d===1;}
  isInt(){return this.d===1;}
  val(){return this.n/this.d;}
  toString(){return this.d===1? String(this.n) : this.n+"/"+this.d;}
}
const F0=()=>new Frac(0), F1=()=>new Frac(1);

function fracStr(f){
  return f.d===1? String(f.n).replace("-","−") : (f.n<0?"−":"")+Math.abs(f.n)+"/"+f.d;
}
/* аккуратная запись: целое, короткая десятичная или дробь */
function niceFrac(f){
  if(f.d===1) return String(f.n).replace("-","−");
  const v=f.n/f.d;
  const r=Math.round(v*1000)/1000;
  if(Math.abs(v-r)<1e-9) return String(r).replace(".",",");
  return (f.n<0?"−":"")+Math.abs(f.n)+"/"+f.d;
}
function n2s(x,dig){
  if(!isFinite(x)) return "—";
  const p=Math.pow(10, dig===undefined?6:dig);
  const r=Math.round(x*p)/p;
  return String(r).replace(".",",");
}
function parseNum(s){ return parseFloat(String(s).replace(",",".")); }
function fracFromStr(s){
  s=String(s).replace(",",".");
  const k=s.indexOf(".");
  if(k<0) return new Frac(parseInt(s,10),1);
  const dec=s.length-k-1;
  return new Frac(parseInt(s.replace(".",""),10), Math.pow(10,dec));
}

/* ============================================================ */
/*  2. Многочлены (степень ≤ 2)                                  */
/* ============================================================ */
let EXPANDED=false;   /* ставится, когда раскрывались скобки */

class Poly{
  constructor(c){
    const a=c.slice();
    while(a.length>1 && a[a.length-1].isZero()) a.pop();
    this.c=a;
  }
  static num(k){ return new Poly([k instanceof Frac? k : new Frac(k)]); }
  static varx(){ return new Poly([F0(), F1()]); }
  deg(){ return this.c.length-1; }
  cf(i){ return i<this.c.length? this.c[i] : F0(); }
  isZero(){ return this.deg()===0 && this.c[0].isZero(); }
  add(o){
    const n=Math.max(this.c.length,o.c.length), r=[];
    for(let i=0;i<n;i++) r.push(this.cf(i).add(o.cf(i)));
    return new Poly(r);
  }
  sub(o){
    const n=Math.max(this.c.length,o.c.length), r=[];
    for(let i=0;i<n;i++) r.push(this.cf(i).sub(o.cf(i)));
    return new Poly(r);
  }
  neg(){ return new Poly(this.c.map(f=>f.neg())); }
  mul(o){
    if(this.deg()>0 && o.deg()>0) EXPANDED=true;
    const n=this.deg()+o.deg(), r=[];
    for(let i=0;i<=n;i++) r.push(F0());
    for(let i=0;i<=this.deg();i++)
      for(let j=0;j<=o.deg();j++)
        r[i+j]=r[i+j].add(this.c[i].mul(o.c[j]));
    return new Poly(r);
  }
  scale(f){ return new Poly(this.c.map(c=>c.mul(f))); }
  evalAt(x){ /* x: Frac */
    let acc=F0();
    for(let i=this.deg();i>=0;i--) acc=acc.mul(x).add(this.cf(i));
    return acc;
  }
  evalNum(x){
    let acc=0;
    for(let i=this.deg();i>=0;i--) acc=acc*x+this.cf(i).val();
    return acc;
  }
}

function polyHtml(p, v){
  if(p.isZero()) return "0";
  let out="";
  for(let i=p.deg();i>=0;i--){
    const c=p.cf(i);
    if(c.isZero()) continue;
    const neg=c.n<0, a=c.abs();
    let s;
    if(i===0){ s=fracStr(a); }
    else {
      const coef = a.isOne()? "" : (a.d===1? String(a.n) : "("+a.n+"/"+a.d+")");
      s = coef + (i===1? v : v+"<sup>"+i+"</sup>");
    }
    if(!out) out=(neg?"−":"")+s;
    else out += (neg? " − " : " + ") + s;
  }
  return out;
}
function coefXStr(f,v){
  if(f.isZero()) return "";
  const a=f.abs();
  const coef = a.isOne()? "" : (a.d===1? String(a.n) : "("+a.n+"/"+a.d+")");
  return coef+v;
}

/* ============================================================ */
/*  3. Токены и разбор выражения                                 */
/* ============================================================ */
function tokenize(src){
  let s=src.toLowerCase()
    .replace(/(\d),(\d)/g,"$1.$2")
    .replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
    .replace(/[−–—]/g,"-")
    .replace(/[×·∙⋅]/g,"*")
    .replace(/[÷:]/g,"÷")
    .replace(/[{[]/g,"(").replace(/[}\]]/g,")")
    .replace(/\s+/g,"");
  const toks=[]; let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){
      let j=i;
      while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const str=s.slice(i,j);
      if((str.match(/\./g)||[]).length>1) throw new Error("Не понял число «"+str+"».");
      toks.push({t:"num", v:fracFromStr(str)});
      i=j; continue;
    }
    if(/[a-zа-яё]/.test(ch)){
      let j=i;
      while(j<s.length && /[a-zа-яё]/.test(s[j])) j++;
      const w=s.slice(i,j);
      if(w.length>1) throw new Error("Не понял запись «"+w+"». Неизвестное обозначайте одной буквой: x.");
      toks.push({t:"var"}); i=j; continue;
    }
    if("+-*/^()".indexOf(ch)>=0){ toks.push({t:"op", v:ch}); i++; continue; }
    throw new Error("Непонятный символ «"+ch+"».");
  }
  /* неявное умножение: 2x, 3(x+1), x(x-1) */
  const out=[];
  for(let k=0;k<toks.length;k++){
    const p=toks[k-1], c=toks[k];
    if(p && c && (p.t==="num"||p.t==="var"||(p.t==="op"&&p.v===")")) &&
       (c.t==="num"||c.t==="var"||(c.t==="op"&&c.v==="("))){
      out.push({t:"op", v:"*"});
    }
    out.push(c);
  }
  return out;
}

class Parser{
  constructor(toks){ this.t=toks; this.i=0; }
  peek(){ return this.t[this.i]; }
  next(){ return this.t[this.i++]; }
  parse(){
    if(!this.t.length) throw new Error("Пустое выражение.");
    const p=this.expr();
    if(this.i<this.t.length) throw new Error("В выражении лишние символы.");
    return p;
  }
  expr(){
    let p=this.term();
    for(;;){
      const t=this.peek();
      if(t && t.t==="op" && (t.v==="+"||t.v==="-")){
        this.next();
        const q=this.term();
        p = t.v==="+"? p.add(q) : p.sub(q);
      } else return p;
    }
  }
  term(){
    let p=this.unary();
    for(;;){
      const t=this.peek();
      if(t && t.t==="op" && (t.v==="*"||t.v==="/")){
        this.next();
        const q=this.unary();
        if(t.v==="*") p=p.mul(q);
        else{
          if(q.deg()>0) throw new Error("Неизвестное оказалось в знаменателе — это уже не линейное и не квадратное уравнение.");
          if(q.isZero()) throw new Error("Деление на ноль.");
          p=p.scale(q.c[0].neg().isZero()?F0():F1().div(q.c[0]));
        }
      } else return p;
    }
  }
  unary(){
    const t=this.peek();
    if(t && t.t==="op" && (t.v==="-"||t.v==="+")){
      this.next();
      const p=this.unary();
      return t.v==="-" ? p.neg() : p;
    }
    return this.power();
  }
  power(){
    let base=this.atom();
    for(;;){
      const t=this.peek();
      if(t && t.t==="op" && t.v==="^"){
        this.next();
        let sign=1;
        const s=this.peek();
        if(s && s.t==="op" && (s.v==="-"||s.v==="+")){ this.next(); if(s.v==="-") sign=-1; }
        const tok=this.next();
        if(!tok || tok.t!=="num" || tok.v.d!==1) throw new Error("Степень должна быть целым числом.");
        const e=tok.v.n*sign;
        if(e<0) throw new Error("Отрицательные степени не поддерживаются.");
        if(e>6) throw new Error("Слишком большая степень — этот калькулятор решает уравнения до шестой.");
        if(e>2 && base.deg()*e>6) throw new Error("Слишком высокая степень уравнения — такое я не решаю.");
        let r=Poly.num(1);
        for(let k=0;k<e;k++) r=r.mul(base);
        if(e>=2 && base.deg()>0) EXPANDED=true;
        base=r;
      } else return base;
    }
  }
  atom(){
    const t=this.next();
    if(!t) throw new Error("Выражение обрывается — проверьте запись.");
    if(t.t==="num") return new Poly([t.v]);
    if(t.t==="var") return Poly.varx();
    if(t.t==="op" && t.v==="("){
      const p=this.expr();
      const c=this.next();
      if(!c || c.t!=="op" || c.v!==")") throw new Error("Не хватает закрывающей скобки.");
      return p;
    }
    throw new Error("Неожиданный символ «"+(t.v||"")+"».");
  }
}

function parsePoly(src){
  return new Parser(tokenize(src)).parse();
}
function detectVar(s){
  const m=(s.match(/[a-z]/gi)||[]);
  return m.length? m[0].toLowerCase() : null;
}

/* ============================================================ */
/*  4. Вёрстка шага                                              */
/* ============================================================ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* то же, но и для кавычек: только для значений атрибутов (value="…") */
const escAttr = s => esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const eq = (s,big) => '<div class="eq'+(big?" big":"")+'">'+s+"</div>";
function plainText(html){
  return String(html).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ")
    .replace(/&minus;|&mdash;/g,"−").replace(/&amp;/g,"и").replace(/&lt;/g,"").replace(/&gt;/g,"")
    .replace(/\s+/g," ").trim();
}
function stepsHtml(steps){
  const canSay=(typeof window!=="undefined" && window.__LEARN && window.__LEARN.canSpeak && window.__LEARN.canSpeak());
  return '<ol class="steps">'+steps.map(function(st,i){
    const ex=explainFor(st.h);
    const say=plainText(st.h+" "+st.b);
    return '<li><div class="snum">'+(i+1)+'</div>'+
             '<div class="sbody">'+
               '<div class="sh">'+st.h+
                 (ex? ' <button type="button" class="why" data-why="'+i+'">почему?</button>':'')+
                 (canSay? ' <button type="button" class="saybtn" data-say="'+escAttr(say.slice(0,300))+'" '+
                    'aria-label="Озвучить шаг" title="Озвучить шаг">🔊</button>':'')+
               '</div>'+
               '<div class="sb">'+st.b+'</div>'+
               (ex? '<div class="whybox" data-box="'+i+'" hidden>'+ex+'</div>' : '')+
             '</div></li>';
  }).join("")+"</ol>";
}

/* подсветка односимвольных латинских переменных внутри формул */
function colorizeMath(root){
  if(!root) return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[]; let n;
  while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(function(t){
    const v=t.nodeValue;
    /* переменные, числа, знаки — каждый своим цветом (v4.0) */
    if(!/[a-z0-9+\u2212\u00d7\u00b7:=\/]/i.test(v)) return;
    if(t.parentNode && t.parentNode.closest && t.parentNode.closest(".whybox,button,script,style")) return;
    const frag=document.createDocumentFragment();
    let buf="";
    const flush=function(){ if(buf){ frag.appendChild(document.createTextNode(buf)); buf=""; } };
    const span=function(cls,txt){
      flush();
      const el=document.createElement("span");
      el.className=cls; el.textContent=txt;
      frag.appendChild(el);
    };
    let i=0;
    while(i<v.length){
      const ch=v[i];
      /* число: 12, 3,5, 1/2 — дробь красим как число целиком */
      if(/[0-9]/.test(ch)){
        let j=i;
        while(j<v.length && /[0-9.,]/.test(v[j])) j++;
        if(j<v.length && v[j]==="/" && j+1<v.length && /[0-9]/.test(v[j+1])){
          let k=j+1;
          while(k<v.length && /[0-9]/.test(v[k])) k++;
          span("math-num", v.slice(i,k));
          i=k; continue;
        }
        span("math-num", v.slice(i,j));
        i=j; continue;
      }
      /* одиночная латинская буква — переменная */
      if(/[a-zA-Z]/.test(ch)){
        let j=i;
        while(j<v.length && /[a-zA-Zа-яА-ЯёЁ]/.test(v[j])) j++;
        const w=v.slice(i,j);
        if(w.length===1 && /[a-zA-Z]/.test(w)) span("v", w);
        else buf+=w;
        i=j; continue;
      }
      /* знаки действий */
      if(ch==="+"||ch==="−"||ch==="×"||ch==="·"||ch===":"||ch==="="||ch==="÷"){
        span("math-op", ch); i++; continue;
      }
      buf+=ch; i++;
    }
    flush();
    t.parentNode.replaceChild(frag,t);
  });
}

/* значение каждого слагаемого при подстановке x — для проверки */
function fracPow(f,k){ let r=F1(); for(let i=0;i<k;i++) r=r.mul(f); return r; }
function polySubstNum(p,v,x){
  const parts=[];
  for(let i=p.deg();i>=0;i--){
    const c=p.cf(i);
    if(c.isZero()) continue;
    parts.push(c.mul(fracPow(x,i)));
  }
  if(!parts.length) return "0";
  let out=(parts[0].n<0? "−":"")+fracStr(parts[0].abs());
  for(let k=1;k<parts.length;k++){
    out += (parts[k].n<0? " − ":" + ")+fracStr(parts[k].abs());
  }
  return out;
}

/* ============================================================ */
/*  5. Линейное уравнение                                        */
/* ============================================================ */
function linSolution(L,R,v,exp,src){
  const a1=L.cf(1), b1=L.cf(0), a2=R.cf(1), b2=R.cf(0);
  const a=a1.sub(a2);
  const b=b2.sub(b1);
  const steps=[];

  steps.push({
    h:"Записываем уравнение",
    b: eq(esc(src), true) +
       "<p>Неизвестное <b>"+v+"</b> входит только в первой степени, значит уравнение линейное. Стратегия простая: собрать все слагаемые с "+v+" в одной части, все числа — в другой, и разделить.</p>"
  });

  if(exp){
    steps.push({
      h:"Раскрываем скобки и приводим подобные",
      b: eq(polyHtml(L,v)+" = "+polyHtml(R,v)) +
         "<p>Сначала убираем скобки: множитель перед скобкой умножаем на каждое слагаемое внутри — не забывая про знак. Затем складываем похожие слагаемые внутри каждой части.</p>"
    });
  }

  /* перенос */
  let left = coefXStr(a1,v) || "0";
  let right = b2.isZero()? "0" : fracStr(b2);
  const note=[];
  if(!a2.isZero()){
    left = left + (a2.n>0? " − " : " + ") + coefXStr(a2.abs(),v);
  } else {
    note.push("в правой части слагаемых с "+v+" нет — переносить нечего");
  }
  if(!b1.isZero()){
    right = right + (b1.n>0? " − " : " + ") + fracStr(b1.abs());
  } else {
    note.push("в левой части нет свободного числа");
  }
  const movedStr = left+" = "+right;
  const simpStr  = (coefXStr(a,v)||"0")+" = "+fracStr(b);

  steps.push({
    h:"Переносим слагаемые через знак «равно»",
    b: eq(movedStr) +
       "<p>Правило: при переносе слагаемого в другую часть уравнения его знак меняется на противоположный. Слагаемые с "+v+
       " отправляем влево, свободные числа — вправо."+
       (note.length? " Учтём: "+note.join("; ")+"." : "")+"</p>"
  });

  if(movedStr!==simpStr){
    steps.push({
      h:"Приводим подобные слагаемые",
      b: eq(simpStr) +
         "<p>Слева складываем коэффициенты при "+v+
         (a.isInt()? " ("+fracStr(a1)+" и "+fracStr(a2.neg())+"): " : ": ")+
         "получаем "+fracStr(a)+". Справа считаем числа: "+fracStr(b)+".</p>"
    });
  }

  let answer, extra="";
  if(a.isZero()){
    if(b.isZero()){
      answer = "любое число";
      steps.push({
        h:"Смотрим, что осталось",
        b: eq("0 = 0") +
           "<p>Коэффициент при "+v+" обнулился, и само равенство стало верным при любом значении. Такое уравнение — <b>тождество</b>: подходит любое "+v+".</p>"
      });
    } else {
      answer = "решений нет";
      steps.push({
        h:"Смотрим, что осталось",
        b: eq("0 = "+fracStr(b)) +
           "<p>Коэффициент при "+v+" равен нулю, а число справа — нет. Ноль не может быть равен "+fracStr(b)+
           " ни при каком "+v+", поэтому корней нет.</p>"
      });
    }
  } else {
    const x0=b.div(a);
    let s = "Делим обе части на коэффициент при "+v+" — на "+fracStr(a)+":";
    steps.push({
      h:"Находим корень",
      b: s + eq(v+" = "+fracStr(b)+" : "+((a.n<0||a.d!==1)? "("+fracStr(a)+")":fracStr(a))+" = "+fracStr(x0), true) +
         (x0.isInt()? "" : "<p>Точное значение — дробь "+fracStr(x0)+
           ". Если нужна десятичная запись: "+v+" ≈ "+n2s(x0.val())+".</p>")
    });
    answer = v+" = "+fracStr(x0);

    /* проверка */
    const Lv=L.evalAt(x0), Rv=R.evalAt(x0);
    steps.push({
      h:"Проверяем подстановкой",
      b: eq("Левая часть: "+polySubstNum(L,v,x0)+" = "+fracStr(Lv)) +
         eq("Правая часть: "+polySubstNum(R,v,x0)+" = "+fracStr(Rv)) +
         "<p>Подставили "+v+" = "+fracStr(x0)+" в исходное уравнение. Обе части дали "+fracStr(Lv)+
         ", значит корень найден верно.</p>"
    });
  }

  return {kind:"Линейное уравнение", steps:steps, answer:answer};
}

/* ============================================================ */
/*  6. Квадратное уравнение                                      */
/* ============================================================ */
function sqrtParts(f){
  /* sqrt(n/d) = (k/d)·sqrt(r), где n·d = k²·r */
  let num=f.n*f.d, den=f.d, k=1, r=num;
  for(let i=2;i*i<=r;i++){
    while(r%(i*i)===0){ r/=i*i; k*=i; }
  }
  return {out:new Frac(k,den), rad:r};
}
function sqrtHtml(f){
  const s=sqrtParts(f);
  if(s.rad===1) return fracStr(s.out);
  const coef = s.out.isOne()? "" : fracStr(s.out);
  return coef+"√"+s.rad;
}

function quadSolution(L,R,v,exp,src){
  const P=L.sub(R);
  const A=P.cf(2), B=P.cf(1), C=P.cf(0);
  const steps=[];
  const v2=v+"<sup>2</sup>";

  steps.push({
    h:"Записываем уравнение",
    b: eq(esc(src), true) +
       "<p>Старшая степень неизвестного — вторая, значит это квадратное уравнение. Приводим его к виду a"+v2+" + b"+v+" + c = 0 и решаем через дискриминант.</p>"
  });

  if(exp){
    steps.push({
      h:"Раскрываем скобки и приводим подобные",
      b: eq(polyHtml(L,v)+" = "+polyHtml(R,v)) +
         "<p>Множитель перед скобкой умножаем на каждое слагаемое внутри, затем складываем похожие.</p>"
    });
  }

  const alreadyStd = (polyHtml(P,v)+" = 0") === (polyHtml(L,v)+" = "+polyHtml(R,v));
  steps.push({
    h:"Приводим к стандартному виду",
    b: (alreadyStd
          ? "<p>Уравнение уже записано в виде a"+v2+" + b"+v+" + c = 0 — переносить ничего не нужно.</p>"
          : eq(polyHtml(P,v)+" = 0")+"<p>Переносим всё в одну часть (при переносе знаки меняются).</p>") +
       "<p>Коэффициенты: a = "+fracStr(A)+", b = "+fracStr(B)+", c = "+fracStr(C)+".</p>"
  });

  const D = B.mul(B).sub(new Frac(4).mul(A).mul(C));
  const Dline = "D = b² − 4ac = ("+fracStr(B)+")² − 4·("+fracStr(A)+")·("+fracStr(C)+") = "+
                fracStr(B.mul(B))+" − "+fracStr(new Frac(4).mul(A).mul(C))+" = "+fracStr(D);

  if(D.n<0){
    steps.push({
      h:"Считаем дискриминант",
      b: eq(Dline) +
         "<p>Дискриминант отрицательный (D < 0). Квадратный корень из отрицательного числа в действительных числах не извлекается — <b>действительных корней нет</b>, парабола не пересекает ось.</p>"
    });
    return {kind:"Квадратное уравнение", steps:steps, answer:"корней нет"};
  }

  steps.push({
    h:"Считаем дискриминант",
    b: eq(Dline) +
       "<p>D = "+fracStr(D)+
       (D.isZero()? " — равно нулю, значит корень один (вершина параболы касается оси)."
                  : " — больше нуля, значит корней два.")+"</p>"
  });

  const twoA = A.add(A);
  const minusB = B.neg();

  if(D.isZero()){
    const x0=minusB.div(twoA);
    return {kind:"Квадратное уравнение", steps:steps.concat([
      {h:"Подставляем в формулу корней",
       b:eq(v+" = −b / (2a) = "+fracStr(minusB)+" / "+fracStr(twoA)+" = "+fracStr(x0), true)+
         "<p>При D = 0 формула даёт одно значение: ±√D исчезает, остаётся −b/(2a). Такой корень называют двукратным — парабола касается оси в одной точке.</p>"},
      {h:"Проверяем подстановкой",
       b:eq("При "+v+" = "+fracStr(x0)+":&nbsp; слева "+polySubstNum(L,v,x0)+" = "+fracStr(L.evalAt(x0))+
            ",&nbsp; справа "+polySubstNum(R,v,x0)+" = "+fracStr(R.evalAt(x0)))+
         "<p>Части совпали — корень верный.</p>"}
    ]), answer:v+" = "+fracStr(x0)};
  }

  const sp = sqrtParts(D);
  let answer;

  if(sp.rad===1){
    const sq = sp.out;
    const x1 = minusB.add(sq).div(twoA);
    const x2 = minusB.sub(sq).div(twoA);
    const same=(x1.n===x2.n && x1.d===x2.d);
    steps.push({
      h:"Подставляем в формулу корней",
      b: eq(v+"₁,₂ = (−b ± √D) / (2a) = ("+fracStr(minusB)+" ± "+fracStr(sq)+") / "+fracStr(twoA), true) +
         (same
            ? eq(v+" = "+fracStr(x1), true)
            : eq(v+"₁ = ("+fracStr(minusB)+" + "+fracStr(sq)+") / "+fracStr(twoA)+" = "+fracStr(x1), true)+
              eq(v+"₂ = ("+fracStr(minusB)+" − "+fracStr(sq)+") / "+fracStr(twoA)+" = "+fracStr(x2), true)) +
         "<p>√D извлеклось нацело, поэтому корни точные."+
         ((x1.isInt()&&x2.isInt())? "" : " В десятичном виде: "+n2s(x1.val())+" и "+n2s(x2.val())+".")+"</p>"
    });
    answer = (x1.n===x2.n && x1.d===x2.d)
      ? v+" = "+fracStr(x1)
      : v+"₁ = "+fracStr(x1)+",&nbsp; "+v+"₂ = "+fracStr(x2);

    /* проверка */
    const c1=L.evalAt(x1), c1r=R.evalAt(x1);
    let chk = eq("При "+v+" = "+fracStr(x1)+":&nbsp; слева "+polySubstNum(L,v,x1)+" = "+fracStr(c1)+
                 ",&nbsp; справа "+polySubstNum(R,v,x1)+" = "+fracStr(c1r));
    if(!(x2.n===x1.n&&x2.d===x1.d)){
      chk += eq("При "+v+" = "+fracStr(x2)+":&nbsp; слева "+polySubstNum(L,v,x2)+" = "+fracStr(L.evalAt(x2))+
                ",&nbsp; справа "+polySubstNum(R,v,x2)+" = "+fracStr(R.evalAt(x2)));
    }
    steps.push({
      h:"Проверяем подстановкой",
      b: chk + "<p>Обе части совпали на каждом корне — решение верное.</p>"
    });
  } else {
    const f1=minusB.val()+Math.sqrt(D.val()), f2=minusB.val()-Math.sqrt(D.val());
    const d1=f1/(twoA.val()), d2=f2/(twoA.val());
    const coefFrac=sp.out.div(twoA);           /* сколько корней из r приходится на корень */
    const coefTxt = coefFrac.isOne()? "" : fracStr(coefFrac);
    const nice = coefFrac.isInt()
        ? coefTxt+"√"+sp.rad
        : (coefFrac.isOne()? "√"+sp.rad : "("+coefTxt+")√"+sp.rad);
    const exact = minusB.isZero()
        ? v+"₁,₂ = ± "+nice
        : v+"₁,₂ = ("+fracStr(minusB)+" ± "+nice+") / "+fracStr(twoA);
    steps.push({
      h:"Подставляем в формулу корней",
      b: eq(v+"₁,₂ = (−b ± √D) / (2a)", true) +
         eq(v+"₁,₂ = ("+fracStr(minusB)+" ± "+sqrtHtml(D)+") / "+fracStr(twoA)) +
         "<p>√"+fracStr(D)+" нацело не извлекается: √"+fracStr(D)+" = "+sqrtHtml(D)+
         ". Подставляем это в формулу и сокращаем:</p>" +
         eq(exact, true) +
         "<p>Это точная запись. Приближённо:</p>" +
         eq(v+"₁ ≈ "+n2s(d1)+",&nbsp;&nbsp;"+v+"₂ ≈ "+n2s(d2))
    });
    answer = exact;
  }

  return {kind:"Квадратное уравнение", steps:steps, answer:answer};
}

/*  7. Диспетчер: уравнение / выражение                          */
/* ============================================================ */
function solveEquationString(src){
  EXPANDED=false;
  const sides=src.split("=");
  if(sides.length!==2) throw new Error("В уравнении должен быть ровно один знак «=».");
  const v=detectVar(src);
  if(!v) throw new Error("В уравнении нет неизвестного.");
  const L=parsePoly(sides[0]);
  const R=parsePoly(sides[1]);
  const exp=/[()]/.test(src);   /* скобки в записи — значит есть что раскрывать */
  const D=L.sub(R);
  if(D.deg()>2){
    const hd=highDegreeSolution(L,R,v,exp,src.trim());
    if(hd) return hd;
    throw new Error("Уравнение выше второй степени — такое я пока не решаю.");
  }
  if(D.deg()===2) return quadSolution(L,R,v,exp,src.trim());
  return linSolution(L,R,v,exp,src.trim());
}

/* ============================================================ */
/*  7б. Арифметика: примеры с дробями и действиями               */
/* ============================================================ */
const APREC={"+":1,"-":1,"*":2,"/":2,"÷":2,"^":3};
function opSym2(op){
  return {"+":" + ","-":" − ","*":" · ","/":" : ","^":"^"}[op];
}

/* --- разбор в дерево --- */
function arithTokens(src){
  let s=src
    .replace(/(\d)\s*½/g,"($1+1/2)").replace(/½/g,"(1/2)")
    .replace(/(\d)\s*¼/g,"($1+1/4)").replace(/¼/g,"(1/4)")
    .replace(/(\d)\s*¾/g,"($1+3/4)").replace(/¾/g,"(3/4)")
    .replace(/(\d)\s*⅓/g,"($1+1/3)").replace(/⅓/g,"(1/3)")
    .replace(/(\d)\s*⅔/g,"($1+2/3)").replace(/⅔/g,"(2/3)")
    .replace(/(\d)[ \u00a0]+(\d+)\s*\/\s*(\d+)/g,"($1+$2/$3)")   /* 2 1/2 → (2+1/2) */
    .replace(/(\d),(\d)/g,"$1.$2")
    .replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
    .replace(/[−–—]/g,"-")
    .replace(/[×·∙⋅]/g,"*")
    .replace(/[÷:]/g,"÷")
    .replace(/[{[]/g,"(").replace(/[}\]]/g,")")
    .replace(/\s+/g,"");
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){
      let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const str=s.slice(i,j);
      if((str.match(/\./g)||[]).length>1) throw new Error("Не понял число «"+str+"».");
      /* «3/4» — это запись дроби, а не деление: склеиваем в один токен,
         если справа не продолжается цепочка (100/4/5 остаётся делением) */
      let handled=false;
      const prevCh=i>0? s[i-1] : "";
      if(s[j]==="/" && /[0-9]/.test(s[j+1]||"") && prevCh!=="/"){
        let k=j+1; while(k<s.length && /[0-9]/.test(s[k])) k++;
        const den=s.slice(j+1,k);
        const nextCh=s[k]||"";
        if(nextCh!=="/" && !/[0-9]/.test(nextCh)){
          const num=fracFromStr(str), dnum=fracFromStr(den);
          if(num.d===1 && dnum.d===1 && dnum.n!==0){
            t.push({t:"num", v:num.div(dnum), wasFrac:str+"/"+den});
            i=k; handled=true;
          }
        }
      }
      if(!handled){ t.push({t:"num", v:fracFromStr(str)}); i=j; }
      continue;
    }
    if("+-*/^÷()".indexOf(c)>=0){ t.push({t:"op", v:c}); i++; continue; }
    throw new Error("Непонятный символ «"+c+"» в примере.");
  }
  const out=[];
  for(let k=0;k<t.length;k++){
    const prev=t[k-1], cur=t[k];
    if(prev && cur &&
       (prev.t==="num" || (prev.t==="op" && prev.v===")")) &&
       (cur.t==="num" || (cur.t==="op" && cur.v==="("))){
      out.push({t:"op", v:"*"});
    }
    out.push(cur);
  }
  return out;
}

function arithParse(src){
  const t=arithTokens(src);
  let i=0;
  const peek=()=>t[i];
  function expr(){
    let n=term();
    while(peek() && peek().t==="op" && (peek().v==="+"||peek().v==="-")){
      const op=t[i++].v; n={type:"op", op:op, l:n, r:term()};
    }
    return n;
  }
  function term(){
    let n=power();
    while(peek() && peek().t==="op" && (peek().v==="*"||peek().v==="/"||peek().v==="÷")){
      let op=t[i++].v;
      if(op==="÷") op="/";
      n={type:"op", op:op, l:n, r:power()};
    }
    return n;
  }
  function power(){
    let n=unary();
    while(peek() && peek().t==="op" && peek().v==="^"){
      i++; n={type:"op", op:"^", l:n, r:unary()};
    }
    return n;
  }
  function unary(){
    const p=peek();
    if(p && p.t==="op" && (p.v==="-"||p.v==="+")){
      i++;
      const n=unary();
      return p.v==="-"? {type:"neg", a:n} : n;
    }
    return atom();
  }
  function atom(){
    const p=t[i++];
    if(!p) throw new Error("Пример обрывается — проверьте запись.");
    if(p.t==="num") return {type:"num", v:p.v};
    if(p.t==="op" && p.v==="("){
      const n=expr();
      const c=t[i++];
      if(!c || c.v!==")") throw new Error("Не хватает закрывающей скобки.");
      return n;
    }
    throw new Error("Неожиданный символ — проверьте запись примера.");
  }
  const node=expr();
  if(i<t.length) throw new Error("В примере лишние символы.");
  return node;
}

/* --- красивая дробь для формул --- */
function fracHtml(f){
  if(f.d===1) return String(f.n).replace("-","−");
  const sign=f.n<0? "−":"";
  return sign+'<span class="fr"><span class="frn">'+Math.abs(f.n)+'</span><span class="frd">'+f.d+"</span></span>";
}

/* --- печать дерева --- */
function nodeHtml(n,parentPrec,isRight){
  if(n.type==="num") return fracHtml(n.v);
  if(n.type==="neg"){
    const inner=nodeHtml(n.a,3,false);
    return "−"+(n.a.type==="op"? "("+nodeHtml(n.a,0,false)+")" : inner);
  }
  const p=APREC[n.op];
  let L=nodeHtml(n.l,p,false), R=nodeHtml(n.r,p,true);
  /* дробь: числитель/знаменатель столбиком, если оба простые */
  if(n.op==="/" && n.l.type==="num" && n.r.type==="num" && n.l.v.d===1 && n.r.v.d===1 && !n.l.v.isZero()){
    const sign=n.l.v.n*n.r.v.n<0? "−":"";
    return sign+'<span class="fr"><span class="frn">'+Math.abs(n.l.v.n)+'</span><span class="frd">'+Math.abs(n.r.v.n)+"</span></span>";
  }
  let out=L+opSym2(n.op)+R;
  if(p<parentPrec) out="("+out+")";
  return out;
}

function precOfNode(n){ return n.type==="neg"? 4 : APREC[n.op]; }

/* --- поиск следующего действия --- */
function findNext(root){
  const cands=[];
  (function walk(n){
    if(!n || n.type==="num") return;
    if(n.type==="neg"){
      if(n.a.type==="num") cands.push(n); else walk(n.a);
      return;
    }
    walk(n.l);
    if(n.l.type==="num" && n.r.type==="num") cands.push(n);
    walk(n.r);
  })(root);
  if(!cands.length) return null;
  let best=cands[0], bp=precOfNode(best);
  for(let k=1;k<cands.length;k++){
    const p=precOfNode(cands[k]);
    if(p>bp){ best=cands[k]; bp=p; }
  }
  return best;
}
function replaceNode(root,target,repl){
  if(root===target) return repl;
  if(root.type==="op"){ root.l=replaceNode(root.l,target,repl); root.r=replaceNode(root.r,target,repl); }
  else if(root.type==="neg"){ root.a=replaceNode(root.a,target,repl); }
  return root;
}

function lcm2(a,b){ return a*b/gcd(a,b); }
function reduceNote(before,after){
  if(before.d===after.d) return "";
  const g=gcd(before.n,before.d);
  return g>1? " Сократили на "+g+"." : "";
}

/* --- вычисление одного действия с объяснением --- */
function applyNode(n){
  if(n.type==="neg"){
    const v=n.a.v.neg();
    return {
      v:v,
      title:"Меняем знак числа",
      eqHtml: "−("+fracHtml(n.a.v)+") = "+fracHtml(v),
      why:"Минус перед числом меняет его знак на противоположный."
    };
  }
  const A=n.l.v, B=n.r.v, op=n.op;
  let v;
  if(op==="+") v=A.add(B);
  else if(op==="-") v=A.sub(B);
  else if(op==="*") v=A.mul(B);
  else if(op==="/"){
    if(B.isZero()) throw new Error("Деление на ноль — такого не бывает.");
    v=A.div(B);
  }
  else if(op==="^"){
    if(B.d!==1) throw new Error("Показатель степени должен быть целым числом.");
    if(Math.abs(B.n)>12) throw new Error("Слишком большая степень.");
    if(B.n<0) throw new Error("Отрицательные степени в примерах пока не считаю.");
    v=F1();
    for(let k=0;k<B.n;k++) v=v.mul(A);
  }

  let title, eqHtml, why;

  if(op==="+"||op==="-"){
    const isAdd=op==="+";
    if(A.d===1 && B.d===1){
      title = isAdd? "Складываем числа":"Вычитаем числа";
      eqHtml = fracHtml(A)+opSym2(op)+fracHtml(B)+" = "+fracHtml(v);
      why = "";
    } else if(A.d===B.d){
      title = "Знаменатели одинаковые — работаем с числителями";
      const rawNum=A.n+(isAdd? B.n : -B.n);
      const raw={n:rawNum, d:A.d};
      const g=gcd(rawNum,A.d);
      const needReduce = g>1 && A.d>1;
      const midFrac = (needReduce
          ? '<span class="fr"><span class="frn">'+rawNum+'</span><span class="frd">'+A.d+"</span></span> = "
          : "");
      eqHtml = fracHtml(A)+opSym2(op)+fracHtml(B)+" = "+
               '<span class="fr"><span class="frn">'+(isAdd? A.n+" + "+B.n : A.n+" − "+B.n)+'</span><span class="frd">'+A.d+"</span></span> = "+
               midFrac+fracHtml(v);
      why = "Знаменатель остаётся тем же, а числители "+(isAdd?"складываем":"вычитаем")+
            (A.d===1? "." : ".")+
            (needReduce? " Получилась дробь "+rawNum+"/"+A.d+" — её сократили на "+g+"." : "");
    } else {
      const L=lcm2(A.d,B.d), ka=L/A.d, kb=L/B.d;
      const na=A.n*ka, nb=B.n*kb;
      title = "Приводим к общему знаменателю";
      /* целое число не переписываем как «2/1» — только приводим дробь */
      const first  = A.d===1? fracHtml(A)  : '<span class="fr"><span class="frn">'+na+'</span><span class="frd">'+L+"</span></span>";
      const second = B.d===1? fracHtml(B)  : '<span class="fr"><span class="frn">'+nb+'</span><span class="frd">'+L+"</span></span>";
      const changed = !( (A.d===1 || A.d===L) && B.d===L );
      eqHtml = changed
        ? fracHtml(A)+opSym2(op)+fracHtml(B)+" = "+first+opSym2(op)+second+" = "+fracHtml(v)
        : fracHtml(A)+opSym2(op)+fracHtml(B)+" = "+fracHtml(v);
      why = "Общий знаменатель — "+L+": умножаем числитель и знаменатель каждой дроби на своё дополнение ("+
            ka+" и "+kb+"). Дальше знаменатели одинаковы, поэтому просто "+(isAdd?"складываем":"вычитаем")+" числители."+
            (gcd(na+(isAdd?nb:-nb), L)>1
               ? " Результат сократили на "+gcd(na+(isAdd?nb:-nb), L)+"."
               : "");
    }
  }
  else if(op==="*"){
    title="Умножаем";
    if(A.d===1 && B.d===1){
      eqHtml=fracHtml(A)+" · "+fracHtml(B)+" = "+fracHtml(v);
      why="";
    } else {
      const rawN=A.n*B.n, rawD=A.d*B.d;
      title="Умножаем дроби";
      const nTop = A.n+" · "+B.n;
      const nBot = (A.d===1? String(B.d) : (B.d===1? String(A.d) : A.d+" · "+B.d));
      const midStep = (rawN!==v.n || rawD!==v.d);
      eqHtml=fracHtml(A)+" · "+fracHtml(B)+" = "+
             '<span class="fr"><span class="frn">'+nTop+'</span><span class="frd">'+nBot+'</span></span> = '+
             (midStep? '<span class="fr"><span class="frn">'+rawN+'</span><span class="frd">'+rawD+"</span></span> = " : "")+
             fracHtml(v);
      why="Числитель умножаем на числитель, знаменатель на знаменатель."+
          reduceNote({n:rawN,d:rawD},v);
    }
  }
  else if(op==="/"){
    if(B.d===1 && A.d===1){
      title="Делим";
      eqHtml=fracHtml(A)+" : "+fracHtml(B)+" = "+fracHtml(v);
      why="";
    } else {
      title="Деление дробей";
      eqHtml=fracHtml(A)+" : "+fracHtml(B)+" = "+
             '<span class="fr"><span class="frn">'+A.n+'</span><span class="frd">'+A.d+"</span></span> · "+
             '<span class="fr"><span class="frn">'+B.d+'</span><span class="frd">'+B.n+"</span></span> = "+
             fracHtml(v);
      why="Деление заменяем умножением на <b>обратную дробь</b>: у второй дроби меняем числитель и знаменатель местами.";
    }
  }
  else if(op==="^"){
    const parts=[]; for(let k=0;k<B.n;k++) parts.push(fracStr(A));
    title="Возводим в степень";
    eqHtml=fracHtml(A)+"<sup>"+B.n+"</sup> = "+
           (B.n>1? parts.join(" · ")+" = " : "")+fracHtml(v);
    why="Степень — это умножение числа самого на себя: показатель говорит, сколько раз взять множитель.";
  }

  return {v:v, title:title, eqHtml:eqHtml, why:why};
}

/* --- сам решатель примеров --- */
function solveArithmetic(src){
  const root=arithParse(src);
  const originalHtml=nodeHtml(root,0,false);   /* до преобразований — для итога */
  const total=countOps(root);
  const steps=[];

  /* одиночная дробь: не нужен порядок действий, нужен разбор сокращения */
  if(total===0){
    const f=root.v;
    const m=/^\s*(\d+)\s*\/\s*(\d+)\s*$/.exec(src);
    const isPlainFrac = m && f.d!==1;
    if(isPlainFrac){
      const n=parseInt(m[1],10), d=parseInt(m[2],10), g=gcd(n,d);
      const parts=[
        {h:"Что за запись",
         b: eq(esc(src.trim()), true)+
            "<p>Черта дроби означает деление: числитель делим на знаменатель. Ответ принято записывать несократимой дробью — проверим, можно ли её упростить.</p>"},
        {h:"Ищем общий делитель",
         b: eq("НОД("+n+", "+d+") = "+g)+
            "<p>"+(g>1
              ? "Числа "+n+" и "+d+" делятся на "+g+" без остатка — значит дробь можно сократить."
              : "Общих делителей, кроме единицы, нет — дробь уже несократимая.")+"</p>"},
        {h:"Сокращаем",
         b: eq('<span class="fr"><span class="frn">'+n+'</span><span class="frd">'+d+'</span></span> = <span class="fr"><span class="frn">'+
              (n/g)+'</span><span class="frd">'+(d/g)+"</span></span>"+
              (f.d===1? " = "+f.n : (Math.trunc(f.n/f.d)!==0? " = "+fracAnswerHtml(f) : ""))+
              (f.d===1? " (целое число)" : ""), true)+
            "<p>Делим числитель и знаменатель на "+g+". Значение дроби при этом не меняется.</p>"}
      ];
      return {kind:"Дробь", steps:parts, answer:prettyFrac(f), answerHtml:fracAnswerHtml(f), numeric:f, isExample:true};
    }
  }

  steps.push({
    h:"Читаем пример",
    b: eq(esc(src.trim()), true) +
       "<p>Считаем <b>по порядку действий</b>:</p>"+
       "<ul><li>сначала то, что в скобках;</li>"+
       "<li>затем степени;</li>"+
       "<li>потом умножение и деление — слева направо;</li>"+
       "<li>и в самом конце сложение и вычитание — тоже слева направо.</li></ul>"+
       (/(^|[^\d])[\d]+\s*\/\s*[\d]/.test(src)
          ? "<p>Дроби вида <b>3/4</b> — это деление числителя на знаменатель, а действия с ними выполняем по правилам дробей.</p>"
          : "")
  });

  let cur=root, guard=0;
  while(cur.type!=="num"){
    if(++guard>60) throw new Error("Слишком сложный пример.");
    const target=findNext(cur);
    if(!target) throw new Error("Не получилось разобрать пример.");
    const info=applyNode(target);
    cur=replaceNode(cur,target,{type:"num", v:info.v});
    const done=total-countOps(cur);
    steps.push({
      h:(total>1? "Шаг "+done+" из "+total+". " : "Шаг "+done+". ")+info.title,
      b: eq(info.eqHtml) +
         (info.why? "<p>"+info.why+"</p>" : "") +
         (cur.type!=="num"
            ? "<p>Теперь пример выглядит так:</p>"+eq(nodeHtml(cur,0,false))
            : "")
    });
  }

  const val=cur.v;
  let answer=prettyFrac(val);
  const extra=[];
  if(val.d!==1){
    extra.push("в десятичной записи это ≈ "+n2s(val.val(),6));
  }

  steps.push({
    h:"Готово",
    b: eq(originalHtml+" = "+fracAnswerHtml(val), true) +
       "<p>Все действия выполнены, пример решён.</p>"
  });

  return {
    kind:"Пример на действия"+(val.d!==1? " с дробями":""),
    steps:steps,
    answer:answer,
    answerHtml:fracAnswerHtml(val),
    numeric: val,
    isExample:true
  };
}

function countOps(n){
  if(!n || n.type==="num") return 0;
  if(n.type==="neg") return 1+countOps(n.a);
  return 1+countOps(n.l)+countOps(n.r);
}
function fracAnswerHtml(f){
  if(f.d===1) return String(f.n).replace("-","−");
  const whole=Math.trunc(f.n/f.d);
  const rest=Math.abs(f.n)%f.d;
  if(whole!==0 && rest!==0){
    return (whole<0?"−":"")+Math.abs(whole)+"&nbsp;"+'<span class="fr"><span class="frn">'+rest+'</span><span class="frd">'+f.d+"</span></span>";
  }
  if(whole!==0 && rest===0) return String(whole).replace("-","−");
  return '<span class="fr"><span class="frn">'+(f.n<0?"−"+Math.abs(f.n):f.n)+'</span><span class="frd">'+f.d+"</span></span>";
}

function prettyFrac(f){
  if(f.d===1) return String(f.n).replace("-","−");
  const whole=Math.trunc(f.n/f.d);
  const rest=Math.abs(f.n)%f.d;
  if(whole!==0 && rest!==0){
    return (whole<0?"−":"")+Math.abs(whole)+" "+rest+"/"+f.d;
  }
  return fracStr(f);
}

/* ============================================================ */
/*  7в. Значение выражения при заданном значении переменной       */
/* ============================================================ */
const VAR_SET_RE=/(?:^|[\s,;])(?:при|если|где)\s+([a-zA-Z])\s*=\s*([-−–—]?\s*\d+(?:[.,]\d+)?(?:\s*\/\s*[-−–—]?\s*\d+)?)\s*[.;!?]?\s*$/i;

function parseValueFrac(str){
  let t=str.replace(/[−–—]/g,"-").replace(/\s+/g,"");
  if(t.indexOf("/")>=0){
    const p=t.split("/");
    if(p.length!==2) throw new Error("Не понял значение переменной.");
    return fracFromStr(p[0]).div(fracFromStr(p[1]));
  }
  return fracFromStr(t);
}

/* подставляем значение вместо буквы: «3x» → «3·(0,25)» */
function substExpr(src,v,valStr){
  let s=src.replace(/\s+/g," ").trim();
  const need = /^[-−]/.test(valStr);            /* отрицательное — в скобки */
  const val = need? "("+valStr+")" : valStr;
  const notNextLetter="(?![a-zA-Zа-яА-Я])";
  s=s.replace(new RegExp("([0-9)])"+notNextLetter+"?\\s*"+v+notNextLetter,"g"), "$1·"+val);
  s=s.replace(new RegExp("(^|[^a-zA-Zа-яА-Я])"+v+notNextLetter,"g"), "$1"+val);
  return s;
}

/* как выглядит многочлен после подстановки: «12·0,25 − 17» и «3 − 17» */
function polyAtDisplay(P,v,valStr){
  const partsSub=[], partsRes=[];
  for(let i=P.deg();i>=0;i--){
    const c=P.cf(i);
    if(c.isZero()) continue;
    const sgn=c.n<0? "−":"+";
    const a=c.abs();
    let coreSub, coreRes;
    if(i===0){
      coreSub=fracStr(a);
      coreRes=fracStr(a);
    } else {
      const coef=(a.isOne()? "" : fracStr(a));
      const pow=(i===1? v : v+"²");
      coreSub=coef+"·"+valStr+(i===2? "²":"");
      coreRes=fracStr(a.mul(fracPow(fracFromStr(valStr.replace(/[−–—]/g,"-")),i)));
      void pow;
    }
    partsSub.push({sgn:sgn, txt:coreSub});
    partsRes.push({sgn:sgn, txt:coreRes});
  }
  if(!partsSub.length) return ["0","0"];
  function join(list){
    return list.map(function(p,idx){
      if(idx===0) return (p.sgn==="−"? "−":"")+p.txt;
      return (p.sgn==="−"? " − ":" + ")+p.txt;
    }).join("");
  }
  return [join(partsSub), join(partsRes)];
}

function solveSubstitution(src){
  const m=VAR_SET_RE.exec(src);
  if(!m) return null;

  const exprRaw=src.slice(0,m.index).replace(/[\s,;]+$/,"").trim();
  const v=m[1].toLowerCase();
  const valTyped=m[2].replace(/\s+/g,"").replace(/[−–—]/g,"-");
  const valShow =valTyped.replace(/-/g,"−");     /* для показа человеку */
  if(!exprRaw) return null;

  const letters=[...new Set((exprRaw.match(/[a-zA-Z]/g)||[]).map(function(c){ return c.toLowerCase(); }))];
  if(!letters.length){
    throw new Error("В выражении нет переменной, которую нужно заменить. Запишите, например: 2(3x − 1) при x = 0,25");
  }
  if(letters.length>1){
    throw new Error("В выражении несколько разных букв. Сейчас я подставляю значение только в выражение с одной переменной.");
  }
  if(letters[0]!==v){
    throw new Error("В выражении переменная «"+letters[0]+"», а значение задано для «"+v+"». Запишите одинаково.");
  }

  const x0=parseValueFrac(valTyped);
  const valNum=String(x0.val()).replace(".",",").replace("-","−");
  const valStr=valNum;
  const steps=[];

  const valHuman = (x0.d===1 ? valStr : valStr+" (это дробь "+fracStr(x0)+")");

  steps.push({
    h:"Что нужно сделать",
    b: eq(esc(exprRaw)+"&nbsp;&nbsp;при&nbsp;&nbsp;"+v+" = "+esc(valShow), true) +
       "<p>Это не уравнение: значение "+v+" уже задано числом. Порядок работы такой: <b>сначала упростим выражение</b>, "+
       "и только потом подставим число. Так считают на контрольной — и ошибиться труднее: короткое выражение считать проще.</p>"
  });

  /* ---------- ШАГ 1: упрощение ---------- */
  let poly=null;
  try{ poly=parsePoly(exprRaw); }catch(e){ poly=null; }

  if(!poly || poly.deg()>2){
    /* упростить символьно не можем — честно говорим и считаем подстановкой */
    steps.push({
      h:"Упрощаем выражение",
      b:"<p>Это выражение не сводится к многочлену первой или второй степени, поэтому упростить его символьно я не могу — "+
        "посчитаю сразу с подстановкой числа.</p>"
    });
    return finishBySubstitution(steps,exprRaw,v,valStr,x0,valHuman);
  }

  const simp=polyHtml(poly,v);
  const norm=a=>a.replace(/\s/g,"").replace(/[−–—]/g,"-").replace(/²/g,"^2").replace(/\*/g,"");
  const hasBrackets=/\(/.test(exprRaw);
  const changed=hasBrackets && norm(simp)!==norm(exprRaw);

  if(changed){
    steps.push({
      h:"Раскрываем скобки",
      b: eq(esc(exprRaw)) +
         "<p>Множитель перед скобкой умножаем на <b>каждое</b> слагаемое внутри скобки, следя за знаками:</p>"+
         "<ul>"+expandNote(exprRaw,v)+"</ul>"
    });
    steps.push({
      h:"Приводим подобные слагаемые",
      b: eq(simp) +
         "<p>Слагаемые с "+v+" складываем между собой, числа — между собой. Получилось короткое выражение: "+
         (poly.deg()===1
            ? "коэффициент при "+v+" равен "+fracStr(poly.cf(1))+
              (poly.cf(0).isZero()? ", свободного члена нет." : ", свободный член "+fracStr(poly.cf(0))+".")
            : "коэффициенты: "+fracStr(poly.cf(2))+" при "+v+"², "+fracStr(poly.cf(1))+" при "+v+", "+fracStr(poly.cf(0))+" свободный.")+"</p>"
    });
  } else if(hasBrackets){
    steps.push({
      h:"Упрощаем выражение",
      b: eq(simp) +
         "<p>После раскрытия скобок подобных слагаемых не осталось — выражение уже в простейшем виде.</p>"
    });
  } else {
    steps.push({
      h:"Упрощаем выражение",
      b: eq(simp) +
         "<p>Скобок нет, подобные слагаемые приводить не нужно — выражение уже упрощено. Подставляем значение.</p>"
    });
  }

  return finishBySubstitution(steps,exprRaw,v,valStr,x0,valHuman,simp,poly);

  function finishBySubstitution(steps,exprRaw,v,valStr,x0,valHuman,simp,poly){
    /* ---------- ШАГ 2: подстановка в упрощённое выражение ---------- */
    const target = simp || exprRaw;
    const substStr = substExpr(target,v,valStr);

    steps.push({
      h:"Подставляем "+v+" = "+valHuman,
      b: eq(esc(target)+"&nbsp;&nbsp;при&nbsp;&nbsp;"+v+" = "+valStr+"&nbsp;&nbsp;⇒&nbsp;&nbsp;"+esc(substStr), true) +
         "<p>Теперь вместо "+v+" ставим число "+valStr+". Подставляем именно в упрощённое выражение — так короче счёт.</p>"
    });

    let exact=null;
    if(poly){
      exact=poly.evalAt(x0);
      const pair=polyAtDisplay(poly,v,valStr);
      steps.push({
        h:"Считаем",
        b: eq(pair[0]+" = "+pair[1]+" = "+fracStr(exact), true) +
           "<p>Сначала умножение, потом сложение и вычитание.</p>"
      });
    } else {
      let arith=null;
      try{ arith=solveArithmetic(substStr); }catch(e){ arith=null; }
      if(arith && arith.numeric){
        exact=arith.numeric;
        arith.steps.filter(function(st){ return /^Шаг/.test(st.h); }).forEach(function(st){
          steps.push({h:st.h.replace(/^Шаг\s+\d+(?:\s+из\s+\d+)?\.\s*/,""), b:st.b});
        });
      }
    }

    if(!exact) throw new Error("Не удалось вычислить значение выражения.");

    steps.push({
      h:"Готово",
      b: eq(esc(exprRaw)+"&nbsp;&nbsp;при&nbsp;&nbsp;"+v+" = "+valStr+"&nbsp;&nbsp;=&nbsp;&nbsp;"+fracAnswerHtml(exact), true) +
         "<p>Сначала упростили, потом подставили — значение найдено.</p>"
    });

    return {
      kind:"Значение выражения при "+v+" = "+valShow,
      steps:steps,
      answer:prettyFrac(exact),
      answerHtml:fracAnswerHtml(exact),
      numeric:exact
    };
  }
}

/* разбивает выражение на слагаемые верхнего уровня */
function splitTerms(expr){
  const parts=[]; let depth=0, cur="", sign=1;
  for(let i=0;i<expr.length;i++){
    const ch=expr[i];
    if(ch==="(") depth++;
    if(ch===")") depth--;
    if(depth===0 && (ch==="+"||ch==="-") && cur.trim()!==""){
      parts.push({sign:sign, txt:cur.trim()});
      sign = ch==="-" ? -1 : 1;
      cur="";
      continue;
    }
    if(depth===0 && (ch==="+"||ch==="-") && cur.trim()===""){ 
      sign = ch==="-" ? -sign : sign;
      continue;
    }
    cur+=ch;
  }
  if(cur.trim()!=="") parts.push({sign:sign, txt:cur.trim()});
  return parts;
}

/* «2(3x − 1) + 3(2x − 5)» → пункты с реальными результатами раскрытия */
function expandNote(expr,v){
  const terms=splitTerms(expr);
  const items=[]; const opened=[];
  terms.forEach(function(t){
    const hasParen=/\(/.test(t.txt);
    let poly=null;
    try{ poly=parsePoly(t.txt); }catch(e){ poly=null; }
    if(!poly) return;
    const res=polyHtml(poly,v);
    if(hasParen){
      const m=/^(-?\d*)\s*\(([^()]*)\)$/.exec(t.txt);
      let how=res;
      if(m){
        const k=m[1]===""? "1" : (m[1]==="-"? "−1" : m[1]);
        how = k+"·("+esc(m[2])+") = "+res;
      } else {
        how = esc(t.txt)+" = "+res;
      }
      items.push("<li>"+(t.sign<0? "−":"")+how+"</li>");
    } else {
      items.push("<li>"+(t.sign<0? "−":"")+(hasParen? esc(t.txt) : res)+"</li>");
      return;
    }
    opened.push({sign:t.sign, html:res});
  });
  if(!items.length) return "<li>числовых множителей перед скобками нет</li>";

  /* промежуточная запись без приведения подобных */
  let mid="";
  opened.forEach(function(o,i){
    if(i===0) mid += (o.sign<0? "−":"")+o.html;
    else mid += (o.sign<0? " − ":" + ")+o.html;
  });
  return items.join("") + (mid? "<li class=\"mid\">после раскрытия: <b>"+mid+"</b></li>" : "");
}

/* ============================================================ */
/*  7г. Конвертация единиц: метры, килограммы, часы и другие     */
/* ============================================================ */
/* factor — сколько базовых единиц в одной такой:

const UNIT_CATS=[

  ]},
  {id:"speed", base:"м/с", title:"Скорость", acc:"скорость", icon:"🏃", units:[

    {key:"км/ч",   fn:5,  fd:18,  g:"f", num:"км", den:"ч",   stems:[], names:["км/ч","км/ч","км/ч"]},
    {key:"м/с",    fn:1,  fd:1,   g:"f", num:"м",  den:"с",   stems:[], names:["м/с","м/с","м/с"]},

    {key:"м/ч",    fn:1,  fd:3600,g:"f", num:"м",  den:"ч",   stems:[], names:["м/ч","м/ч","м/ч"]}
  ]},

    {key:"нед", f:"604800",  g:"f", stems:["недел","нед"],            names:["неделя","недели","недель"]},
    {key:"сут", f:"86400",   g:"m", stems:["сутк","суток","сут","день","дня","дней"], names:["день","дня","дней"]},
    {key:"ч",   f:"3600",    g:"m", stems:["час","ч"],                names:["час","часа","часов"]},
    {key:"мин", f:"60",      g:"f", stems:["минут","мин"],            names:["минута","минуты","минут"]},

  ]}

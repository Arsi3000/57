}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function plural(n,f){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20) return f[2]; if(b===1) return f[0]; if(b>=2&&b<=4) return f[1]; return f[2]; }
function reduceFrac(a,b){
  if(!b) return null;
  const g=gcd(a,b); let p=a/g, q=b/g;
  if(q<0){ p=-p; q=-q; }
  return q===1? String(p).replace("-",MINUS) : p+"/"+q;
}

/* ---------- безопасный счёт выражения: по действиям ---------- */
function tokenize(src){
  const s=norm(src).replace(/[·×*]/g,"*").replace(/[:÷]/g,"/").replace(/,/g,".")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,"");
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9]/.test(c)){
      let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const v=parseFloat(s.slice(i,j));
      if(!isFinite(v)) return null;
      out.push({t:"num", v:v}); i=j; continue;
    }
    if("+-*/()".indexOf(c)>=0){ out.push({t:c}); i++; continue; }
    return null;
  }
  return out;
}
function toRPN(tokens){
  const prec={u:4,"*":3,"/":3,"+":2,"-":2};
  const out=[], ops=[]; let prev=null;
  for(let k=0;k<tokens.length;k++){
    const tk=tokens[k];
    if(tk.t==="num"){ out.push(tk); prev="num"; continue; }
    if(tk.t==="("){ ops.push(tk); prev="("; continue; }
    if(tk.t===")"){
      while(ops.length && ops[ops.length-1].t!=="(") out.push(ops.pop());
      if(!ops.length) return null;
      ops.pop(); prev=")"; continue;
    }
    let op=tk.t;
    if(op==="-" && (prev===null || prev==="op" || prev==="(")) op="u";
    if(op==="+" && (prev===null || prev==="op" || prev==="(")){ prev="op"; continue; }
    while(ops.length){
      const top=ops[ops.length-1];
      if(top.t==="(") break;
      const p1=prec[op], p2=prec[top.t];
      if(p2>p1 || (p2===p1 && op!=="u")) out.push(ops.pop()); else break;
    }
    ops.push({t:op}); prev="op";
  }
  while(ops.length){ const t=ops.pop(); if(t.t==="(") return null; out.push(t); }
  return out;
}
function evalRPN(rpn){
  const st=[], logs=[];
  for(let i=0;i<rpn.length;i++){
    const tk=rpn[i];
    if(tk.t==="num"){ st.push({v:tk.v}); continue; }
    if(tk.t==="u"){ const a=st.pop(); if(!a) return null; st.push({v:-a.v}); continue; }
    const b=st.pop(), a=st.pop();
    if(!a||!b) return null;
    let v;
    if(tk.t==="+") v=a.v+b.v;
    else if(tk.t==="-") v=a.v-b.v;
    else if(tk.t==="*") v=a.v*b.v;
    else { if(b.v===0) return null; v=a.v/b.v; }
    logs.push({t:tk.t, a:a.v, b:b.v, v:v});
    st.push({v:v});
  }
  if(st.length!==1) return null;
  return {value:st[0].v, logs:logs};
}
const OPNAME={"+":"+","-":MINUS,"*":"·","/":":"};
function evalExpr(src){
  const tk=tokenize(src);
  if(!tk || !tk.length) return null;
  const rpn=toRPN(tk);
  if(!rpn) return null;
  const r=evalRPN(rpn);
  if(!r) return null;
  return r;
}
function opsHtml(logs, kinds){
  return logs.filter(function(l){ return kinds.indexOf(l.t)>=0; })
    .map(function(l){
      return '<div class="eq mini">'+fmt(l.a)+" "+OPNAME[l.t]+" "+fmt(l.b)+" = "+fmt(l.v)+"</div>";
    }).join("");
}

/* ---------- 1. Отрицательные числа ---------- */
function makeNeg(){
  const kind=Math.floor(Math.random()*4);
  const a=-(1+Math.floor(Math.random()*20));
  const b=1+Math.floor(Math.random()*20);
  if(kind===0) return fmt(a)+" + "+fmt(b);
  if(kind===1) return fmt(b)+" "+MINUS+" ("+fmt(a)+")";
  if(kind===2) return fmt(a)+" "+MINUS+" "+fmt(b);
  return fmt(a)+" · ("+fmt(-b)+")";
}
function solveNeg(s){
  if(/[a-zа-яё=]/i.test(s)) return null;
  /* дроби, степени и корни — не наша тема: у решателя для них свой точный счёт */
  if(/[\/^√|]/.test(s)) return null;
  /* берём только выражения, где действительно есть отрицательное число */
  const t=norm(s);
  if(!/(^|[\s(*:+-])-\d/.test(t)) return null;
  if(!/[+\-−]/.test(s)) return null;
  const r=evalExpr(s);
  if(!r) return null;
  const steps=[
    {h:"Смотрим на знаки", b:eq(esc(norm(s).replace(/-/g,MINUS)),true)+
      "<p>Минус перед числом — это его знак. Если минусов два, они дают плюс: "+
      "«минус на минус — плюс».</p>"},
    {h:"Считаем по действиям", b:(opsHtml(r.logs,["*"])||"<p>Здесь только сложение и вычитание.</p>")+
      (opsHtml(r.logs,["+","-"])? '<p class="mini">Сложение и вычитание:</p>'+opsHtml(r.logs,["+","-"]) : "")},
    {h:"Ответ", b:'<p class="ans">'+fmt(r.value)+"</p>"}
  ];
  return {kind:"Действия с отрицательными числами", steps:steps, answer:fmt(r.value)};
}

/* ---------- 2. НОД и НОК ---------- */
function makeGcd(){
  const a=2+Math.floor(Math.random()*11)*2, b=3+Math.floor(Math.random()*11)*3;
  return Math.random()<.5
    ? "НОД("+a+", "+b+")"
    : "НОК("+a+", "+b+")";
}
function factorText(n){
  const parts=[]; let m=n, d=2;
  while(m>1 && d*d<=m){
    let k=0;
    while(m%d===0){ m/=d; k++; }
    if(k) parts.push(d+(k>1? "<sup>"+k+"</sup>":""));
    d++;
  }
  if(m>1) parts.push(String(m));
  return parts.join(" · ");
}
function solveGcdNok(s){
  const isNod=/НОД/i.test(s), isNok=/НОК/i.test(s);
  if(!isNod && !isNok) return null;
  const m=s.match(/(\d+)[^\d]+(\d+)/);
  if(!m) return null;
  const a=parseInt(m[1],10), b=parseInt(m[2],10);
  const g=gcd(a,b), l=lcm(a,b);
  const steps=[
    {h:"Раскладываем числа на простые множители", b:
      '<div class="eq mini">'+a+" = "+factorText(a)+'</div>'+
      '<div class="eq mini">'+b+" = "+factorText(b)+"</div>"},
    {h:isNod? "Берём общие множители" : "Берём все множители, общие — один раз", b:
      '<p>'+(isNod
        ? "НОД — произведение <b>общих</b> множителей."
        : "НОК — произведение <b>всех</b> множителей, причём общие берём по одному разу.")+"</p>"},
    {h:"Результат", b:'<p class="ans">'+(isNod? "НОД":"НОК")+"("+a+", "+b+") = "+(isNod? g : l)+"</p>"}
  ];
  return {kind:"НОД и НОК", steps:steps, answer:String(isNod? g : l)};
}

/* ---------- 3. Пропорции и масштаб ---------- */
function makeProp(){
  if(Math.random()<.5){
    const a=2+Math.floor(Math.random()*8), b=2+Math.floor(Math.random()*9), k=2+Math.floor(Math.random()*5);
    return "Решите пропорцию: "+a+" : "+b+" = x : "+(b*k);
  }
  const sc=[100,200,500,1000,5000,10000,50000,100000,200000][Math.floor(Math.random()*9)];
  const cm=1+Math.floor(Math.random()*9);
  return "Масштаб карты 1 : "+sc+". Отрезок на карте "+cm+" см. Сколько это на местности в километрах?";
}
function solveProp(s){
  if(/пропорци/i.test(s)){
    const m=norm(s).match(/(\d+)\s*:\s*(\d+)\s*=\s*[xх]\s*:\s*(\d+)/i);
    if(!m) return null;
    const a=+m[1], b=+m[2], c=+m[3];
    const x=a*c/b;
    return {kind:"Пропорция", answer:fmt(x), steps:[
      {h:"Пропорция — это равенство двух отношений", b:eq(a+" : "+b+" = x : "+c,true)+
        "<p>Произведение крайних членов равно произведению средних.</p>"},
      {h:"Перемножаем крест-накрест", b:eq(a+" · "+c+" = "+b+" · x")+
        '<div class="eq mini">'+fmt(a*c)+" = "+b+" · x</div>"},
      {h:"Находим x", b:eq("x = "+fmt(a*c)+" : "+b+" = "+fmt(x))},
      {h:"Ответ", b:'<p class="ans">x = '+fmt(x)+"</p>"}
    ]};
  }
  if(/масштаб/i.test(s)){
    const m=norm(s).match(/1\s*:\s*(\d+)/);
    const cm=norm(s).match(/(\d+)\s*см/);
    if(!m || !cm) return null;
    const sc=+m[1], c=+cm[1];
    const cmReal=c*sc;
    const km=cmReal/100000;
    return {kind:"Масштаб", answer:fmt(km)+" км", steps:[
      {h:"Что означает масштаб", b:eq("1 : "+sc,true)+
        "<p>Один сантиметр на карте — это "+sc+" сантиметров на местности.</p>"},
      {h:"Переводим в сантиметры местности", b:eq(c+" · "+sc+" = "+cmReal+" см")},
      {h:"Переводим в километры", b:"<p>В 1 км — 100 000 см, значит делим на 100 000:</p>"+
        eq(cmReal+" см = "+fmt(km)+" км")},
      {h:"Ответ", b:'<p class="ans">'+fmt(km)+" км</p>"}
    ]};
  }
  return null;
}

/* ---------- 4. Модуль ---------- */
function makeAbs(){
  const a=-(1+Math.floor(Math.random()*19)), b=1+Math.floor(Math.random()*12);
  const kind=Math.floor(Math.random()*3);
  if(kind===0) return "|"+fmt(a)+"| + |"+b+"|";
  if(kind===1) return "|"+fmt(a)+"| · "+b;
  return "|"+fmt(a)+"| "+MINUS+" |"+fmt(b)+"|";
}
function solveAbs(s){
  if(s.indexOf("|")<0) return null;
  const parts=[];
  let text=norm(s), guard=0;
  while(text.indexOf("|")>=0 && guard++<8){
    const m=text.match(/\|(-?\d+(?:[.,]\d+)?)\|/);
    if(!m) break;
    const v=parseFloat(m[1].replace(",","."));
    parts.push("|"+fmt(v)+"| = "+fmt(Math.abs(v)));
    text=text.slice(0,m.index)+fmt(Math.abs(v))+text.slice(m.index+m[0].length);
  }
  if(!parts.length) return null;
  const r=evalExpr(text);
  if(!r) return null;
  return {kind:"Модуль числа", answer:fmt(r.value), steps:[
    {h:"Модуль — это расстояние до нуля", b:"<p>Модуль числа не бывает отрицательным: он показывает, "+
      "насколько число далеко от нуля.</p>"+parts.map(function(p){ return '<div class="eq mini">'+p+"</div>"; }).join("")},
    {h:"Подставляем значения", b:eq(esc(text),true)},
    {h:"Считаем", b:opsHtml(r.logs,["*","+","-"])||"<p>Одно действие.</p>"},
    {h:"Ответ", b:'<p class="ans">'+fmt(r.value)+"</p>"}
  ]};
}

/* ---------- 5. Степени и корни ---------- */
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";
function supToInt(t){
  let out="";
  for(let i=0;i<t.length;i++){
    const k=SUP.indexOf(t[i]);
    if(k<0) return null;
    out+=k;
  }
  return parseInt(out,10);
}
function makePow(){
  const kind=Math.floor(Math.random()*4);
  if(kind===0){
    const a=2+Math.floor(Math.random()*3), m=2+Math.floor(Math.random()*3), n=2+Math.floor(Math.random()*3);
    return a+"^"+m+" · "+a+"^"+n;
  }
  if(kind===1){
    const a=2+Math.floor(Math.random()*4), b=2+Math.floor(Math.random()*4);
    return a+"^2 "+MINUS+" "+b+"^3";
  }
  if(kind===2){
    const r=2+Math.floor(Math.random()*11);
    return "√"+(r*r)+" + "+(1+Math.floor(Math.random()*20));
  }
  const k=2+Math.floor(Math.random()*5);
  return "("+k+"^2)^2";
}
function solvePow(s){
  /* квадрат и куб в обычном примере разбирает основной движок — не отбираем у него;
     берём корни, запись «^» и степени выше третьей */
  if(!/[√^]/.test(s) && !/[⁰⁴⁵⁶⁷⁸⁹]/.test(s)) return null;
  let text=norm(s).replace(/\^/g,function(){ return "^"; });
  const steps=[];
  /* корни */
  text=text.replace(/√\s*\(?(\d+)\)?/g, function(all,n){
    const v=Math.sqrt(parseFloat(n));
    if(Math.abs(v-Math.round(v))>1e-9) return all;
    steps.push("√"+n+" = "+fmt(v));
    return fmt(v);
  });
  /* степени */
  text=text.replace(/(\d+)\s*\^\s*(\d+)/g, function(all,a,b){
    const v=Math.pow(+a,+b);
    steps.push(a+"^"+b+" = "+fmt(v));
    return fmt(v);
  });
  /* 2⁴ в юникоде */
  text=text.replace(/(\d+)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function(all,a,b){
    const p=supToInt(b);
    if(p===null) return all;
    const v=Math.pow(+a,p);
    steps.push(a+SUP.slice(p,p+1)+" = "+fmt(v));
    return fmt(v);
  });
  const r=evalExpr(text);
  if(!r) return null;
  if(!steps.length && !r.logs.length) return null;
  return {kind:"Степени и корни", answer:fmt(r.value), steps:[
    {h:"Считаем степени и корни", b:(steps.length? steps.map(function(p){ return '<div class="eq mini">'+p+"</div>"; }).join("")
        : "<p>Готовых степеней нет — работаем с выражением как есть.</p>")+
      "<p>Корень и степень — это действия «первой очереди»: их выполняем раньше умножения и сложения.</p>"},
    {h:"Что осталось", b:eq(esc(text),true)},
    {h:"Считаем", b:opsHtml(r.logs,["*","+","-"])||"<p>Одно действие.</p>"},
    {h:"Ответ", b:'<p class="ans">'+fmt(r.value)+"</p>"}
  ]};
}

/* ---------- 6. Формулы сокращённого умножения ---------- */
function makeFsu(){
  const a=2+Math.floor(Math.random()*8);
  const kind=Math.floor(Math.random()*3);
  if(kind===0) return "(x + "+a+")^2 = x^2 + px + "+a*a+". Найдите p.";
  if(kind===1) return "x^2 "+MINUS+" "+a*a+" = (x "+MINUS+" p)(x + p). Найдите p.";
  return "(x + "+a+")(x "+MINUS+" "+a+") = x^2 "+MINUS+" c. Найдите c.";
}
function solveFsu(s){
  if(!/Найдите\s+[pc]/i.test(s)) return null;
  const m1=norm(s).match(/\(x\s*\+\s*(\d+)\)\s*\^\s*2/);
  if(m1 && /Найдите\s+p/i.test(s)){
    const a=+m1[1];
    return {kind:"Формула квадрата суммы", answer:String(2*a), steps:[
      {h:"Квадрат суммы раскрывается по формуле", b:eq("(a + b)² = a² + 2ab + b²")},
      {h:"Подставляем", b:eq("(x + "+a+")² = x² + 2 · "+a+" · x + "+a*a)},
      {h:"Сравниваем с записью в задании", b:"<p>При x стоит коэффициент 2 · "+a+" = "+(2*a)+". Значит p = "+(2*a)+".</p>"},
      {h:"Ответ", b:'<p class="ans">p = '+(2*a)+"</p>"}
    ]};
  }
  const m2=norm(s).match(/x\^2\s*-\s*(\d+)\s*=\s*\(x\s*-\s*p\)/i);
  if(m2 && /Найдите\s+p/i.test(s)){
    const v=+m2[1], a=Math.round(Math.sqrt(v));
    return {kind:"Разность квадратов", answer:String(a), steps:[
      {h:"Это разность квадратов", b:eq("a² − b² = (a − b)(a + b)")},
      {h:"Находим, что возводили в квадрат", b:eq(v+" = "+a+"²")},
      {h:"Записываем разложение", b:eq("x² − "+v+" = (x − "+a+")(x + "+a+")")},
      {h:"Ответ", b:'<p class="ans">p = '+a+"</p>"}
    ]};
  }
  const m3=norm(s).match(/\(x\s*\+\s*(\d+)\)\(x\s*-\s*(\d+)\)\s*=\s*x\^2\s*-\s*c/i);
  if(m3 && /Найдите\s+c/i.test(s)){
    const a=+m3[1];
    return {kind:"Разность квадратов", answer:String(a*a), steps:[
      {h:"Это произведение суммы и разности", b:eq("(a + b)(a − b) = a² − b²")},
      {h:"Подставляем", b:eq("(x + "+a+")(x − "+a+") = x² − "+a+"²")},
      {h:"Считаем", b:eq(a+"² = "+(a*a))},
      {h:"Ответ", b:'<p class="ans">c = '+(a*a)+"</p>"}
    ]};
  }
  return null;
}

/* ---------- 7. Линейная функция ---------- */
function lineText(k,b){
  let s="y = "+(k===1? "x" : k===-1? MINUS+"x" : fmt(k)+"x");
  if(b>0) s+=" + "+b;
  else if(b<0) s+=" "+MINUS+" "+(-b);
  return s;
}
function makeLine(){
  const k=(Math.random()<.2? -1:1)*(1+Math.floor(Math.random()*5));
  /* b не равно нулю: «+ 0» в задании выглядит как ошибка составителя */
  let b=Math.floor(Math.random()*19)-9;
  if(b===0) b=3;
  const x=Math.floor(Math.random()*9)-4;
  if(Math.random()<.5){
    return "Функция задана формулой "+lineText(k,b)+". Найдите y при x = "+fmt(x)+".";
  }
  const y=k*x+b;
  return "Функция задана формулой "+lineText(k,b)+". При каком x значение y равно "+fmt(y)+"?";
}
function coefStr(k,v){
  if(k===1) return v;
  if(k===-1) return MINUS+v;
  return fmt(k)+v;
}
function solveLine(s){
  if(!/функци/i.test(s) || !/y\s*=/i.test(s)) return null;
  const m=norm(s).match(/y\s*=\s*(-?\d*)\s*x\s*(?:([+-])\s*(\d+))?/i);
  if(!m) return null;
  let k=m[1]===""? 1 : (m[1]==="-" ? -1 : parseInt(m[1],10));
  const b=m[2]? (m[2]==="-"? -1:1)*parseInt(m[3],10) : 0;
  const atX=norm(s).match(/при\s*x\s*=\s*(-?\d+(?:[.,]\d+)?)/i);
  if(atX){
    const x=parseFloat(atX[1].replace(",","."));
    const y=k*x+b;
    return {kind:"Линейная функция", answer:fmt(y), steps:[
      {h:"Функция задаёт правило", b:eq("y = "+coefStr(k,"x")+" "+(b<0? MINUS+" "+(-b) : "+ "+b),true)},
      {h:"Подставляем x", b:eq("y = "+coefStr(k,"("+fmt(x)+")")+" "+(b<0? MINUS+" "+(-b) : "+ "+b))},
      {h:"Считаем", b:eq("y = "+fmt(k*x)+" "+(b<0? MINUS+" "+(-b) : "+ "+b)+" = "+fmt(y))},
      {h:"Ответ", b:'<p class="ans">y = '+fmt(y)+"</p>"}
    ]};
  }
  const atY=norm(s).match(/y\s*равно\s*(-?\d+(?:[.,]\d+)?)/i);
  if(atY){
    const y=parseFloat(atY[1].replace(",","."));
    const x=(y-b)/k;
    return {kind:"Линейная функция", answer:fmt(x), steps:[
      {h:"Записываем уравнение", b:eq(fmt(y)+" = "+coefStr(k,"x")+" "+(b<0? MINUS+" "+(-b) : "+ "+b),true)},
      {h:"Переносим число в левую часть", b:eq("x · "+fmt(k)+" = "+fmt(y)+" "+(b<0? "+ "+(-b) : MINUS+" "+b)+" = "+fmt(y-b))},
      {h:"Делим на коэффициент", b:eq("x = "+fmt(y-b)+" : "+fmt(k)+" = "+fmt(x))},
      {h:"Ответ", b:'<p class="ans">x = '+fmt(x)+"</p>"}
    ]};
  }
  return null;
}

/* ---------- 8. Прогрессии ---------- */
function makeProg(){
  const kind=Math.floor(Math.random()*3);
  const a1=1+Math.floor(Math.random()*9), d=1+Math.floor(Math.random()*5);
  const n=5+Math.floor(Math.random()*11);
  if(kind===0) return "Арифметическая прогрессия: a₁ = "+a1+", d = "+d+". Найдите a"+sub(n)+".";
  if(kind===1) return "Арифметическая прогрессия: a₁ = "+a1+", d = "+d+". Найдите сумму первых "+n+" членов.";
  const q=2+Math.floor(Math.random()*2), b1=1+Math.floor(Math.random()*4), m=4+Math.floor(Math.random()*3);
  return "Геометрическая прогрессия: b₁ = "+b1+", q = "+q+". Найдите b"+sub(m)+".";
}
function sub(n){
  const map={0:"₀",1:"₁",2:"₂",3:"₃",4:"₄",5:"₅",6:"₆",7:"₇",8:"₈",9:"₉"};
  return String(n).split("").map(function(c){ return map[c]||c; }).join("");
}
/* ₁₂₃ → 1,2,3: иначе номера членов не разобрать */
function desub(t){
  const map={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9"};
  return String(t).split("").map(function(c){ return map[c]||c; }).join("");
}
function solveProg(s0){
  const s=desub(norm(s0));
  if(!/прогресс/i.test(s)) return null;
  const a1m=s.match(/a1?\s*=\s*(-?\d+)/i);
  const dm=s.match(/d\s*=\s*(-?\d+)/i);
  const b1m=s.match(/b1?\s*=\s*(-?\d+)/i);
  const qm=s.match(/q\s*=\s*(-?\d+)/i);
  if(a1m && dm){
    const a1=+((a1m[1]!==undefined)?a1m[1]:a1m[2]), d=+dm[1];
    const nm=s.match(/первые\s+(\d+)/i) || s.match(/a\s*(\d+)\s*\.?\s*$/);
    const n=nm? +nm[1] : null;
    if(/сумм/i.test(s) && n){
      const sum=n*(2*a1+(n-1)*d)/2;
      return {kind:"Арифметическая прогрессия", answer:fmt(sum), steps:[
        {h:"Формула суммы", b:eq("Sₙ = (2a₁ + (n − 1)d) · n : 2")},
        {h:"Подставляем", b:eq("S"+sub(n)+" = (2 · "+a1+" + "+(n-1)+" · "+d+") · "+n+" : 2")},
        {h:"Считаем", b:'<div class="eq mini">2 · '+a1+" + "+(n-1)+" · "+d+" = "+fmt(2*a1+(n-1)*d)+"</div>"+
          '<div class="eq mini">'+fmt(2*a1+(n-1)*d)+" · "+n+" : 2 = "+fmt(sum)+"</div>"},
        {h:"Ответ", b:'<p class="ans">S = '+fmt(sum)+"</p>"}
      ]};
    }
    if(n){
      const an=a1+(n-1)*d;
      return {kind:"Арифметическая прогрессия", answer:fmt(an), steps:[
        {h:"Формула n-го члена", b:eq("aₙ = a₁ + (n − 1)d")},
        {h:"Подставляем", b:eq("a"+sub(n)+" = "+a1+" + "+(n-1)+" · "+d)},
        {h:"Считаем", b:eq("a"+sub(n)+" = "+a1+" + "+fmt((n-1)*d)+" = "+fmt(an))},
        {h:"Ответ", b:'<p class="ans">a'+sub(n)+" = "+fmt(an)+"</p>"}
      ]};
    }
  }
  if(b1m && qm){
    const b1=+((b1m[1]!==undefined)?b1m[1]:b1m[2]), q=+qm[1];
    const nm=s.match(/b\s*(\d+)\s*\.?\s*$/);
    if(nm){
      const n=+nm[1], bn=b1*Math.pow(q,n-1);
      return {kind:"Геометрическая прогрессия", answer:fmt(bn), steps:[
        {h:"Формула n-го члена", b:eq("bₙ = b₁ · qⁿ⁻¹")},
        {h:"Подставляем", b:eq("b"+sub(n)+" = "+b1+" · "+q+"^"+(n-1))},
        {h:"Считаем", b:'<div class="eq mini">'+q+"^"+(n-1)+" = "+fmt(Math.pow(q,n-1))+"</div>"+
          '<div class="eq mini">'+b1+" · "+fmt(Math.pow(q,n-1))+" = "+fmt(bn)+"</div>"},
        {h:"Ответ", b:'<p class="ans">b'+sub(n)+" = "+fmt(bn)+"</p>"}
      ]};
    }
  }
  return null;
}

/* ---------- 9. Вероятность ---------- */
function makeProb(){
  const kind=Math.floor(Math.random()*4);
  if(kind===0 || kind===1){
    const r=2+Math.floor(Math.random()*8), b=1+Math.floor(Math.random()*8);
    const wantR=(kind===0);
    return "В коробке "+r+" "+plural(r,["красный шар","красных шара","красных шаров"])+
      " и "+b+" "+plural(b,["синий шар","синих шара","синих шаров"])+
      ". Найдите вероятность того, что выбранный наугад шар окажется "+
      (wantR? "красным" : "синим")+".";
  }
  if(kind===2) return "Игральный кубик бросают один раз. Найдите вероятность того, что выпадет число больше "+
    (1+Math.floor(Math.random()*4))+".";
  const ev=["чётное число","нечётное число","число меньше 3","число меньше 5"][Math.floor(Math.random()*4)];
  return "Игральный кубик бросают один раз. Найдите вероятность того, что выпадет "+ev+".";
}
function solveProb(s){
  if(!/вероятност/i.test(s)) return null;
  /* \w в JS не знает кириллицы — пишем диапазон букв явно */
  const m=s.match(/(\d+)\s+красн[а-яё]*(?:\s+шар[а-яё]*)?\s+и\s+(\d+)\s+син[а-яё]*(?:\s+шар[а-яё]*)?/i);
  if(m){
    const r=+m[1], b=+m[2], all=r+b;
    /* спрашивают про цвет в «окажется красным/синим»; если такой оборот
       есть — верим ему, иначе смотрим на последнее упоминание шара */
    const mw=s.match(/окажется\s+(красн|син)[а-яё]*/i);
    const want = mw ? (/син/i.test(mw[1])? b : r)
                    : (/син[а-яё]*\s+шар(?!ов)/i.test(s)? b : r);
    const f=reduceFrac(want, all);
    return {kind:"Вероятность", answer:f, steps:[
      {h:"Вероятность — это доля подходящих исходов", b:eq("P = подходящие : все")},
      {h:"Считаем все шары", b:eq(r+" + "+b+" = "+all)},
      {h:"Считаем подходящие", b:"<p>Подходящих шаров: "+want+".</p>"},
      {h:"Записываем дробь", b:eq("P = "+f+(f.indexOf("/")>0? " ≈ "+fmt(want/all):""))},
      {h:"Ответ", b:'<p class="ans">'+f+"</p>"}
    ]};
  }
  if(/кубик/i.test(s)){
    const more=s.match(/больше\s*(\d+)/i), less=s.match(/меньше\s*(\d+)/i);
    let want=0, word="";
    if(more){ const k=+more[1]; want=6-k; word="больше "+k; }
    else if(less){ const k=+less[1]; want=k-1; word="меньше "+k; }
    else if(/чётн/i.test(s)){ want=3; word="чётное"; }
    else if(/нечётн/i.test(s)){ want=3; word="нечётное"; }
    else return null;
    const f=reduceFrac(want,6);
    return {kind:"Вероятность", answer:f, steps:[
      {h:"Сколько всего исходов", b:eq("у кубика 6 граней — 6 исходов")},
      {h:"Сколько подходящих", b:"<p>Подходящих («"+word+"»): "+want+".</p>"},
      {h:"Записываем вероятность", b:eq("P = "+f+(f.indexOf("/")>0? " ≈ "+fmt(want/6):""))},
      {h:"Ответ", b:'<p class="ans">'+f+"</p>"}
    ]};
  }
  return null;
}

/* ---------- 10. Округление и прикидка ---------- */
function makeRound(){
  const kind=Math.floor(Math.random()*4);
  if(kind===0){
    const i=1+Math.floor(Math.random()*20), f=String(100+Math.floor(Math.random()*899));
    return "Округлите "+i+","+f+" до сотых.";
  }
  if(kind===1){
    const n=100+Math.floor(Math.random()*9000);
    return "Округлите "+n+" до десятков.";
  }
  if(kind===2){
    const n=1000+Math.floor(Math.random()*9000);
    return "Округлите "+n+" до сотен.";
  }
  const a=40+Math.floor(Math.random()*10), b=20+Math.floor(Math.random()*10);
  return "Найдите приближённое произведение, округлив каждый множитель до десятков: "+a+" · "+b+".";
}
/* половина — всегда вверх, как учат в школе; считаем по цифрам, без плавающей точки */
function roundDecimal(raw, digits){
  const neg=raw.charAt(0)==="-";
  const body=neg? raw.slice(1):raw;
  const parts=body.split(".");
  const ip=parts[0], fp=parts[1]||"";
  if(fp.length<=digits) return (neg?MINUS:"")+ip+(digits? ","+fp.padEnd(digits,"0") : "");
  const keep=fp.slice(0,digits), next=fp.charAt(digits);
  let n=parseInt(ip+keep,10);
  if(parseInt(next,10)>=5) n+=1;
  let str=String(n);
  while(str.length<keep.length+1) str="0"+str;
  const out=digits? str.slice(0,-digits)+","+str.slice(-digits) : str;
  return (neg?MINUS:"")+out;
}
function solveRound(s){
  if(!/округл/i.test(s)) return null;
  const numM=norm(s).match(/(\d+)(?:[.,](\d+))?/);
  if(!numM) return null;
  if(/произведени/i.test(s)){
    const m=norm(s).match(/(\d+)\s*[·×*]\s*(\d+)/);
    if(!m) return null;
    const a=+m[1], b=+m[2];
    const ar=Math.round(a/10)*10, br=Math.round(b/10)*10;
    return {kind:"Прикидка", answer:String(ar*br), steps:[
      {h:"Округляем каждый множитель до десятков", b:'<div class="eq mini">'+a+" ≈ "+ar+'</div>'+
        '<div class="eq mini">'+b+" ≈ "+br+"</div>"},
      {h:"Перемножаем округлённые числа", b:eq(ar+" · "+br+" = "+(ar*br))},
      {h:"Ответ", b:'<p class="ans">≈ '+(ar*br)+"</p>"}
    ]};
  }
  let order=10, word="десятков";
  if(/до сотых/i.test(s)){ order=100; word="сотых"; }
  else if(/до тысячных/i.test(s)){ order=1000; word="тысячных"; }
  else if(/до десятков/i.test(s)){ order=10; word="десятков"; }
  else if(/до сотен/i.test(s)){ order=100; word="сотен"; }
  else if(/до целых|до единиц/i.test(s)){ order=1; word="единиц"; }
  const raw=numM[0].replace(",",".");
  const v=parseFloat(raw);
  let res, steps;
  if(/до сотых|до тысячных/i.test(s)){
    const digits=order===100? 2:3;
    /* округляем по цифрам строки: 17,275 · 100 в двоичной дроби даёт 1727,4999…,
       и Math.round ошибся бы на единицу */
    const shown=roundDecimal(raw, digits).replace(".",",");
    res=parseFloat(shown.replace(",","."));
    steps=[
      {h:"Смотрим на разряд после нужного", b:"<p>Округляем до "+word+" — значит смотрим на следующую цифру.</p>"},
      {h:"Сравниваем её с пятёркой", b:"<p>Если цифра 5 или больше — прибавляем единицу к нужному разряду, "+
        "если меньше — оставляем как есть.</p>"},
      {h:"Записываем", b:eq(raw.replace(".",",")+" ≈ "+shown,true)},
      {h:"Ответ", b:'<p class="ans">'+shown+"</p>"}
    ];
    return {kind:"Округление", answer:shown, steps:steps};
  }
  res=Math.round(v/order)*order;
  steps=[
    {h:"Выбираем нужный разряд", b:"<p>Округляем до "+word+".</p>"},
    {h:"Смотрим на следующую цифру", b:"<p>Если она 5 или больше — нужная цифра увеличивается на 1, "+
      "остальные заменяются нулями.</p>"},
    {h:"Записываем", b:eq(fmt(v)+" ≈ "+fmt(res),true)},
    {h:"Ответ", b:'<p class="ans">'+fmt(res)+"</p>"}
  ];
  return {kind:"Округление", answer:fmt(res), steps:steps};
}

/*  C. ОБУЧЕНИЕ: освоение тем, повторение, ошибки, контрольная    */

/* ============================================================ */
(function(){
"use strict";

const MINUS="−";
const esc=function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
const STORE=window.__store;
const KEY="v4.learn";
const LADDER=[1,3,7,16,30];

/* ---------- даты ---------- */
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function addDays(iso,n){
  const d=new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
}

/* ---------- состояние ---------- */
function blank(){
  return {topics:{}, mistakes:[], diag:null, exams:[], name:"", font:false, start:today()};
}
function state(){
  let st=null;
  try{ st=STORE.get(KEY, null); }catch(e){ st=null; }
  if(!st || typeof st!=="object") st=blank();
  if(!st.topics || typeof st.topics!=="object") st.topics={};
  if(!Array.isArray(st.mistakes)) st.mistakes=[];
  if(!Array.isArray(st.exams)) st.exams=[];
  if(!st.start) st.start=today();
  return st;
}
function save(st){
  st.updated=today();
  STORE.set(KEY, st);
}
function topicState(st,key){
  if(!st.topics[key]) st.topics[key]={last:[], tries:0, ok:0, clean:0, lvl:1, sOk:0, sBad:0, srs:{step:0, due:""}, first:today()};
  const t=st.topics[key];
  if(!Array.isArray(t.last)) t.last=[];
  if(!t.srs) t.srs={step:0, due:""};
  if(!t.lvl) t.lvl=1;
  if(!t.first) t.first=today();
  return t;
}

/* ---------- запись попытки ---------- */
function attempt(key, ok, hintLvl, task, userAnswer){
  const st=state();
  const t=topicState(st,key);
  t.tries++;
  if(ok) t.ok++;
  t.last.push({ok:ok?1:0, h:(hintLvl>0)?1:0, d:today()});
  while(t.last.length>20) t.last.shift();
  if(ok && !hintLvl) t.clean++;

  /* адаптивная сложность: 3 верных подряд — выше, 2 ошибки подряд — ниже */
  if(ok){
    t.sOk=(t.sOk||0)+1; t.sBad=0;
    if(t.sOk>=3 && t.lvl<3){ t.lvl++; t.sOk=0; }
  }else{
    t.sBad=(t.sBad||0)+1; t.sOk=0;
    if(t.sBad>=2 && t.lvl>1){ t.lvl--; t.sBad=0; }
  }

  /* повторение: 1 → 3 → 7 → 16 → 30 дней, ошибка возвращает к одному дню */
  if(ok && !hintLvl) t.srs.step=Math.min(LADDER.length-1,(t.srs.step||0)+1);
  else if(!ok) t.srs.step=0;
  t.srs.due=addDays(today(), LADDER[Math.min(t.srs.step||0, LADDER.length-1)]);

  if(!ok && task) addMistake(task, userAnswer, st);
  save(st);
  return {lvl:t.lvl, mastery:masteryOf(t)};
}

/* ---------- освоение ---------- */
function masteryOf(t){
  if(!t.last.length) return null;
  let ok=0;
  t.last.forEach(function(a){ if(a.ok && !a.h) ok++; });
  return Math.round(ok/t.last.length*100);
}
function mastery(key){
  const st=state();
  const t=st.topics[key];
  return t? masteryOf(t) : null;
}
function level(key){
  const st=state();
  return st.topics[key]? (st.topics[key].lvl||1) : 1;
}
function nextLevel(ok){
  /* после попытки: подсказываем, с какой сложностью давать следующее */
  return ok? 2 : 1;
}
function ranking(){
  const st=state();
  const out=[];
  Object.keys(st.topics).forEach(function(k){
    const t=topicState(st,k);
    if(!t.last.length) return;
    out.push({key:k, m:masteryOf(t), tries:t.tries, lvl:t.lvl, due:t.srs.due, step:t.srs.step});
  });
  out.sort(function(a,b){ return (a.m===null? -1:a.m)-(b.m===null? -1:b.m); });
  return out;
}
function weakest(){
  const list=ranking().filter(function(x){ return x.m!==null && x.m<70; });
  return list.length? list[0] : null;
}
function dueList(){
  const t0=today();
  return ranking().filter(function(x){ return x.due && x.due<=t0; })
    .sort(function(a,b){ return a.due<b.due? -1:1; });
}

/* ---------- ошибки ---------- */
function addMistake(task, userAnswer, st){
  st=st||state();
  const q=String(task.q||"").slice(0,300);
  /* одинаковые задания не копим: обновляем дату и ответ */
  const seen=st.mistakes.filter(function(m){ return m.q===q && !m.closed; })[0];
  if(seen){
    seen.date=today(); seen.my=String(userAnswer||""); seen.n=(seen.n||1)+1;
  }else{
    st.mistakes.unshift({
      id:"m"+Date.now()+Math.floor(Math.random()*1000),
      q:q, a:String(task.a||""), my:String(userAnswer||""),
      topic:String(task.topic||task.key||""), date:today(), closed:false, n:1
    });
  }
  while(st.mistakes.length>100) st.mistakes.pop();
  save(st);
}
function openMistakes(){
  return state().mistakes.filter(function(m){ return !m.closed; });
}
function closeMistake(id){
  const st=state();
  const m=st.mistakes.filter(function(x){ return x.id===id; })[0];
  if(m){ m.closed=true; m.closedDate=today(); save(st); }
}

  round:"Найдите нужный разряд и посмотрите на следующую цифру."
};
const HINT_RULE={
  lin:"ax + b = c ⇒ x = (c − b) : a.",
  lin2:"k(x + m) = kx + km.",
  quad:"D = b² − 4ac, x = (−b ± √D) : 2a.",
  frac:"a/b + c/d = (ad + cb) : bd.",
  percent:"p% от N — это N · p : 100.",
  motion:"S = v · t, t = S : v, v = S : t.",
  area:"S□ = a², S▭ = ab, S△ = a·h/2, S○ = πR².",
  work:"1/t = 1/t₁ + 1/t₂.",
  system:"Сложите уравнения так, чтобы одна переменная ушла.",
  neg:"−a · (−b) = ab; a − (−b) = a + b.",
  gcd:"НОД — общие множители, НОК — все, общие по одному разу.",
  prop:"a : b = c : d ⇒ a·d = b·c.",
  abs:"|a| = a при a ≥ 0, |a| = −a при a < 0.",
  pow:"aᵐ · aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐⁿ.",
  fsu:"(a + b)² = a² + 2ab + b²; a² − b² = (a − b)(a + b).",
  line:"y = kx + b: подставили x — получили y.",
  prog:"aₙ = a₁ + (n − 1)d; bₙ = b₁ · qⁿ⁻¹; Sₙ = (2a₁ + (n − 1)d)·n/2.",
  prob:"P = m : n, где m — подходящие исходы, n — все.",
  round:"5 и больше — округляем вверх, меньше — вниз."
};
function hint(key, lvl, task){
  if(lvl<=1) return HINT_DIR[key]||"Разберите условие по частям: что дано и что нужно найти.";
  if(lvl===2) return HINT_RULE[key]||"Запишите формулу, которая связывает известное и неизвестное.";
  let first="";
  try{
    const r=window.__solve(task&&task.q||"");
    if(r && r.steps && r.steps.length){
      first=String(r.steps[0].h||"").replace(/<[^>]+>/g,"");
    }
  }catch(e){ first=""; }
  return first? "Почти ответ: начните с шага «"+first+"». Дальше сами." :
    "До ответа один шаг — подставьте числа в формулу.";
}

/* ---------- подбор задания по сложности ---------- */
function complexity(q){
  const nums=(String(q).match(/\d+(?:[.,]\d+)?/g)||[]).map(function(x){ return Math.abs(parseFloat(x.replace(",","."))); });
  let s=0;
  nums.forEach(function(n){ if(n>=1000) s+=3; else if(n>=100) s+=2; else if(n>=10) s+=1; });
  s+=(String(q).match(/[−-]/g)||[]).length*0.4;
  s+=(String(q).match(/[()]/g)||[]).length*0.3;
  s+=Math.min(3,(String(q).match(/[·:^²√]/g)||[]).length);
  s+=Math.min(2, nums.length*0.35);
  return s;
}
function pickTask(key, lvl){
  lvl=Math.max(1,Math.min(3,lvl||1));
  let list=[];
  try{ list=window.__dbg.genSheet(key, 24); }catch(e){ list=[]; }
  if(!list.length) return null;
  const scored=list.map(function(t){ return {t:t, s:complexity(t.q)}; })
    .sort(function(a,b){ return a.s-b.s; });
  const pos = lvl===1? Math.floor(scored.length*0.15)
    : lvl===2? Math.floor(scored.length*0.5)
    : Math.floor(scored.length*0.85);
  const pick=scored[Math.min(scored.length-1,pos)].t;
  pick.topic=key;
  return pick;
}

/* ---------- проверка ответа ---------- */
function nums(txt){
  const m=String(txt).replace(/[−–—]/g,"-").replace(/,/g,".").match(/-?\d+(?:\.\d+)?/g)||[];
  return m.map(parseFloat);
}
function answerNums(ans){
  /* «x = 4», «5/8», «1 7/12», «12,5 см» — вытаскиваем числа и значения дробей */
  return nums(ans);
}
/* значение выражения вида «√3», «1 ± √2», «(2 ± √2)/2» — для ответов с корнем */
function numOrNull(p){
  let t=String(p).replace(/&nbsp;/g," ").replace(/[−–—]/g,"-").replace(/,/g,".").replace(/\s+/g,"");
  /* скобку после корня не съедаем: иначе «(2 ± √2) / 2» станет кривым выражением */
  t=t.replace(/√\s*\(\s*(\d+(?:[.,]\d+)?)\s*\)/g, function(all,n){ return "("+n.replace(",",".")+"**0.5)"; });
  t=t.replace(/√\s*(\d+(?:[.,]\d+)?)/g, function(all,n){ return "("+n.replace(",",".")+"**0.5)"; });
  if(!/^[\d+\-*/().]+$/.test(t.replace(/\*\*0\.5/g,""))) return null;
  try{
    const v=Function('"use strict";return ('+t+');')();
    return (typeof v==="number" && isFinite(v))? v : null;
  }catch(e){ return null; }
}
function exprValues(txt){
  /* сначала убираем подписи «x₁ = », «y₂ = »: в них бывают запятые, и они
     разорвали бы ответ на куски раньше времени */
  const clean=String(txt).replace(/&nbsp;/g," ")
    .replace(/[a-zA-Zа-яё]+\s*[₀-₉,]*\s*=/g,"");
  const parts=clean.split(/[,;]/);
  const out=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i].trim();
    if(!p) continue;
    if(p.indexOf("±")>=0){
      /* «±» может стоять и внутри скобок с делением: (2 ± √2) / 2.
         Поэтому считаем всё выражение дважды — с плюсом и с минусом */
      const v1=numOrNull(p.replace("±","+"));
      const v2=numOrNull(p.replace("±","−"));
      if(v1===null || v2===null) return null;
      out.push(v1, v2);
    }else{
      const v=numOrNull(p);
      if(v===null) return null;
      out.push(v);
    }
  }
  return out.length? out : null;
}
function nearAny(x,list,tol){
  return list.some(function(y){ return Math.abs(x-y)<=tol; });
}

function isRight(user, ans){
  const u=String(user).replace(/\s+/g,"").toLowerCase();
  const a=String(ans).replace(/\s+/g," ").toLowerCase().replace(/&nbsp;/g," ");
  if(!u) return false;
  if(u===a.replace(/\s+/g,"")) return true;
  /* ответы с корнем: сравниваем значения, а не запись */
  if(/√|±/.test(String(ans))){
    const av=exprValues(ans);
    const uv=/√/.test(String(user))? exprValues(user) : nums(user);
    if(av && uv && uv.length && uv.every(function(x){ return nearAny(x,av,0.06); })) return true;
  }
  const un=nums(user), an=nums(ans);
  if(!un.length || !an.length) return false;
  const near=function(x,list){ return list.some(function(y){ return Math.abs(x-y)<1e-6; }); };
  /* полное совпадение набора чисел (для ответов из нескольких чисел) */
  if(un.length===an.length && un.every(function(x){ return near(x,an); })) return true;
  /* дробь в ответе: 5/8 против 0,625 */
  const fr=String(user).match(/^(-?\d+)\/(\d+)$/);
  if(fr && an.length===1){
    const v=parseFloat(fr[1])/parseFloat(fr[2]);
    if(Math.abs(v-an[0])<1e-6) return true;
  }
  const fr2=String(ans).match(/^(-?\d+)\/(\d+)$/);
  if(fr2 && un.length===1){
    const v=parseFloat(fr2[1])/parseFloat(fr2[2]);
    if(Math.abs(v-un[0])<1e-6) return true;
  }
  /* главное число ответа названо (для «площадь = 25 см²», «5 км = 5000 м»):
     главным считаем последнее число — оно и есть результат */
  return un.length<=an.length && un.every(function(x){ return near(x,an); }) && near(an[an.length-1],un);
}

let EX=null, exTimer=0;

function examStart(){

function examBuild(keys, n, mins){
  const tasks=[];
  for(let i=0;i<n;i++){
    const key=keys[i%keys.length];
    const lvl=1+Math.floor(i/Math.max(1,Math.ceil(n/3)));
    const t=pickTask(key, Math.min(3,lvl));
    if(t) tasks.push(t);
  }
  EX={tasks:tasks, answers:tasks.map(function(){ return ""; }), left:mins*60, done:false};
  const w=overlay(
    '<div class="lessonhead"><h2>Контрольная</h2><div class="extime" id="exLeft">--:--</div></div>'+
    '<p class="dashnote">Решайте на бумаге или в уме, ответ вписывайте сюда. Проверка — в конце, '+
      'исправить ответ после сдачи нельзя.</p>'+
    '<ol class="exlist" id="exList"></ol>'+
    '<div class="lessonacts"><button type="button" class="trbtn" id="exSubmit">Сдать работу</button>'+
      '<button type="button" class="trbtn ghost" id="exQuit">Выйти</button></div>', "exam");
  const list=w.querySelector("#exList");
  list.innerHTML=tasks.map(function(t,i){
    return '<li><div class="exq">'+esc(t.q)+'</div>'+
      '<input type="text" class="exin" data-i="'+i+'" placeholder="Ответ" autocomplete="off" spellcheck="false"></li>';
  }).join("");
  list.querySelectorAll(".exin").forEach(function(inp){
    inp.addEventListener("input", function(){ EX.answers[+inp.getAttribute("data-i")]=inp.value; });
  });
  const left=w.querySelector("#exLeft");
  function tick(){
    const m=Math.floor(EX.left/60), s=EX.left%60;
    left.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
    left.classList.toggle("low", EX.left<=60);
    if(EX.left<=0){ clearInterval(exTimer); examFinish(w); return; }
    EX.left--;
  }
  tick(); clearInterval(exTimer); exTimer=setInterval(tick,1000);
  w.querySelector("#exSubmit").addEventListener("click", function(){
    w.querySelectorAll(".exin").forEach(function(inp){
      EX.answers[+inp.getAttribute("data-i")]=inp.value;
    });
    if(EX.answers.some(function(a){ return !String(a).trim(); })){
      if(!confirm("Есть пустые ответы. Всё равно сдать?")) return;
    }
    clearInterval(exTimer);
    examFinish(w);
  });
  w.querySelector("#exQuit").addEventListener("click", function(){
    if(!confirm("Выйти без результата? Работа не сохранится.")) return;
    clearInterval(exTimer); w.remove(); EX=null;
    if(window.__flushAchv) window.__flushAchv();
  });
}

function examFinish(w){
  if(!EX || EX.done) return;
  EX.done=true;
  clearInterval(exTimer);
  let ok=0;
  const rows=EX.tasks.map(function(t,i){
    const right=isRight(EX.answers[i], t.a);
    if(right) ok++;
    return {t:t, my:EX.answers[i], right:right};
  });
  const pct=Math.round(ok/EX.tasks.length*100);
  const mark = pct>=90? "5" : pct>=75? "4" : pct>=50? "3" : "2";
  const st=state();
  st.exams.unshift({date:today(), total:EX.tasks.length, ok:ok, pct:pct, mark:mark});
  while(st.exams.length>30) st.exams.pop();
  rows.forEach(function(r){
    const t=r.t;
    attempt(t.topic||"lin", r.right, 0, {q:t.q, a:t.a, topic:t.topic}, r.my);
  });
  save(st);

  const box=w.querySelector(".lessonbox");
  box.innerHTML=
    '<h2>Работа сдана</h2>'+
    '<div class="exresult '+((pct>=75)? "ok":"bad")+'">'+
      '<b>'+ok+" из "+EX.tasks.length+'</b><span>'+pct+"% · оценка "+mark+"</span>"+
    '</div>'+
    '<p class="dashnote">90% и больше — «5», от 75% — «4», от 50% — «3». '+
      'Ошибочные задания попали в «Мои ошибки», их можно разобрать.</p>'+
    '<ol class="exlist">'+rows.map(function(r){
      return '<li class="'+(r.right? "right":"wrong")+'">'+
        '<div class="exq">'+esc(r.t.q)+'</div>'+
        '<div class="exans">Ваш ответ: <b>'+esc(String(r.my||"—"))+'</b>'+
        (r.right? " ✓" : ' · верно: <b>'+esc(String(r.t.a))+"</b>")+'</div></li>';
    }).join("")+'</ol>'+
    '<div class="lessonacts"><button type="button" class="trbtn" id="exAgain">Ещё одна</button>'+
      '<button type="button" class="trbtn ghost" data-close>Закрыть</button></div>';
  closeBtn(w);
  box.querySelector("#exAgain").addEventListener("click", function(){ w.remove(); examStart(); });
  /* обновим «Дэш», если открыт */
  if(typeof window.__dashRefresh==="function") window.__dashRefresh();
}

const DIAG_POOL={
  "5-6":["neg","gcd","round","frac","prop","area","percent"],
  "7-8":["lin","lin2","abs","pow","fsu","line","prop","percent"],
  "9":["quad","prog","prob","system","pow","fsu","line"]
};

function diagStart(){
  const w=overlay(
    '<h2>Проверка уровня</h2>'+
    '<p class="dashnote">12 заданий по возрастанию сложности, 8–10 минут. '+
      'После — карта: что уже получается, а что стоит подтянуть.</p>'+
    '<div class="lessonrow" id="diagCls">'+
      '<button type="button" class="clchip" data-cls="5-6"><span class="bx"></span>5–6 класс</button>'+
      '<button type="button" class="clchip on" data-cls="7-8"><span class="bx">✓</span>7–8 класс</button>'+
      '<button type="button" class="clchip" data-cls="9"><span class="bx"></span>9 класс</button>'+
    '</div>'+

      '<button type="button" class="trbtn ghost" data-close>Отмена</button></div>');
  closeBtn(w);
  let cls="7-8";
  w.querySelectorAll("[data-cls]").forEach(function(b){
    b.addEventListener("click", function(){
      cls=b.getAttribute("data-cls");
      w.querySelectorAll("[data-cls]").forEach(function(x){
        const on=x===b; x.classList.toggle("on",on);
        x.querySelector(".bx").textContent=on? "✓":"";
      });
    });
  });
  w.querySelector("#diagGo").addEventListener("click", function(){ w.remove(); diagBuild(cls); });
}

function diagBuild(cls){
  const pool=DIAG_POOL[cls]||DIAG_POOL["7-8"];
  const tasks=[];
  for(let i=0;i<12;i++){
    const key=pool[i%pool.length];
    const lvl= i<4? 1 : i<8? 2 : 3;
    const t=pickTask(key, lvl);
    if(t) tasks.push(t);
  }
  const DG={tasks:tasks, answers:tasks.map(function(){ return ""; })};
  const w=overlay(
    '<div class="lessonhead"><h2>Проверка уровня</h2><div class="exnote">12 заданий</div></div>'+
    '<p class="dashnote">Не подсматривайте в решатель — так карта будет правдивой. '+
      'Не получается задание — пропустите, это тоже полезная информация.</p>'+
    '<ol class="exlist" id="dgList"></ol>'+
    '<div class="lessonacts"><button type="button" class="trbtn" id="dgGo">Показать результат</button>'+
      '<button type="button" class="trbtn ghost" data-close>Закрыть</button></div>');
  closeBtn(w);
  const list=w.querySelector("#dgList");
  list.innerHTML=tasks.map(function(t,i){
    return '<li><div class="exq">'+esc(t.q)+'</div>'+
      '<input type="text" class="exin" data-i="'+i+'" placeholder="Ответ" autocomplete="off">'+
      '</li>';
  }).join("");
  list.querySelectorAll(".exin").forEach(function(inp){
    inp.addEventListener("input", function(){ DG.answers[+inp.getAttribute("data-i")]=inp.value; });
  });
  w.querySelector("#dgGo").addEventListener("click", function(){
    w.querySelectorAll(".exin").forEach(function(inp){ DG.answers[+inp.getAttribute("data-i")]=inp.value; });
    diagResult(w, cls, DG);
  });
}

function diagResult(w, cls, DG){
  const byTopic={};
  let ok=0;
  DG.tasks.forEach(function(t,i){
    const right=isRight(DG.answers[i], t.a);
    if(right) ok++;
    const k=t.topic||"lin";
    if(!byTopic[k]) byTopic[k]={ok:0, n:0};
    byTopic[k].n++; if(right) byTopic[k].ok++;
    attempt(k, right, 0, {q:t.q, a:t.a, topic:k}, DG.answers[i]);
  });
  const st=state();
  st.diag={date:today(), cls:cls, ok:ok, n:DG.tasks.length, byTopic:byTopic};
  save(st);

  const keys=Object.keys(byTopic).sort(function(a,b){
    return (byTopic[a].ok/byTopic[a].n)-(byTopic[b].ok/byTopic[b].n);
  });
  const box=w.querySelector(".lessonbox");
  box.innerHTML=
    '<h2>Карта тем</h2>'+
    '<div class="exresult '+((ok/DG.tasks.length>=0.6)? "ok":"bad")+'">'+
      '<b>'+ok+" из "+DG.tasks.length+'</b><span>'+Math.round(ok/DG.tasks.length*100)+'% верных</span></div>'+
    '<div class="mastery">'+keys.map(function(k){
      const v=Math.round(byTopic[k].ok/byTopic[k].n*100);
      const cls2=v>=70? "good" : v>=40? "mid" : "low";
      return '<div class="mrow"><div class="mname">'+esc(titleOf(k))+'</div>'+
        '<div class="mbar"><i class="'+cls2+'" style="width:'+Math.max(4,v)+'%"></i></div>'+
        '<div class="mval">'+v+'%</div>'+
        '<button type="button" class="trbtn ghost mgo" data-start="'+k+'">тренировать</button></div>';
    }).join("")+'</div>'+
    '<p class="dashnote" id="diagAdvice"></p>'+
    '<div class="lessonacts"><button type="button" class="trbtn" id="dgAgain">Пройти заново</button>'+
      '<button type="button" class="trbtn ghost" data-close>Закрыть</button></div>';
  closeBtn(w);
  const weak=keys[0];
  const adv=box.querySelector("#diagAdvice");
  if(weak){
    const v=Math.round(byTopic[weak].ok/byTopic[weak].n*100);
    adv.textContent = v<70
      ? "Начните с темы «"+titleOf(weak)+"»: там "+v+"% верных — это и есть точка роста."
      : "Все темы выше 70% — можно переходить к заданиям посложнее и к контрольной.";
  }
  box.querySelectorAll("[data-start]").forEach(function(b){
    b.addEventListener("click", function(){
      const k=b.getAttribute("data-start");
      w.remove();
      if(window.__trainTopic) window.__trainTopic(k);
    });
  });
  box.querySelector("#dgAgain").addEventListener("click", function(){ w.remove(); diagStart(); });
  if(typeof window.__dashRefresh==="function") window.__dashRefresh();
}

    '<p class="dashnote">Отчёт собирается из того, что записано на этом устройстве. '+
      'Имя нужно только для шапки, оно никуда не отправляется.</p>'+
    '<div class="lessonrow"><label>Имя ребёнка <input id="rpName" type="text" maxlength="40" '+
      'placeholder="например, Арсений" value="'+esc(st.name||"")+'"></label></div>'+
    '<div class="lessonacts"><button type="button" class="trbtn" id="rpMake">Собрать и напечатать</button>'+
      '<button type="button" class="trbtn ghost" data-close>Закрыть</button></div>');
  closeBtn(w);
  w.querySelector("#rpMake").addEventListener("click", function(){
    const nm=w.querySelector("#rpName").value.trim();
    const s2=state(); s2.name=nm; save(s2);
    w.remove();
    reportPrint(nm);
  });
}

function reportPrint(name){
  const st=state();
  const rank=ranking();
  const mis=openMistakes().slice(0,5);
  const exams=st.exams.slice(0,3);
  const total=rank.reduce(function(a,x){ return a+x.tries; },0);
  const dates=rank.filter(function(x){ return x.tries; });
  const first=st.start, last=today();
  let sumM=0, cntM=0;
  rank.forEach(function(x){ if(x.m!==null){ sumM+=x.m; cntM++; } });
  const avg=cntM? Math.round(sumM/cntM) : 0;

  const w=document.createElement("div");
  w.className="printreport";
  w.innerHTML=
    '<h1>Отчёт о занятиях</h1>'+
    '<div class="prmeta">'+
      '<div><b>Ученик:</b> '+esc(name||"не указан")+'</div>'+
      '<div><b>Период:</b> '+first+" — "+last+"</div>"+
      '<div><b>Заданий решено:</b> '+total+'</div>'+
      '<div><b>Среднее освоение тем:</b> '+avg+'%</div>'+
    '</div>'+
    '<h2>Темы</h2>'+
    '<table class="prtable"><thead><tr><th>Тема</th><th>Попыток</th><th>Освоение</th><th>Что делать</th></tr></thead><tbody>'+
      (rank.length? rank.map(function(x){
        return "<tr><td>"+esc(titleOf(x.key))+"</td><td>"+x.tries+"</td><td>"+
          (x.m===null? "—" : x.m+"%")+"</td><td>"+
          (x.m===null? "начать" : x.m>=70? "закреплять" : x.m>=40? "повторять" : "разобрать заново")+
          "</td></tr>";
      }).join("") : '<tr><td colspan="4">Пока нет данных — нужно позаниматься хотя бы день.</td></tr>')+
    '</tbody></table>'+
    '<h2>Последние ошибки</h2>'+
    (mis.length? '<ol class="prmis">'+mis.map(function(m){
      return "<li><b>"+esc(m.q)+"</b><br>Ответ: "+esc(m.a)+
        (m.my? " · было введено: "+esc(m.my):"")+"</li>";
    }).join("")+"</ol>" : "<p>Открытых ошибок нет.</p>")+
    '<h2>Контрольные</h2>'+
    (exams.length? '<ul class="prex">'+exams.map(function(e){
      return "<li>"+e.date+": "+e.ok+" из "+e.total+" ("+e.pct+"%), оценка "+e.mark+"</li>";
    }).join("")+"</ul>" : "<p>Контрольных пока не было.</p>")+
    '<h2>Что подтянуть</h2>'+
    '<p>'+esc(recommend(rank))+'</p>'+
    '<p class="prfoot">Отчёт сформирован в приложении «Пошаговый решатель» '+last+'. '+
      'Данные хранятся только на устройстве ученика.</p>';
  document.body.appendChild(w);
  document.body.classList.add("printing");
  setTimeout(function(){
    window.print();
    setTimeout(function(){
      document.body.classList.remove("printing");
      w.remove();
    }, 400);
  }, 120);
}

function recommend(rank){
  if(!rank.length) return "Данных пока мало: стоит позаниматься несколько дней по 10–15 минут.";
  const weak=rank.filter(function(x){ return x.m!==null && x.m<60; });
  if(!weak.length) return "Все начатые темы освоены выше 60% — можно переходить к контрольным и к новым темам.";
  return "Стоит вернуться к темам: "+weak.slice(0,3).map(function(x){ return titleOf(x.key); }).join(", ")+
    ". Достаточно 10–15 минут в день: тренировка по теме и разбор ошибок.";
}

/* ============================================================ */
/*  C11. Крупный шрифт и озвучка шагов                          */
/* ============================================================ */
function fontOn(){
  return !!state().font;
}
function setFont(on){
  const st=state(); st.font=!!on; save(st);
  document.body.classList.toggle("bigfont", !!on);
}
function applyFont(){
  document.body.classList.toggle("bigfont", fontOn());
}
function canSpeak(){
  return typeof window.speechSynthesis!=="undefined" && typeof window.SpeechSynthesisUtterance!=="undefined";
}
function speak(text){
  if(!canSpeak()) return;
  try{
    window.speechSynthesis.cancel();
    const u=new window.SpeechSynthesisUtterance(String(text).slice(0,600));
    u.lang="ru-RU";
    u.rate=0.95;
    const voices=window.speechSynthesis.getVoices()||[];
    const ru=voices.filter(function(v){ return /^ru/i.test(v.lang); })[0];
    if(ru) u.voice=ru;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================ */
/*  КАРТОЧКИ В «ДЭШЕ»                                           */
/* ============================================================ */
function cardsHtml(){
  const rank=ranking();
  const due=dueList();
  const mis=openMistakes();
  const st=state();

  /* C8: освоение тем */
  let mastery='<div class="dashcard dash-wide"><h4>освоение тем</h4>';
  if(!rank.length){
    mastery+='<div class="dashnote">Пока пусто. Решите несколько заданий в тренировке — здесь появятся полоски по темам.</div>';
  }else{
    const shown=rank.slice(0,8);
    mastery+='<div class="mastery">'+shown.map(function(x){
      const m=x.m===null? 0 : x.m;
      const cls=m>=70? "good" : m>=40? "mid" : "low";
      return '<div class="mrow"><div class="mname">'+esc(titleOf(x.key))+'</div>'+
        '<div class="mbar"><i class="'+cls+'" style="width:'+Math.max(3,m)+'%"></i></div>'+
        '<div class="mval">'+(x.m===null? "—" : m+"%")+'</div></div>';
    }).join("")+'</div>';
    const weak=weakest();
    if(weak){
      mastery+='<div class="dashnote" style="margin-top:10px">Следующий шаг: <b>'+esc(titleOf(weak.key))+
        '</b> — '+weak.m+"%. "+
        '<button type="button" class="trbtn ghost mgo" data-gotrain="'+weak.key+'">Потренировать</button></div>';
    }else{
      mastery+='<div class="dashnote" style="margin-top:10px">Все темы выше 70% — держите уровень контрольной.</div>';
    }
  }
  mastery+='</div>';

  /* C4: повторение */
  let review='<div class="dashcard"><h4>повторить сегодня</h4>';
  if(!due.length){
    review+='<div class="dashnote">На сегодня повторений нет. Они появятся сами: '+
      'верный ответ отодвигает тему на 1 → 3 → 7 → 16 дней, ошибка возвращает к одному дню.</div>';
  }else{
    review+='<div class="dashnote">Срок подошёл у '+due.length+' '+plural(due.length,["темы","тем","тем"])+'.</div>'+
      '<div class="dbrow">'+due.slice(0,5).map(function(x){
        return '<button type="button" class="trbtn" data-review="'+x.key+'">'+esc(titleOf(x.key))+"</button>";
      }).join("")+'</div>';
  }
  review+='</div>';

  /* C5: мои ошибки */
  let mistakes='<div class="dashcard"><h4>мои ошибки</h4>';
  if(!mis.length){
    mistakes+='<div class="dashnote">Ошибок нет. Всё, что не получилось в тренировке, тестах и контрольной, '+
      'собирается здесь — до тех пор, пока не решите похожее.</div>';
  }else{
    mistakes+='<div class="dashnote">Открытых: '+mis.length+'. Разберите — и задание закроется.</div>'+
      '<div class="mislist">'+mis.slice(0,5).map(function(m){
        return '<div class="misrow"><div class="miq">'+esc(m.q)+'</div>'+
          '<div class="mid">Ваш ответ: '+esc(m.my||"—")+' · верно: '+esc(m.a)+'</div>'+
          '<div class="dbrow"><button type="button" class="trbtn ghost" data-mis-show="'+m.id+'">Разобрать</button>'+
          '<button type="button" class="trbtn ghost" data-mis-like="'+m.id+'">Решить похожую</button></div></div>';
      }).join("")+'</div>'+
      (mis.length>5? '<div class="dashnote">…и ещё '+(mis.length-5)+"</div>" : "");
  }
  mistakes+='</div>';

  /* C10 + C6: контрольная и проверка уровня + C9 отчёт + C11 шрифт */
  const tools='<div class="dashcard"><h4>проверить себя</h4>'+
    '<div class="dbrow">'+
      '<button type="button" class="trbtn" id="examStartBtn">Контрольная</button>'+
      '<button type="button" class="trbtn ghost" id="diagBtn">Проверка уровня</button>'+
      '<button type="button" class="trbtn ghost" id="reportBtn">Отчёт для родителя</button>'+
    '</div>'+
    (st.exams.length? '<div class="dashnote" style="margin-top:10px">Последняя контрольная: '+
      st.exams[0].ok+" из "+st.exams[0].total+" ("+st.exams[0].pct+"%), оценка "+st.exams[0].mark+"</div>" : "")+
    (st.diag? '<div class="dashnote" style="margin-top:6px">Проверка уровня: '+st.diag.date+', '+
      st.diag.ok+" из "+st.diag.n+"</div>" : "")+
    '</div>';

  const look='<div class="dashcard"><h4>как читать</h4>'+
    '<div class="dbrow">'+
      '<button type="button" class="trbtn'+(fontOn()? "":" ghost")+'" id="fontBtn" aria-pressed="'+(fontOn()? "true":"false")+'">'+
        (fontOn()? "Крупный шрифт включён":"Крупный шрифт")+'</button>'+
      (canSpeak()? '<button type="button" class="trbtn ghost" id="speakTest">🔊 Проверить озвучку</button>':"")+
    '</div>'+
    '<div class="dashnote" style="margin-top:8px">'+(canSpeak()
      ? "У каждого шага решения есть кнопка 🔊 — шаг читается вслух по-русски."
      : "Озвучка недоступна: браузер не поддерживает синтез речи.")+'</div>'+
    '</div>';

  return mastery+review+mistakes+tools+look;
}

function plural(n,f){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20) return f[2]; if(b===1) return f[0]; if(b>=2&&b<=4) return f[1]; return f[2]; }

function bind(box, refresh){
  const q=function(sel){ return box.querySelector(sel); };
  const train=function(k){ if(window.__trainTopic) window.__trainTopic(k); };

  box.querySelectorAll("[data-gotrain]").forEach(function(b){
    b.addEventListener("click", function(){ train(b.getAttribute("data-gotrain")); });
  });
  box.querySelectorAll("[data-review]").forEach(function(b){
    b.addEventListener("click", function(){ train(b.getAttribute("data-review")); });
  });
  box.querySelectorAll("[data-mis-show]").forEach(function(b){
    b.addEventListener("click", function(){
      const id=b.getAttribute("data-mis-show");
      const m=openMistakes().filter(function(x){ return x.id===id; })[0];
      if(!m) return;
      let html='<h2>Разбор ошибки</h2><div class="eq big">'+esc(m.q)+"</div>"+
        '<p class="dashnote">Ваш ответ: <b>'+esc(m.my||"—")+"</b> · верный: <b>"+esc(m.a)+"</b></p>";
      try{
        const r=window.__solve(m.q);
        html+=window.__stepsHtml(r.steps);
      }catch(e){ html+='<p class="dashnote">Разбор недоступен.</p>'; }
      html+='<div class="lessonacts"><button type="button" class="trbtn" id="misLike">Решить похожую</button>'+
        '<button type="button" class="trbtn ghost" data-close>Закрыть</button></div>';
      const w=overlay(html);
      closeBtn(w);
      w.querySelector("#misLike").addEventListener("click", function(){
        w.remove();
        if(window.__trainTopic) window.__trainTopic(m.topic||"lin");
      });
    });
  });
  box.querySelectorAll("[data-mis-like]").forEach(function(b){
    b.addEventListener("click", function(){
      const id=b.getAttribute("data-mis-like");
      const m=openMistakes().filter(function(x){ return x.id===id; })[0];
      if(!m) return;
      /* похожая — то же тема и тот же уровень сложности */
      const next=pickTask(m.topic||"lin", 2);
      if(!next) return;
      if(window.__trainWith) window.__trainWith(next, m.id);
      else if(window.__trainTopic) window.__trainTopic(m.topic||"lin");
    });
  });

  const es=q("#examStartBtn"); if(es) es.addEventListener("click", examStart);
  const dg=q("#diagBtn"); if(dg) dg.addEventListener("click", diagStart);
  const rp=q("#reportBtn"); if(rp) rp.addEventListener("click", reportOpen);
  const fb=q("#fontBtn");
  if(fb) fb.addEventListener("click", function(){
    setFont(!fontOn());
    if(refresh) refresh();
  });
  const stb=q("#speakTest");
  if(stb) stb.addEventListener("click", function(){
    speak("Проверка озвучки. Один плюс один равно два.");
  });
}

/* ---------- кнопки озвучки у шагов (делегирование) ---------- */
document.addEventListener("click", function(e){
  const b=e.target.closest && e.target.closest("[data-say]");
  if(!b) return;
  speak(b.getAttribute("data-say"));
});

/* ---------- экспорт ---------- */
window.__LEARN={
  attempt:attempt, mastery:mastery, level:level, ranking:ranking, weakest:weakest,
  due:dueList, mistakes:openMistakes, closeMistake:closeMistake, addMistake:addMistake,
  hint:hint, pickTask:pickTask, topicsAll:topicsAll, titleOf:titleOf, isRight:isRight,
  complexity:complexity, today:today,
  cardsHtml:cardsHtml, bind:bind, refresh:function(){ if(typeof window.__dashRefresh==="function") window.__dashRefresh(); },
  examStart:examStart, diagStart:diagStart, reportOpen:reportOpen, reportPrint:reportPrint,
  fontOn:fontOn, setFont:setFont, applyFont:applyFont, speak:speak, canSpeak:canSpeak,
  HINT_DIR:HINT_DIR, HINT_RULE:HINT_RULE
};
})();
</script>

/* словарь с самой длинной формой вперёд, чтобы «мм» не распалось на «м»+«м» */
const UNIT_INDEX=(function(){
  const list=[];
  UNIT_CATS.forEach(function(cat){
    cat.units.forEach(function(u){
      u.stems.forEach(function(st){
        list.push({cat:cat, unit:u, stem:st.toLowerCase()});
      });
    });
  });
  list.sort(function(a,b){ return b.stem.length-a.stem.length; });
  return list;
})();

const CYR="а-яёa-z";
/* «км/ч», «м/с», «километров в час», «метров в секунду» */
/* \b в JS не знает кириллицу — границу проверяем явно через (?![а-яёa-z]) */
const NB="(?![а-яёa-z])";
const SPEED_PATTERNS=[
  {re:new RegExp("(?:км|километр[а-яё]*)\\s*(?:\\/|в)\\s*(?:мин[а-яё]*)","g"),            key:"км/мин"},
  {re:new RegExp("(?:км|километр[а-яё]*)\\s*(?:\\/|в)\\s*(?:час[а-яё]*|ч)"+NB,"g"),        key:"км/ч"},
  {re:new RegExp("(?:км|километр[а-яё]*)\\s*(?:\\/|в)\\s*(?:сек[а-яё]*|с)"+NB,"g"),        key:"км/с"},
  {re:new RegExp("(?:м|метр[а-яё]*)\\s*(?:\\/|в)\\s*(?:мин[а-яё]*)","g"),                 key:"м/мин"},
  {re:new RegExp("(?:м|метр[а-яё]*)\\s*(?:\\/|в)\\s*(?:час[а-яё]*|ч)"+NB,"g"),             key:"м/ч"},
  {re:new RegExp("(?:м|метр[а-яё]*)\\s*(?:\\/|в)\\s*(?:сек[а-яё]*|с)"+NB,"g"),             key:"м/с"}
];

function findSpeedMentions(low,taken,text){
  const cat=UNIT_CATS.filter(function(c){ return c.id==="speed"; })[0];
  const out=[];
  SPEED_PATTERNS.forEach(function(pat){
    let m;
    pat.re.lastIndex=0;
    while((m=pat.re.exec(low))!==null){
      const idx=m.index, end=idx+m[0].length;
      let overlap=false;
      for(let k=idx;k<end;k++) if(taken[k]){ overlap=true; break; }
      if(overlap) continue;
      if(idx>0 && new RegExp("["+CYR+"]").test(low[idx-1])) continue;
      const unit=cat.units.filter(function(u){ return u.key===pat.key; })[0];
      if(!unit) continue;
      for(let k=idx;k<end;k++) taken[k]=true;
      out.push({pos:idx, end:end, cat:cat, unit:unit, text:text.slice(idx,end), stem:pat.key});
      break;                     /* одно совпадение на шаблон достаточно */
    }
  });
  return out;
}

function findUnitMentions(text){
  const low=text.toLowerCase().replace(/ё/g,"е");
  const out=[];
  const taken=new Array(low.length).fill(false);

  /* скорость — первой, пока «ч» и «с» не забрали себе другие единицы */
  findSpeedMentions(low,taken,text).forEach(function(m){ out.push(m); });

  UNIT_INDEX.forEach(function(rec){
    const st=rec.stem.replace(/ё/g,"е");
    let from=0, idx;
    while((idx=low.indexOf(st,from))!==-1){
      from=idx+1;
      /* форма слова: стем + окончание (или сразу граница) */
      let end=idx+st.length;
      const nextIsLetter = end<low.length && new RegExp("["+CYR+"]").test(low[end]);
      /* короткие обозначения (м, г, с, ч, т, ц, кг, мм…) — только целым словом,
         иначе «год» превратится в грамм, а «час» — в «ч» */
      if(st.length<=2 && nextIsLetter) continue;
      while(end<low.length && new RegExp("["+CYR+"]").test(low[end])) end++;
      /* внутри уже найденного более длинного совпадения — пропускаем */
      let overlap=false;
      for(let k=idx;k<end;k++) if(taken[k]){ overlap=true; break; }
      if(overlap) continue;
      /* слева не должно быть буквы */
      if(idx>0 && new RegExp("["+CYR+"]").test(low[idx-1])) continue;
      for(let k=idx;k<end;k++) taken[k]=true;
      out.push({pos:idx, end:end, cat:rec.cat, unit:rec.unit, text:text.slice(idx,end), stem:st});
    }
  });
  out.sort(function(a,b){ return a.pos-b.pos; });
  return out;
}

/* коэффициент единицы: либо точная дробь fn/fd, либо десятичная строка f */
function unitFrac(u){
  if(u.fn!==undefined) return new Frac(u.fn,u.fd);
  return fracFromStr(u.f);
}

function plural(n,forms){
  const a=Math.abs(n)%100, b=a%10;
  if(a>10 && a<20) return forms[2];
  if(b===1) return forms[0];
  if(b>=2 && b<=4) return forms[1];
  return forms[2];
}

/* красивый вывод точного значения */
function fmtFracNice(f){
  if(f.d===1) return String(f.n).replace("-","−");
  let d=f.d, k=0;
  while(d%2===0){ d/=2; k++; }
  let d5=d, k5=0;
  while(d5%5===0){ d5/=5; k5++; }
  if(d5===1 && Math.max(k,k5)<=8){
    const digits=Math.max(k,k5);
    const scaled=Math.round(f.val()*Math.pow(10,digits));
    let s=String(Math.abs(scaled));
    if(digits>0){
      while(s.length<=digits) s="0"+s;
      s=s.slice(0,s.length-digits)+"."+s.slice(s.length-digits);
      s=s.replace(/\.?0+$/,"");
    }
    return (f.n<0? "−":"")+s.replace(".",",");
  }
  return (f.n<0? "−":"")+Math.abs(f.n)+"/"+f.d;
}

function solveConvert(src){
  const raw=src.trim();
  const low=raw.toLowerCase().replace(/ё/g,"е");

  /* нужен явный признак перевода — иначе это может быть текстовая задача */
  const hasTrigger = /перевед|перевести|переведи|перевод|конверт|выраз|вырази|→|->|=>/.test(low) ||
                     /сколько\s+[а-яa-z]+\s+в\s+/.test(low) ||
                     /\d\s*[а-яёa-z\/]*\s+в\s+[а-яёa-z\/]+/.test(low);
  if(!hasTrigger) return null;

  /* убираем вводные слова */
  let text=raw.replace(/^(переведи|переведите|перевести|перевод|конвертируй|конвертировать|вырази|выразите|выразить|сколько)\s+/i,"").trim();

  const mentions=findUnitMentions(text);
  if(mentions.length<2){
    /* явно просят перевод или в записи есть «/» — тогда подсказываем про единицы,
       иначе это может быть обычная текстовая задача, и её разберут ниже */
    const explicit=/перевед|перевести|переведи|конверт|выраз|вырази/.test(low) || low.indexOf("/")>=0;
    if(explicit && /\d/.test(low)){
      throw new Error("Не нашёл единицы в записи. Пишите коротко: 5 км в метры, 2,5 кг в граммы, 1,5 часа в минуты. "+
        "Перевожу длину (мм, см, дм, м, км), массу (мг, г, кг, ц, т), скорость (км/ч, м/с, м/мин) и время (с, мин, ч, сут, нед). "+
        "Годы и месяцы не перевожу: в месяце разное число дней.");
    }
    return null;
  }
  if(mentions.length>2){
    /* «3 часа со скоростью 15 км/ч» — это задача, а не перевод */
    if(/перевед|перевести|переведи|конверт|выраз|вырази/.test(low)){
      throw new Error("В записи нашлось несколько единиц (" +
        mentions.map(function(m){ return m.text; }).filter(function(t,i,a){ return a.indexOf(t)===i; }).join(", ") +
        "). Для перевода оставьте две: что переводим и во что — например 5 км/ч в м/с.");
    }
    return null;
  }

  /* где число: ищем цифры прямо перед упоминанием */
  function numBefore(m){
    const left=text.slice(0,m.pos);
    /* смешанное число: «2 1/2 часа» */
    const mix=/(\d+)\s+(\d+)\s*\/\s*(\d+)\s*$/.exec(left);
    if(mix){
      return {raw:mix[0].replace(/\s+/g," "), mixed:true,
              whole:parseInt(mix[1],10), num:parseInt(mix[2],10), den:parseInt(mix[3],10), at:mix.index};
    }
    const mt=/([-−–—]?\s*\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s*$/.exec(left);
    if(!mt) return null;
    return {raw:mt[1].replace(/\s+/g,""), at:mt.index};
  }

  const withNum=mentions.filter(function(m){ return numBefore(m); });
  if(withNum.length!==1) return null;

  const srcM=withNum[0];
  const dstM=mentions.find(function(m){ return m!==srcM; });
  if(!dstM) return null;

  if(srcM.cat.id==="speed" && dstM.cat.id==="speed"){
    return solveSpeedConvert(srcM,dstM,text);
  }

  if(srcM.cat.id!==dstM.cat.id){
    throw new Error("Это разные величины: "+srcM.cat.title.toLowerCase()+" и "+dstM.cat.title.toLowerCase()+
      " напрямую не переводятся. Переводить можно внутри одной величины: длина, масса, скорость, время.");
  }

  const nb=numBefore(srcM);
  let value;
  if(nb.mixed){
    value=new Frac(nb.whole,1).add(new Frac(nb.num,nb.den));
  } else {
    const numRaw=nb.raw.replace(/[−–—]/g,"-");
    if(numRaw.indexOf("/")>=0){
      const pr=numRaw.split("/");
      value=fracFromStr(pr[0]).div(fracFromStr(pr[1]));
    } else {
      value=fracFromStr(numRaw);
    }
  }

  const cat=srcM.cat, uf=unitFrac(srcM.unit), ut=unitFrac(dstM.unit);
  const inBase=value.mul(uf);
  const result=inBase.div(ut);

  const srcName=srcM.unit.key, dstName=dstM.unit.key;
  const valStr=fmtFracNice(value);
  const resStr=fmtFracNice(result);

  const ratio=uf.div(ut);        /* 1 исходная единица = ratio целевых */
  const ratioStr=fmtFracNice(ratio);

  const steps=[];
  steps.push({
    h:"Что переводим",
    b: eq(valStr+"&nbsp;"+srcName+"&nbsp;→&nbsp;"+dstName, true)+
       "<p>Обе единицы измеряют <b>"+cat.acc+"</b>, значит перевести можно: нужно узнать, "+
       "сколько "+dstName+" содержится в "+valStr+" "+srcName+".</p>"
  });

  const gSrc=srcM.unit.g==="f"? "Одна":"Один";
  const dstPlural=plural(ratio.val(), dstM.unit.names);
  steps.push({
    h:"Вспоминаем соотношение",
    b: eq("1&nbsp;"+srcName+" = "+ratioStr+"&nbsp;"+dstName)+
       "<p>"+gSrc+" "+srcM.unit.names[0]+" — это "+ratioStr+" "+dstPlural+
       ". Дальше остаётся умножить на это число.</p>"
  });

  steps.push({
    h:"Умножаем",
    b: eq(valStr+"&nbsp;"+srcName+"&nbsp;=&nbsp;"+valStr+" · "+ratioStr+"&nbsp;"+dstName+"&nbsp;=&nbsp;"+
         fmtFracNice(result)+"&nbsp;"+dstName, true)+
       "<p>При переводе в <b>более мелкую</b> единицу число становится больше, в <b>более крупную</b> — меньше. "+
       "Здесь "+valStr+" "+srcName+" — это "+resStr+" "+dstName+".</p>"
  });

  /* проверка обратным переводом */
  const back=result.mul(ut).div(uf);
  steps.push({
    h:"Проверяем обратным переводом",
    b: eq(resStr+"&nbsp;"+dstName+"&nbsp;=&nbsp;"+resStr+" : "+ratioStr+"&nbsp;"+srcName+"&nbsp;=&nbsp;"+
         fmtFracNice(back)+"&nbsp;"+srcName)+
       "<p>Вернулись к исходному числу — значит перевод выполнен верно.</p>"
  });

  /* если значение дробное — подскажем, как это в жизни */
  if(result.d!==1){
    const approx=n2s(result.val(),4);
    if(approx!==resStr.replace("−","-").replace(",",".")){
      steps[2].b += "<p>Приближённо это "+approx+" "+dstName+".</p>";
    }
  }

  const human = valStr+" "+srcName+" = "+resStr+" "+dstName;
  return {
    kind:"Перевод единиц · "+cat.title,
    steps:steps,
    answer:human,
    answerHtml:valStr+"&nbsp;"+srcName+" = "+resStr+"&nbsp;"+dstName
  };
}

/* перевод скорости: путь и время переводим отдельно — так понятнее */
function solveSpeedConvert(srcM,dstM,text){
  function numBefore(m){
    const left=text.slice(0,m.pos);
    const mix=/(\d+)\s+(\d+)\s*\/\s*(\d+)\s*$/.exec(left);
    if(mix) return {mixed:true, whole:+mix[1], num:+mix[2], den:+mix[3]};
    const mt=/([-−–—]?\s*\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s*$/.exec(left);
    if(!mt) return null;
    return {raw:mt[1].replace(/\s+/g,"")};
  }
  const nb=numBefore(srcM);
  let value;
  if(nb && nb.mixed) value=new Frac(nb.whole,1).add(new Frac(nb.num,nb.den));
  else if(nb){
    const r=nb.raw.replace(/[−–—]/g,"-");
    value = r.indexOf("/")>=0 ? fracFromStr(r.split("/")[0]).div(fracFromStr(r.split("/")[1]))
                              : fracFromStr(r);
  } else return null;

  const su=srcM.unit, du=dstM.unit;
  const lengthOf={ "км":fracFromStr("1000"), "м":fracFromStr("1") };
  const timeOf  ={ "ч":fracFromStr("3600"), "мин":fracFromStr("60"), "с":fracFromStr("1") };
  /* названия для пояснений: «в одном часе — 3600 секунд» */
  const LEN={ "км":{one:"километре", many:["километр","километра","километров"]},
              "м": {one:"метре",     many:["метр","метра","метров"]} };
  const TIM={ "ч":{one:"часе",   many:["час","часа","часов"]},
              "мин":{one:"минуте", many:["минута","минуты","минут"]},
              "с":{one:"секунде", many:["секунда","секунды","секунд"]} };

  const res=value.mul(unitFrac(su)).div(unitFrac(du));
  const valStr=fmtFracNice(value);
  const resStr=fmtFracNice(res);

  const steps=[];
  steps.push({
    h:"Что переводим",
    b: eq(valStr+"&nbsp;"+su.key+"&nbsp;→&nbsp;"+du.key, true)+
       "<p>Скорость — это <b>путь, пройденный за единицу времени</b>. Поэтому переводить будем двумя частями: "+
       "сначала путь, потом время, и в конце разделим одно на другое.</p>"
  });

  const numFrom=lengthOf[su.num], numTo=lengthOf[du.num];
  const denFrom=timeOf[su.den], denTo=timeOf[du.den];

  steps.push({
    h:"Переводим путь",
    b: eq(valStr+"&nbsp;"+su.num+"&nbsp;=&nbsp;"+fmtFracNice(value.mul(numFrom).div(numTo))+"&nbsp;"+du.num)+
       "<p>"+(su.num===du.num
            ? "Путь остаётся в тех же единицах — переводить не нужно."
            : "Один "+LEN[su.num].many[0]+" — это "+fmtFracNice(numFrom.div(numTo))+" "+
              plural(numFrom.div(numTo).val(), LEN[du.num].many)+".")+"</p>"
  });

  steps.push({
    h:"Переводим время",
    b: eq("1&nbsp;"+su.den+"&nbsp;=&nbsp;"+fmtFracNice(denFrom.div(denTo))+"&nbsp;"+du.den)+
       "<p>"+(su.den===du.den
            ? "Время тоже остаётся в тех же единицах."
            : "В одном "+TIM[su.den].one+" содержится "+fmtFracNice(denFrom.div(denTo))+" "+
              plural(denFrom.div(denTo).val(), TIM[du.den].many)+".")+"</p>"
  });

  /* итог: путь / время */
  const pathVal=value.mul(numFrom).div(numTo);
  const timeVal=denFrom.div(denTo);
  steps.push({
    h:"Делим путь на время",
    b: eq(valStr+"&nbsp;"+su.key+"&nbsp;=&nbsp;"+fmtFracNice(pathVal)+"&nbsp;"+du.num+"&nbsp;:&nbsp;"+
         fmtFracNice(timeVal)+"&nbsp;"+du.den+"&nbsp;=&nbsp;"+resStr+"&nbsp;"+du.key, true)+
       "<p>Получили скорость в "+du.key+".</p>"+
       (res.d!==1? "<p>Приближённо это "+n2s(res.val(),4)+" "+du.key+".</p>" : "")
  });

  /* проверка обратным переводом */
  const back=res.mul(unitFrac(du)).div(unitFrac(su));
  steps.push({
    h:"Проверяем обратным переводом",
    b: eq(resStr+"&nbsp;"+du.key+"&nbsp;=&nbsp;"+fmtFracNice(back)+"&nbsp;"+su.key)+
       "<p>Вернулись к исходному числу — перевод верный.</p>"
  });

  const approx=fmtFracNice(res).indexOf("/")>=0? n2s(res.val(),3) : null;
  const ansHtml=valStr+"&nbsp;"+su.key+" = "+resStr+"&nbsp;"+du.key+
                 (approx? ' <span class="approx">≈ '+approx+"&nbsp;"+du.key+"</span>" : "");
  return {
    kind:"Перевод единиц · Скорость",
    steps:steps,
    answer:valStr+" "+su.key+" = "+resStr+" "+du.key+(approx? " (≈ "+approx+" "+du.key+")" : ""),
    answerHtml:ansHtml
  };
}

function solvePlain(src){
  if(src.indexOf("=")>=0){
    const sides=src.split("=");
    if(sides.length!==2) throw new Error("Должен быть один знак «=».");
    const L=parsePoly(sides[0]), R=parsePoly(sides[1]);
    const ok=L.sub(R).isZero();
    return {
      kind:"Проверка равенства",
      steps:[
        {h:"Считаем левую часть", b:eq(esc(sides[0])+" = "+fracStr(L.cf(0)))},
        {h:"Считаем правую часть", b:eq(esc(sides[1])+" = "+fracStr(R.cf(0)))},
        {h:"Сравниваем", b:"<p>Части "+(ok?"совпали — равенство верное.":"не совпали — равенство неверное.")+"</p>"}
      ],
      answer: ok? "верно" : fracStr(L.cf(0))+" ≠ "+fracStr(R.cf(0))
    };
  }
  return solveArithmetic(src);
}

/* ============================================================ */
/*  8. Текстовые задачи                                          */
/* ============================================================ */
function unitsWord(u){
  u=u.toLowerCase();
  if(/^час|^ч$/.test(u)) return "ч";
  if(/^мин/.test(u)) return "мин";
  if(/^дн|^день|^дня/.test(u)) return "дня";
  return u;
}

/* --- 8.1 «задумали число» --- */
function mChain(low){
  if(!/задум/.test(low)) return null;
  const re=/(умнож[а-яё]*|прибав[а-яё]*|выч[а-яё]*|вычт[а-яё]*|раздел[а-яё]*|увелич[а-яё]*|уменьш[а-яё]*|получ[а-яё]*|равн[а-яё]*|стал[а-яё]*|вышл[а-яё]*)\D{0,14}?(\d+(?:[.,]\d+)?)/g;
  const ops=[]; let target=null, m;
  while((m=re.exec(low))){
    const verb=m[1], chunk=m[0], n=m[2].replace(",",".");
    if(/^(получ|равн|стал|вышл)/.test(verb)){ target=n; break; }
    let op=null;
    if(/^умнож/.test(verb)) op="*";
    else if(/^прибав/.test(verb)) op="+";
    else if(/^выч/.test(verb)) op="-";
    else if(/^раздел/.test(verb)) op="/";
    else if(/^увелич/.test(verb)) op=/раз/.test(chunk)? "*":"+";
    else if(/^уменьш/.test(verb)) op=/раз/.test(chunk)? "/":"-";
    if(op) ops.push({op:op, n:n, raw:chunk});
  }
  if(target===null || !ops.length) return null;

  const names={"*":"умножить на","+":"прибавить","-":"вычесть","/":"разделить на"};
  const pretty=function(src){
    return src.replace(/\*/g,"·").replace(/\//g," : ").replace(/\+/g," + ").replace(/-/g," − ");
  };
  /* собираем цепочку с учётом порядка действий: после «+»/«−» умножение применяется
     ко всему результату, значит его надо взять в скобки */
  let acc="x";
  const chain=ops.map(function(o){
    if((o.op==="*"||o.op==="/") && /[+\-]/.test(acc.slice(1))) acc="("+acc+")";
    acc+=o.op+o.n;
    return acc;
  });
  const expr=acc+"="+target;
  const lis=ops.map((o,i)=>"<li>«"+names[o.op]+" "+o.n.replace(".",",")+"» → "+
      (i?"к результату применяем: ":"")+pretty(chain[i])+"</li>").join("");

  const solved=solveEquationString(expr);
  const steps=[
    {h:"Обозначаем неизвестное", b:"<p>Задуманное число обозначим за <b>x</b> — именно его и надо найти.</p>"},
    {h:"Переводим текст в уравнение", b:"<p>Идём по условию по порядку и записываем каждое действие:</p><ul>"+lis+"</ul>"+
      "<p>«…и получил "+target.replace(".",",")+"» — это знак «равно»:</p>"+eq(pretty(acc)+" = "+target,true)},
  ].concat(solved.steps.slice(1));
  return {kind:"Задача на «задуманное число»", steps:steps, answer:solved.answer};
}

/* --- 8.2 смеси и концентрации --- */
function mMix(low,t){
  if(!/%/.test(t)) return null;
  if(!/(раствор|сплав|смес|кислот|сироп|сливк|концентрац|соль|сахар|морс|уксус)/.test(low)) return null;

  const MASS="(кг|г|л|мл|литр\\w*|грамм\\w*|килограмм\\w*)";
  const pairs=[];
  let m;
  /* «20 %-ный раствор массой 3 кг» — только при явном слове масса/вес */
  const re1=new RegExp("(\\d+(?:[.,]\\d+)?)\\s*%\\s*[-‑]?\\s*(?:го|ного|й|ый|ой)?[^0-9%]{0,25}?(?:массой|весом|объ[её]мом)\\s*(\\d+(?:[.,]\\d+)?)\\s*"+MASS,"g");
  while((m=re1.exec(low))) pairs.push({m:parseNum(m[2]), p:parseNum(m[1]), u:unitsWord(m[3])});
  const re2=new RegExp("(\\d+(?:[.,]\\d+)?)\\s*"+MASS+"[^0-9%]{0,18}?(\\d+(?:[.,]\\d+)?)\\s*%","g");
  while((m=re2.exec(low))){
    const pair={m:parseNum(m[1]), p:parseNum(m[3]), u:unitsWord(m[2])};
    if(!pairs.some(p=>p.m===pair.m&&p.p===pair.p)) pairs.push(pair);
  }
  if(pairs.length<2) return null;

  let totalM=0, pure=0;
  const items=pairs.map((p,i)=>{
    const pm=p.m*p.p/100;
    totalM+=p.m; pure+=pm;
    return "<li>"+(i+1)+"-й: "+n2s(p.m)+" "+p.u+" × "+n2s(p.p)+"% = <b>"+n2s(pm)+" "+p.u+"</b> чистого вещества</li>";
  });
  const conc=pure/totalM*100;
  const u=pairs[0].u;

  return {
    kind:"Задача на смеси (концентрация)",
    steps:[
      {h:"Что происходит в задаче", b:"<p>Смешиваем несколько порций с разной концентрацией. Ключ к решению: <b>массы складываются, а «чистое вещество» — тоже</b>. Концентрация смеси = всё чистое вещество ÷ вся масса.</p>"},
      {h:"Считаем чистое вещество в каждой порции", b:"<p>p% от массы m — это m · p / 100:</p><ul>"+items.join("")+"</ul>"},
      {h:"Складываем массы и вещество", b:eq("масса: "+pairs.map(p=>n2s(p.m)).join(" + ")+" = "+n2s(totalM)+" "+u)+
        eq("чистое вещество: "+n2s(pure)+" "+u)},
      {h:"Находим концентрацию", b:eq("ω = "+n2s(pure,4)+" : "+n2s(totalM,4)+" · 100% = "+n2s(conc,2)+"%",true)+
        "<p>Делим массу чистого вещества на общую массу раствора и переводим в проценты.</p>"}
    ],
    answer:"концентрация "+n2s(conc,2)+"%"
  };
}

/* --- 8.3 проценты --- */
function mPercent(low,t){
  if(!/(%|процент)/.test(low)) return null;
  const cur=/(руб|₽)/.test(low)? " руб." : "";

  /* все проценты по порядку: значение и место в тексте */
  const pcts=[];
  const pRe=/(\d+(?:[.,]\d+)?)\s*(?:%|процент[а-яё]*)/g;
  let pm;
  while((pm=pRe.exec(low))) pcts.push({v:parseNum(pm[1]), i:pm.index});
  if(!pcts.length) return null;

  const all=[...low.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m=>({v:parseNum(m[1]), i:m.index, raw:m[1]}));
  const pctIdx=new Set(pcts.map(p=>p.i));
  const rest=all.filter(x=>!pctIdx.has(x.i));
  if(!rest.length) return null;

  /* сколько процентов составляет изменение */
  if(/сколько процент/.test(low) && rest.length>=2){
    const a=rest[0].v, b=rest[1].v;
    const diff=b-a;
    const res=diff/a*100;
    return {
      kind:"Задача на проценты",
      steps:[
        {h:"Что дано", b:"<p>Было "+n2s(a)+", стало "+n2s(b)+". Спрашивают, сколько процентов составляет изменение.</p>"},
        {h:"Считаем изменение", b:eq("Δ = "+n2s(b)+" − "+n2s(a)+" = "+n2s(diff))},
        {h:"Делим на исходное значение", b:"<p>Проценты всегда считаются от <b>того, с чем сравнивают</b> — здесь от первоначального значения:</p>"+
          eq("Δ : "+n2s(a)+" · 100% = "+n2s(res)+"%",true)}
      ],
      answer:n2s(res)+"%"
    };
  }

  /* направление каждого изменения: смотрим слова перед процентом */
  const DOWN=/(скидк|подешев|снизил|снижен|уменьшил|дешевле|уценил|упал|уменьшилась)/;
  const UP=/(подорож|повысил|повыш|увеличил|наценк|дороже|вырос|поднял|наценил|увеличилась)/;
  let prevDir=null;
  pcts.forEach(function(p,k){
    const chunk=low.slice(k? pcts[k-1].i : 0, p.i);
    if(DOWN.test(chunk)) p.dir="down";
    else if(UP.test(chunk)) p.dir="up";
    else p.dir=prevDir;
    prevDir=p.dir;
  });
  if(!pcts[0].dir) return null;
  const down=pcts[0].dir==="down";

  /* обратный ход: известна величина ПОСЛЕ изменения, ищем исходную */
  const reverse=/(до скидк|до снижен|до подорож|до повыш|первоначальн|изначальн|исходн|прежн|раньше|прежде)/.test(low)
    || (/(получ(ил|ила|или|илось|ен[аоы])|стал[аои]?|оказал)/.test(low) &&
        /(какое|каким|найдите|найти|сколько было|было число|сколько стоил)/.test(low));
  if(reverse && pcts.length===1){
    const p=pcts[0].v;
    const value=rest[0].v;
    const left=down? 100-p : 100+p;
    const one=value/left;
    const res=one*100;
    return {
      kind:"Задача на проценты (обратная)",
      steps:[
        {h:"Что дано", b:"<p>Известна величина <b>после</b> изменения: "+n2s(value)+". Изменение "+n2s(p)+
          (down?"% — скидка. Ищем значение до скидки — примем его за 100%.":"% — наценка. Ищем значение до наценки — примем его за 100%.")+"</p>"},
        {h:"Сколько процентов осталось", b:eq((down?"100% − ":"100% + ")+n2s(p)+"% = "+n2s(left)+"%")+
          "<p>То, что мы видим сейчас, — это "+n2s(left)+"% от первоначальной величины.</p>"},
        {h:"Находим 1%", b:"<p>Делим известную величину на число процентов, которые она составляет:</p>"+
          eq(n2s(value)+" : "+n2s(left)+" = "+n2s(one,4))},
        {h:"Находим 100%", b:eq(n2s(one,4)+" · 100 = "+n2s(res,2), true)+
          "<p>Проверка: "+n2s(p)+"% от "+n2s(res,2)+" — это "+n2s(res*p/100,2)+", и "+
          n2s(res,2)+(down?" − ":" + ")+n2s(res*p/100,2)+" = "+n2s(value,2)+". Сходится.</p>"}
      ],
      answer:n2s(res,2)+cur
    };
  }
  if(reverse) return null;

  /* несколько изменений подряд */
  if(pcts.length>1){
    const base=rest[0].v;
    let val=base;
    const rows=[], eqs=[];
    pcts.forEach(function(p,k){
      const part=val*p.v/100;
      const nv=p.dir==="down"? val-part : val+part;
      rows.push("<li>"+(k+1)+"-е изменение: "+n2s(p.v)+"% от "+n2s(val,4)+" = <b>"+n2s(part,4)+"</b> — "+
        (p.dir==="down"?"вычитаем":"прибавляем")+"</li>");
      eqs.push(n2s(val,4)+(p.dir==="down"?" − ":" + ")+n2s(part,4)+" = "+n2s(nv,4));
      val=nv;
    });
    return {
      kind:"Задача на проценты (несколько изменений)",
      steps:[
        {h:"Что дано", b:"<p>Величина меняется несколько раз подряд. Ключевой момент: каждый следующий процент считается уже от <b>новой</b> величины, а не от исходной.</p>"},
        {h:"Считаем по шагам", b:"<ul>"+rows.join("")+"</ul>"},
        {h:"Итог", b:eqs.map(function(e){ return eq(e); }).join("")}
      ],
      answer:n2s(val,4)+cur
    };
  }

  const base=rest[0];
  const p=pcts[0].v;
  const one=base.v/100;
  const part=one*p;
  const res = down? base.v-part : base.v+part;

  return {
    kind:"Задача на проценты",
    steps:[
      {h:"Что дано", b:"<p>Исходное значение "+n2s(base.v)+cur+", изменение "+n2s(p)+
        (down?"% — это скидка, значение уменьшится.":"% — это повышение, значение увеличится.")+"</p>"},
      {h:"Находим 1%", b:"<p>Один процент — это сотая часть исходного числа:</p>"+
        eq(n2s(base.v)+" : 100 = "+n2s(one))},
      {h:"Находим "+n2s(p)+"%", b:"<p>Умножаем один процент на нужное количество процентов:</p>"+
        eq(n2s(one)+" · "+n2s(p)+" = "+n2s(part))},
      {h: down? "Вычитаем скидку":"Прибавляем наценку",
       b: eq(n2s(base.v)+(down?" − ":" + ")+n2s(part)+" = "+n2s(res), true)+
         "<p>Проценты считаются всегда от исходной величины, а не от уже изменённой.</p>"}
    ],
    answer:n2s(res)+cur
  };
}

/* --- 8.4 совместная работа --- */
function mWork(low,t){
  if(!/(работ|бригад|рабоч|насос|труб|бассейн|заказ|задани|вспаш|покрас|склад)/.test(low)) return null;
  if(!/(вместе|одновременно|совместно)/.test(low)) return null;
  const times=[...t.matchAll(/за\s*(\d+(?:[.,]\d+)?)\s*(час[а-яё]*|ч|дн[а-яё]*|день|дня|минут[а-яё]*|мин)/gi)]
    .map(m=>({n:parseNum(m[1]), u:unitsWord(m[2])}));
  if(times.length<2) return null;

  const A=fracFromStr(String(times[0].n)), B=fracFromStr(String(times[1].n));
  const pa=F1().div(A), pb=F1().div(B);
  const ps=pa.add(pb);
  const T=F1().div(ps);
  const u=times[0].u;

  return {
    kind:"Задача на совместную работу",
    steps:[
      {h:"Главная идея", b:"<p>Всю работу принимаем за <b>1</b>. Производительность — это какая часть работы делается за единицу времени: если мастер делает работу за a часов, то за час он делает 1/a работы.</p>"},
      {h:"Производительность каждого", b:eq("первый: 1 : "+fracStr(A)+" = "+fracStr(pa)+" работы в "+u)+
        eq("второй: 1 : "+fracStr(B)+" = "+fracStr(pb)+" работы в "+u)},
      {h:"Складываем производительности", b:"<p>Работая вместе, они складывают свои скорости:</p>"+
        eq(fracStr(pa)+" + "+fracStr(pb)+" = "+fracStr(ps)+" работы в "+u)},
      {h:"Находим время", b:"<p>Время = вся работа ÷ совместная производительность:</p>"+
        eq("1 : "+fracStr(ps)+" = "+niceFrac(T)+" "+u, true)}
    ],
    answer:niceFrac(T)+" "+u
  };
}

/* --- 8.5 возраст --- */
function mAge(low,t){
  if(!/через сколько лет/.test(low)) return null;
  if(!/(старше|моложе)/.test(low)) return null;
  const ages=[...t.matchAll(/(\d+)\s*(?:лет|год[а-яё]*)/g)].map(m=>+m[1]);
  let k=null;
  const km=/в\s*(\d+(?:[.,]\d+)?)\s*раз[а-яё]*/i.exec(low);
  if(km) k=parseNum(km[1]);
  else if(/втрое/.test(low)) k=3;
  else if(/вдвое/.test(low)) k=2;
  else if(/вчетверо/.test(low)) k=4;
  if(ages.length<2 || !k) return null;

  const A=ages[0], B=ages[1];
  const expr=A+"+t="+k+"*("+B+"+t)";
  EXPANDED=false;
  const solved=solveEquationString(expr);
  solved.kind="Задача на возраст";
  const tv=evalSimple(solved.answer.split("=").pop().trim());
  if(isFinite(tv)) solved.answer="через "+n2s(tv)+" "+yearsWord(tv);

  solved.steps[0]={
    h:"Обозначаем неизвестное",
    b:"<p>Пусть пройдёт <b>t</b> лет. Тогда старшему будет "+A+" + t, младшему — "+B+" + t. Через t лет старший должен быть в "+k+" раза старше:</p>"+
      eq(A+" + t = "+k+"·("+B+" + t)", true)
  };
  return solved;
}

/* --- 8.6 сумма и разность --- */
function mSumDiff(low,t){
  if(!/(сумм|всего|вместе|сколько)/.test(low)) return null;
  const dm=/на\s*(\d+(?:[.,]\d+)?)\s*(больше|меньше)/.exec(low);
  const km=/в\s*(\d+(?:[.,]\d+)?)\s*раз[а-яё]*\s*(больше|меньше)/.exec(low);

  /* «сумма 40, разность 6» — второй способ задать два числа */
  if(!dm && !km){
    const sm=/сумм[а-яё]*\D{0,25}?(\d+(?:[.,]\d+)?)/.exec(low);
    const rs=/разност[а-яё]*\D{0,25}?(\d+(?:[.,]\d+)?)/.exec(low);
    if(!sm || !rs) return null;
    const S=parseNum(sm[1]), D=parseNum(rs[1]);
    const expr="x+(x+"+D+")="+S;
    const solved=solveEquationString(expr);
    const xStr=solved.answer.split("=").pop().trim();
    let small=null, big=null;
    try{ small=evalSimple(xStr); big=small+D; }catch(e){ small=null; }
    const steps=[
      {h:"Обозначаем неизвестное", b:"<p>Пусть меньшее число — <b>x</b>. Тогда большее — это x + "+n2s(D)+
        ": разность двух чисел как раз и есть эта добавка.</p>"},
      {h:"Составляем уравнение", b:"<p>Сумма чисел тоже известна — складываем оба числа:</p>"+
        eq("x + (x + "+n2s(D)+") = "+n2s(S), true)}
    ].concat(solved.steps.slice(1));
    if(small!==null && isFinite(small)){
      steps.push({h:"Находим оба числа", b:eq("большее = "+n2s(small)+" + "+n2s(D)+" = "+n2s(big))+
        "<p>Проверка: "+n2s(big)+" − "+n2s(small)+" = "+n2s(big-small)+" (разность), "+
        n2s(small)+" + "+n2s(big)+" = "+n2s(small+big)+" (сумма).</p>"});
    }
    return {
      kind:"Задача на сумму и разность",
      steps:steps,
      answer:(small!==null && isFinite(small))
        ? "меньшее = "+n2s(small)+", большее = "+n2s(big)
        : solved.answer
    };
  }

  const all=[...low.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m=>({v:parseNum(m[1]), i:m.index}));
  const par=(dm||km);
  const pv=parseNum(par[1]);
  const total=all.find(x=>Math.abs(x.i-par.index)>0 && x.v!==pv);
  if(!total) return null;

  const S=total.v;
  const expr = dm? "x+(x+"+pv+")="+S : "x+"+pv+"*x="+S;
  const solved=solveEquationString(expr);
  const xStr=solved.answer.split("=").pop().trim();

  let small, big;
  try{
    const D=solved; /* пересчитаем точно */
    const val=evalSimple(xStr);
    small=val;
    big = dm? val+pv : val*pv;
  }catch(e){ small=null; }

  const steps=[
    {h:"Обозначаем неизвестное", b:"<p>Пусть меньшее (первое) число — <b>x</b>. Тогда "+
      (dm? "второе на "+n2s(pv)+" больше, то есть x + "+n2s(pv)
          : "второе в "+n2s(pv)+" раза больше, то есть "+n2s(pv)+"·x")+".</p>"},
    {h:"Составляем уравнение", b:"<p>В условии сказано, что вместе они дают "+n2s(S)+":</p>"+
      eq(dm? "x + (x + "+n2s(pv)+") = "+n2s(S) : "x + "+n2s(pv)+"x = "+n2s(S), true)}
  ].concat(solved.steps.slice(1));

  if(small!==null && isFinite(small)){
    steps.push({h:"Находим второе число", b:eq("второе число = "+
      (dm? n2s(small)+" + "+n2s(pv)+" = "+n2s(big) : n2s(pv)+" · "+n2s(small)+" = "+n2s(big)))+
      "<p>Проверка: "+n2s(small)+" + "+n2s(big)+" = "+n2s(small+big)+" — сходится с условием.</p>"});
  }

  return {
    kind:"Задача на части и сумму",
    steps:steps,
    answer: (small!==null&&isFinite(small))
      ? "меньшее = "+n2s(small)+", большее = "+n2s(big)
      : solved.answer
  };
}
function yearsWord(n){
  const a=Math.abs(Math.round(n))%100, b=a%10;
  if(a>10&&a<20) return "лет";
  if(b===1) return "год";
  if(b>=2&&b<=4) return "года";
  return "лет";
}
function evalSimple(s){
  if(/^−?\d+$/.test(s)) return parseInt(s.replace("−","-"),10);
  const m=/^−?(\d+)\/(\d+)$/.exec(s);
  if(m) return parseInt(m[1],10)/parseInt(m[2],10);
  return NaN;
}

/* --- 8.7б простой счёт: было, дали, съел — сколько осталось --- */
function mSimple(low,t){
  if(!/было/.test(low)) return null;
  if(!/сколько\s+(осталось|стало|будет|теперь)/.test(low)) return null;

  const start=/было\s*(\d+(?:[.,]\d+)?)/.exec(low);
  if(!start) return null;
  let total=parseNum(start[1]);

  const re=/(дал[а-яё]*|дали|купил[а-яё]*|наш[её]л[а-яё]*|добавил[а-яё]*|подарил[а-яё]*|получил[а-яё]*|съел[а-яё]*|съели|отдал[а-яё]*|отдали|продал[а-яё]*|потерял[а-яё]*|потратил[а-яё]*|израсходовал[а-яё]*|взял[а-яё]*)\D{0,14}?(\d+(?:[.,]\d+)?)/g;
  const items=[]; let m;
  while((m=re.exec(low))){
    const v=parseNum(m[2]);
    const plus=/(дал|дали|купил|наш[её]|добавил|подарил|получил|взял)/.test(m[1]);
    if(start.index===m.index) continue;
    items.push({v:v, plus:plus, w:m[1], at:m.index});
    total += plus? v : -v;
  }
  const re2=/(\d+(?:[.,]\d+)?)\s*(съел[а-яё]*|съели|отдал[а-яё]*|отдали|продал[а-яё]*|потратил[а-яё]*|потерял[а-яё]*|израсходовал[а-яё]*)/g;
  while((m=re2.exec(low))){
    if(start.index===m.index) continue;
    if(items.some(it=>it.at===m.index)) continue;
    items.push({v:parseNum(m[1]), plus:false, w:m[2], at:m.index});
  }
  items.sort((a,b)=>(a.at||0)-(b.at||0));
  if(!items.length) return null;
  total=parseNum(start[1]);
  items.forEach(function(it){ total += it.plus? it.v : -it.v; });

  const rows=items.map(it=>"<li>"+(it.plus?"прибавляем":"вычитаем")+" "+n2s(it.v)+"</li>").join("");
  const chain=[n2s(parseNum(start[1]))].concat(items.map(it=>(it.plus?" + ":" − ")+n2s(it.v))).join("");
  return {
    kind:"Задача на сложение и вычитание",
    steps:[
      {h:"Что дано", b:"<p>Начинаем с того, что было: <b>"+n2s(parseNum(start[1]))+"</b>.</p>"},
      {h:"Что происходит дальше", b:"<p>Каждое действие меняет количество: дали, купили, нашли — прибавляем; съели, отдали, продали — вычитаем.</p><ul>"+rows+"</ul>"},
      {h:"Считаем по порядку", b:eq(chain+" = "+n2s(total), true)+
        (total<0? "<p>Получилось отрицательное число — проверьте, не перепутаны ли действия в условии.</p>":"")}
    ],
    answer:n2s(total)
  };
}

/* --- 8.8 движение --- */
function mMotion(low,t){
  if(!/(км\/ч|км в час|м\/с|скорост|проех|прошёл|прошел|проплы|пролет|едет|идёт|шел|двига)/.test(low)) return null;
  if(/(обратно|туда и|по течению|против течения)/.test(low)) return null;

  /* 8.8.1 двое движутся навстречу (или в разные стороны): скорости складываются */
  if(/(навстреч|друг другу|сближ|в противоположн|в разные стороны)/.test(low)){
    const sp=[];
    const rv=/(\d+(?:[.,]\d+)?)\s*(?:км\/ч|км\/час|км в час)/gi;
    let mv;
    while((mv=rv.exec(t))) sp.push(parseNum(mv[1]));
    const dm=/(\d+(?:[.,]\d+)?)\s*км(?![\/а-яё])/i.exec(t);
    if(sp.length>=2 && dm){
      const S=parseNum(dm[1]), v1=sp[0], v2=sp[1];
      if(S>0 && v1>0 && v2>0){
        const V=v1+v2, T=S/V;
        /* часы с минутами для ответа */
        const mins=Math.round(T*60), hh=Math.floor(mins/60), mm=mins%60;
        const hm=(mm>0 && hh>0)? (hh+" ч "+mm+" мин") : (hh>0? null : (mm+" мин"));
        return {kind:"Задача на встречное движение", steps:[
          {h:"Что происходит", b:"<p>Два тела идут навстречу друг другу. За один час они вдвоём покрывают расстояние, равное сумме их скоростей — это и есть скорость сближения.</p>"+
            eq("v сближ. = v₁ + v₂", true)},
          {h:"Что известно", b:eq("S = "+n2s(S)+" км,&nbsp;&nbsp; v₁ = "+n2s(v1)+" км/ч,&nbsp;&nbsp; v₂ = "+n2s(v2)+" км/ч")},
          {h:"Скорость сближения", b:eq("v сближ. = "+n2s(v1)+" + "+n2s(v2)+" = "+n2s(V)+" км/ч", true)+
            "<p>Скорости складываем: они едут друг другу навстречу, поэтому сближаются быстрее каждого по отдельности.</p>"},
          {h:"Находим время", b:eq("t = S : v сближ. = "+n2s(S)+" : "+n2s(V)+" = "+n2s(T)+" ч", true)+
            "<p>Весь путь делим на скорость сближения.</p>"+
            (hm? "<p>В часах и минутах это "+hm+".</p>":"")},
          {h:"Проверяем", b:eq(n2s(v1)+" · "+n2s(T)+" + "+n2s(v2)+" · "+n2s(T)+" = "+n2s(v1*T+v2*T)+" км", true)+
            "<p>Сумма путей обоих тел равна расстоянию между ними — сходится.</p>"}
        ], answer:n2s(T)+" ч"+(hm? " ("+hm+")":"")};
      }
    }
  }

  const scan=[...t.matchAll(/(\d+(?:[.,]\d+)?)\s*(км\/ч|км\/час|км|м\/с|минут[а-яё]*|мин|час[а-яё]*|ч)(?![а-яё])/gi)]
    .map(m=>({v:parseNum(m[1]), u:m[2].toLowerCase()}));
  let v=null, s=null, tt=null;
  for(const it of scan){
    if(/^км\/ч|^км\/час|^м\/с/.test(it.u) && v===null) v=it.v;
    else if(/^км$|^м$/.test(it.u) && s===null) s=it.v;
    else if(/^ч|^час/.test(it.u) && tt===null) tt={v:it.v, u:"ч"};
    else if(/^мин/.test(it.u) && tt===null) tt={v:it.v/60, u:"ч"};
  }
  /* «скорость 15» без единиц */
  if(v===null){
    const m=/скорост[а-яё]*[^0-9]{0,22}?(\d+(?:[.,]\d+)?)/.exec(low);
    if(m) v=parseNum(m[1]);
  }
  const known=[v!==null,s!==null,tt!==null].filter(Boolean).length;
  if(known<2) return null;

  const base={h:"Вспоминаем формулу", b:"<p>Равномерное движение описывается одной формулой:</p>"+
    eq("S = v · t", true)+"<p>S — путь, v — скорость, t — время. Зная любые две величины, находим третью.</p>"};

  if(v!==null && tt!==null){
    const S=v*tt.v;
    return {kind:"Задача на движение", steps:[
      base,
      {h:"Что известно", b:eq("v = "+n2s(v)+" км/ч,&nbsp;&nbsp; t = "+n2s(tt.v)+" ч")},
      {h:"Считаем путь", b:eq("S = "+n2s(v)+" · "+n2s(tt.v)+" = "+n2s(S)+" км", true)+
        "<p>Скорость умножаем на время: километры в час × часы дают километры — единицы согласованы.</p>"}],
      answer:n2s(S)+" км"};
  }
  if(s!==null && v!==null){
    const T=s/v;
    return {kind:"Задача на движение", steps:[
      base,
      {h:"Что известно", b:eq("S = "+n2s(s)+" км,&nbsp;&nbsp; v = "+n2s(v)+" км/ч")},
      {h:"Выражаем время", b:eq("t = S : v = "+n2s(s)+" : "+n2s(v)+" = "+n2s(T)+" ч", true)+
        "<p>Из формулы S = v·t время находится делением пути на скорость.</p>"}],
      answer:n2s(T)+" ч"};
  }
  if(s!==null && tt!==null){
    const V=s/tt.v;
    return {kind:"Задача на движение", steps:[
      base,
      {h:"Что известно", b:eq("S = "+n2s(s)+" км,&nbsp;&nbsp; t = "+n2s(tt.v)+" ч")},
      {h:"Выражаем скорость", b:eq("v = S : t = "+n2s(s)+" : "+n2s(tt.v)+" = "+n2s(V)+" км/ч", true)+
        "<p>Скорость — это путь, пройденный за единицу времени.</p>"}],
      answer:n2s(V)+" км/ч"};
  }
  return null;
}

/* ============================================================ */
/*  9а. Системы двух линейных уравнений                          */
/* ============================================================ */
function lin2Parse(src, v1, v2){
  const s=String(src).toLowerCase()
    .replace(/(\d),(\d)/g,"$1.$2")
    .replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4")
    .replace(/[−–—]/g,"-").replace(/[×·∙⋅]/g,"*").replace(/[÷:]/g,"/")
    .replace(/\s+/g,"");
  let i=0;
  function zero(){ return {k:F0(), a:F0(), b:F0()}; }
  function addL(x,y){ return {k:x.k.add(y.k), a:x.a.add(y.a), b:x.b.add(y.b)}; }
  function scaleL(x,f){ return {k:x.k.mul(f), a:x.a.mul(f), b:x.b.mul(f)}; }
  function isConst(x){ return x.a.isZero() && x.b.isZero(); }
  function peek(){ return i<s.length? s[i] : ""; }
  function expr(){
    let n=term();
    while(peek()==="+"||peek()==="-"){
      const op=s[i++]; const r=term();
      n = op==="+"? addL(n,r) : addL(n, scaleL(r,new Frac(-1)));
    }
    return n;
  }
  function term(){
    let n=unary();
    while(peek()==="*"||peek()==="/"){
      const op=s[i++]; const r=unary();
      if(op==="*"){
        if(isConst(n)) n=scaleL(r,n.k);
        else if(isConst(r)) n=scaleL(n,r.k);
        else throw new Error("В системе есть произведение неизвестных — это уже не линейное уравнение.");
      } else {
        if(!isConst(r)) throw new Error("В системе неизвестное стоит в знаменателе — такую я не решаю.");
        if(r.k.isZero()) throw new Error("Деление на ноль — такого не бывает.");
        n=scaleL(n, F1().div(r.k));
      }
    }
    return n;
  }
  function unary(){
    if(peek()==="-"){ i++; return scaleL(unary(), new Frac(-1)); }
    if(peek()==="+"){ i++; return unary(); }
    return power();
  }
  function power(){
    let n=atom();
    /* неявное умножение: 2x, 3(x+1), x(y−2) */
    for(;;){
      const nx=peek();
      if(/[a-zа-яё(]/.test(nx)){
        const r=power();
        if(isConst(n)) n=scaleL(r,n.k);
        else if(isConst(r)) n=scaleL(n,r.k);
        else throw new Error("В системе есть произведение неизвестных — это уже не линейное уравнение.");
        continue;
      }
      break;
    }
    while(peek()==="^"){
      i++;
      let sign=1;
      if(peek()==="-"){ sign=-1; i++; }
      let j=i;
      while(j<s.length && /[0-9]/.test(s[j])) j++;
      if(j===i) throw new Error("После знака степени должно стоять число.");
      const e=parseInt(s.slice(i,j),10)*sign; i=j;
      if(e===0){ n={k:F1(), a:F0(), b:F0()}; continue; }
      if(e===1) continue;
      if(!isConst(n)) throw new Error("В системе есть неизвестное в степени выше первой — это уже не линейное уравнение.");
      let acc=F1();
      for(let q=0;q<Math.abs(e);q++) acc=acc.mul(n.k);
      if(e<0) acc=F1().div(acc);
      n={k:acc, a:F0(), b:F0()};
    }
    return n;
  }
  function atom(){
    const c=peek();
    if(c==="("){
      i++;
      const n=expr();
      if(peek()!==")") throw new Error("Не хватает закрывающей скобки.");
      i++;
      return n;
    }
    if(/[0-9.]/.test(c)){
      let j=i;
      while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const raw=s.slice(i,j); i=j;
      return {k:fracFromStr(raw), a:F0(), b:F0()};
    }
    if(/[a-zа-яё]/.test(c)){
      i++;
      if(c===v1) return {k:F0(), a:F1(), b:F0()};
      if(c===v2) return {k:F0(), a:F0(), b:F1()};
      throw new Error("В системе встретилась буква «"+c+"» — я решаю системы только с двумя неизвестными.");
    }
    throw new Error("Непонятный символ «"+c+"» в системе.");
  }
  const r=expr();
  if(i<s.length) throw new Error("Лишние символы в уравнении системы.");
  return r;
}

function sysLine(a,b,c,v1,v2){
  /* a·v1 + b·v2 = c */
  let out="";
  function term(coef, name){
    if(coef.isZero()) return "";
    const sgn = coef.n<0? "−" : "+";
    const abs=coef.abs();
    const c=abs.isOne()? "" : (abs.isInt()? String(abs.n) : fracStr(abs));
    return (out? " "+sgn+" " : (sgn==="−"? "−" : "")) + c + name;
  }
  out += term(a,v1);
  out += term(b,v2);
  if(out==="") out="0";
  return out+" = "+fracStr(c);
}

function solveSystemString(src){
  if((src.match(/=/g)||[]).length!==2) return null;
  let parts=src.split(/\s*(?:;|\n|\sи\s)\s*/).filter(function(x){ return x.trim(); });
  if(parts.length!==2) return null;
  const vs=[];
  parts.forEach(function(p){
    (p.match(/[a-z]/gi)||[]).forEach(function(ch){
      const c=ch.toLowerCase();
      if(vs.indexOf(c)<0) vs.push(c);
    });
  });
  if(vs.length===1) vs.push("y");
  if(vs.length!==2) throw new Error("В системе должно быть ровно два неизвестных, а встретилось "+vs.length+".");
  const v1=vs[0], v2=vs[1];

  const rows=parts.map(function(p){
    const sides=p.split("=");
    if(sides.length!==2) throw new Error("В каждом уравнении системы должен быть один знак «=».");
    const L=lin2Parse(sides[0],v1,v2), R=lin2Parse(sides[1],v1,v2);
    return {
      a:L.a.sub(R.a), b:L.b.sub(R.b), c:R.k.sub(L.k),
      rawL:sides[0].trim(), rawR:sides[1].trim()
    };
  });

  const e1=rows[0], e2=rows[1];
  const D=e1.a.mul(e2.b).sub(e2.a.mul(e1.b));
  const steps=[{
    h:"Записываем систему",
    b: sysHtml([sysLine(e1.a,e1.b,e1.c,v1,v2), sysLine(e2.a,e2.b,e2.c,v1,v2)])+
       "<p>Два уравнения с двумя неизвестными. Решаем способом сложения: подбираем множители так, "+
       "чтобы при одной из переменных коэффициенты стали противоположными, и складываем уравнения — эта переменная исчезнет.</p>"
  }];

  if(D.isZero()){
    const same = e1.a.mul(e2.c).sub(e2.a.mul(e1.c)).isZero() && e1.b.mul(e2.c).sub(e2.b.mul(e1.c)).isZero();
    steps.push({
      h:"Смотрим на коэффициенты",
      b: eq("Δ = a₁b₂ − a₂b₁ = "+fracStr(e1.a)+"·"+fracStr(e2.b)+" − "+fracStr(e2.a)+"·"+fracStr(e1.b)+" = 0")+
         "<p>Определитель равен нулю: прямые, которые задают уравнения, параллельны.</p>"
    });
    return {
      kind:"Система двух уравнений",
      steps:steps,
      answer: same? "бесконечно много решений" : "решений нет"
    };
  }

  /* какую переменную убираем */
  const killX = !e1.a.isZero() && !e2.a.isZero();
  const killY = !killX && !e1.b.isZero() && !e2.b.isZero();
  const m1 = killX? e2.a : (killY? e2.b : F1());
  const m2 = killX? e1.a : (killY? e1.b : F1());
  const k1 = killX? e1.b : (killY? e1.a : F0());
  const k2 = killX? e2.b : (killY? e2.a : F0());
  const c1 = killX? e1.c : e1.c;
  const c2 = e2.c;

  const A1 = k1.mul(m1).sub(k2.mul(m2));      /* коэффициент при оставшейся переменной */
  const C1 = c1.mul(m1).sub(c2.mul(m2));
  const keep = killX? v2 : v1;
  const gone = killX? v1 : v2;

  const mulTxt = (m1.isOne() && m2.isOne())
    ? "<p>Коэффициенты при "+gone+" уже одинаковые — умножать ничего не нужно, вычитаем как есть:</p>"
    : "<p>"+(m1.isOne()? "Первое уравнение оставляем без изменений, второе умножаем на "+fracStr(m2)
                        : (m2.isOne()? "Второе уравнение оставляем, первое умножаем на "+fracStr(m1)
                                     : "Первое уравнение умножаем на "+fracStr(m1)+", второе — на "+fracStr(m2)))+
      " — тогда при "+gone+" коэффициенты станут одинаковыми:</p>";
  steps.push({
    h:"Уравниваем коэффициенты при "+gone,
    b: mulTxt +
       sysHtml([
         numsEq(e1.a.mul(m1),e1.b.mul(m1),e1.c.mul(m1),v1,v2),
         numsEq(e2.a.mul(m2),e2.b.mul(m2),e2.c.mul(m2),v1,v2)
       ])
  });
  steps.push({
    h:"Вычитаем одно из другого",
    b: "<p>Вычитаем второе уравнение из первого: "+gone+" сокращается, остаётся уравнение с одной переменной.</p>"+
       eq(fracStr(A1)+"·"+keep+" = "+fracStr(C1), true)
  });

  if(A1.isZero()){
    return {
      kind:"Система двух уравнений",
      steps:steps,
      answer: C1.isZero()? "бесконечно много решений" : "решений нет"
    };
  }

  const keepVal=C1.div(A1);
  steps.push({
    h:"Находим "+keep,
    b: eq(keep+" = "+fracStr(C1)+" : ("+fracStr(A1)+") = "+fracStr(keepVal), true)
  });

  /* подставляем обратно */
  const first = e1;
  let other;
  if(killX){
    other = first.a.isZero()
      ? (first.c.sub(first.b.mul(keepVal)))
      : first.c.sub(first.b.mul(keepVal)).div(first.a);
  } else {
    other = first.b.isZero()
      ? (first.c.sub(first.a.mul(keepVal)))
      : first.c.sub(first.a.mul(keepVal)).div(first.b);
  }
  const otherName = killX? v1 : v2;

  steps.push({
    h:"Подставляем в первое уравнение",
    b: "<p>Возвращаемся к первому уравнению системы и подставляем найденное значение:</p>"+
       eq(subsLine(first, keepVal, keep, v1, v2))+
       eq(otherName+" = "+fracStr(other), true)
  });

  const ok1 = first.a.mul(killX? other:keepVal).add(first.b.mul(killX? keepVal:other));
  const ok2 = e2.a.mul(killX? other:keepVal).add(e2.b.mul(killX? keepVal:other));
  steps.push({
    h:"Проверяем подстановкой",
    b: sysHtml([sysLine(e1.a,e1.b,e1.c,v1,v2), sysLine(e2.a,e2.b,e2.c,v1,v2)]) +
       "<p>При "+v1+" = "+fracStr(killX?other:keepVal)+", "+v2+" = "+fracStr(killX?keepVal:other)+
       " левые части дают "+fracStr(ok1)+" и "+fracStr(ok2)+", а правые — "+
       fracStr(e1.c)+" и "+fracStr(e2.c)+". Совпало — решение верное.</p>"
  });

  return {
    kind:"Система двух уравнений",
    steps:steps,
    answer: v1+" = "+fracStr(killX?other:keepVal)+",&nbsp; "+v2+" = "+fracStr(killX?keepVal:other)
  };

  function numsEq(a,b,c,x,y){
    const sign=function(f){ return f.n<0? "−":"+"; };
    let s="";
    if(!a.isZero()) s += (a.abs().isOne()? "" : fracStr(a.abs()))+x;
    if(!b.isZero()){
      const t=(b.abs().isOne()? "" : fracStr(b.abs()))+y;
      s += s? " "+sign(b)+" "+t : (b.n<0? "−":"")+t;
    }
    return (s||"0")+" = "+fracStr(c);
  }
  function subsLine(e, val, name, x, y){
    if(killX) return sysLine(e.a,e.b,e.c,x,y).replace(y, fracStr(val));
    return sysLine(e.a,e.b,e.c,x,y).replace(x, fracStr(val));
  }
}
function sysHtml(lines){
  return '<div class="eq big sys"><span class="brc">⎧<br>⎩</span><span class="sysl">'+
    lines.map(function(l){ return esc(l); }).join("<br>")+'</span></div>';
}

/*  9б. Уравнения выше второй степени                            */
/* ============================================================ */
function intCoefs(P){
  let l=1;
  const c=[];
  for(let i=0;i<=P.deg();i++) c.push(P.cf(i));
  c.forEach(function(f){ l = l*f.d/gcd(l,f.d); });
  return c.map(function(f){ return f.n*(l/f.d); });
}
function intDivs(n){
  n=Math.abs(n);
  const out=[];
  for(let i=1;i*i<=n && i<=4000;i++) if(n%i===0){ out.push(i); if(i*i!==n) out.push(n/i); }
  return out;
}
function polyEvalInt(c, p, q){
  /* значение c(p/q)·q^n в целых числах */
  const n=c.length-1;
  let acc=0;
  for(let i=0;i<=n;i++) acc += c[i]*Math.pow(p,i)*Math.pow(q,n-i);
  return acc;
}
function findRatRoot(P){
  const c=intCoefs(P);
  const n=c.length-1;
  if(c[0]===0) return new Frac(0);
  const ps=intDivs(c[0]), qs=intDivs(c[n]);
  for(let qi=0;qi<qs.length;qi++){
    for(let pi=0;pi<ps.length;pi++){
      for(let si=0;si<2;si++){
        const sg = si===0? 1 : -1;
        const p=ps[pi]*sg, q=qs[qi];
        if(polyEvalInt(c,p,q)===0) return new Frac(p,q);
      }
    }
  }
  return null;
}
function divideByRoot(P, r){
  /* делим на (x − r) схемой Горнера с точными дробями */
  const n=P.deg();
  const out=new Array(n).fill(F0());
  out[n-1]=P.cf(n);
  for(let i=n-1;i>=1;i--) out[i-1]=P.cf(i).add(out[i].mul(r));
  const rem=P.cf(0).add(out[0].mul(r));
  if(!rem.isZero()) throw new Error("Внутренняя ошибка деления многочлена.");
  return new Poly(out);
}
function quadRootsOfPoly(P){
  /* P — квадратный трёхчлен; возвращает {k:0|1|2, r1, r2, exact, steps:[...]} */
  const A=P.cf(2), B=P.cf(1), C=P.cf(0);
  const D=B.mul(B).sub(new Frac(4).mul(A).mul(C));
  const steps=[];
  steps.push({
    h:"Считаем дискриминант",
    b: eq("D = b² − 4ac = ("+fracStr(B)+")² − 4·("+fracStr(A)+")·("+fracStr(C)+") = "+fracStr(D))+
       "<p>Остался квадратный трёхчлен "+polyHtml(P,"x")+".</p>"
  });
  if(D.n<0){
    steps.push({h:"Дискриминант отрицательный", b:"<p>D &lt; 0 — действительных корней у этого множителя нет.</p>"});
    return {roots:[], steps:steps};
  }
  const twoA=A.add(A), minusB=B.neg();
  if(D.isZero()){
    const x=minusB.div(twoA);
    steps.push({h:"Корень один", b:eq("x = −b/(2a) = "+fracStr(x), true)});
    return {roots:[x], steps:steps};
  }
  const sp=sqrtParts(D);
  if(sp.rad===1){
    const x1=minusB.add(sp.out).div(twoA), x2=minusB.sub(sp.out).div(twoA);
    steps.push({h:"Корни", b:eq("x₁,₂ = (−b ± √D)/(2a) = ("+fracStr(minusB)+" ± "+fracStr(sp.out)+")/"+fracStr(twoA), true)+
      eq("x₁ = "+fracStr(x1)+",&nbsp; x₂ = "+fracStr(x2), true)});
    return {roots:[x1,x2], steps:steps};
  }
  const coefFrac=sp.out.div(twoA);
  steps.push({h:"Корни", b:eq("x₁,₂ = (−b ± √D)/(2a)", true)+
    eq("x₁,₂ = ("+fracStr(minusB)+" ± "+sqrtHtml(D)+")/"+fracStr(twoA), true)+
    "<p>√"+fracStr(D)+" нацело не извлекается, поэтому точная запись остаётся с корнем; приближённо "+
    "x₁ ≈ "+n2s((minusB.val()+Math.sqrt(D.val()))/twoA.val())+
    ", x₂ ≈ "+n2s((minusB.val()-Math.sqrt(D.val()))/twoA.val())+".</p>"});
  return {roots:[], steps:steps, surd:{base:minusB.div(twoA), coef:coefFrac, rad:sp.rad}};
}

/* «x = 1 ± √2» — точная школьная запись двух корней */
function surdPair(base, coef, rad){
  const c=coef.abs();
  const coefTxt=(c.isOne()? "" : fracStr(c))+"√"+rad;
  const b=fracStr(base);
  if(base.isZero()) return {plus:coefTxt, minus:"−"+coefTxt};
  return {plus:b+" + "+coefTxt, minus:b+" − "+coefTxt};
}

function highDegreeSolution(L,R,v,exp,src){
  const P=L.sub(R);
  const steps=[{
    h:"Записываем уравнение",
    b: eq(esc(src), true)+
       "<p>Старшая степень неизвестного выше второй, поэтому формула корней квадратного уравнения напрямую не подходит. "+
       "Раскладываем на множители: находим один корень подбором и делим на соответствующую скобку.</p>"
  }];
  if(exp){
    steps.push({
      h:"Раскрываем скобки и приводим подобные",
      b: eq(polyHtml(L,v)+" = "+polyHtml(R,v))
    });
  }
  const alreadyMoved = (polyHtml(P,v)+" = 0") === polyHtml(L,v)+" = "+polyHtml(R,v);
  if(!alreadyMoved && !exp){
    steps.push({
      h:"Приводим к виду P("+v+") = 0",
      b: eq(polyHtml(P,v)+" = 0")
    });
  }

  /* биквадратное: только чётные степени */
  let onlyEven=true;
  for(let i=1;i<=P.deg();i+=2) if(!P.cf(i).isZero()) onlyEven=false;

  const roots=[];
  const surdAns=[];
  let cur=P;
  let guard=0;

  if(P.deg()<=2) return null;

  while(cur.deg()>2 && guard++<8){
    const r=findRatRoot(cur);
    if(!r) break;
    steps.push({
      h:"Подбираем корень",
      b: "<p>Целые (и вообще рациональные) корни многочлена с целыми коэффициентами — делители свободного члена. "+
         "Проверяем делители числа "+fracStr(cur.cf(0).abs())+":</p>"+
         eq(polyHtml(cur,v)+" при "+v+" = "+fracStr(r)+" даёт "+fracStr(cur.evalAt(r)))+
         "<p>Ноль — значит "+v+" = "+fracStr(r)+" корень.</p>"
    });
    roots.push(r);
    cur=divideByRoot(cur,r);
    steps.push({
      h:"Делим на ("+v+(r.n<0? " + "+fracStr(r.abs()) : " − "+fracStr(r))+")",
      b: eq(polyHtml(cur,v)+" = 0")+
         "<p>Степень понизилась на единицу — делим уголком (схемой Горнера).</p>"
    });
  }

  /* остаток степени 2 — решаем как квадратное */
  if(cur.deg()===2){
    const q=quadRootsOfPoly(cur);
    q.steps.forEach(function(s){ steps.push(s); });
    q.roots.forEach(function(r){ roots.push(r); });
    if(q.surd){
      const pr=surdPair(q.surd.base, q.surd.coef, q.surd.rad);
      surdAns.push(pr.plus, pr.minus);
    }
  } else if(cur.deg()===1){
    const r=cur.cf(0).neg().div(cur.cf(1));
    roots.push(r);
    steps.push({h:"Осталось линейное уравнение", b:eq(polyHtml(cur,v)+" = 0")+eq(v+" = "+fracStr(r), true)});
  } else if(cur.deg()===0 && !cur.cf(0).isZero()){
    return {kind:"Уравнение выше второй степени", steps:steps, answer:"корней нет"};
  }

  /* если подбор не дал ничего, но многочлен чётный — замена t = x² */
  if(roots.length===0 && onlyEven){
    const Q=[];
    for(let i=0;i<=P.deg();i+=2) Q.push(P.cf(i));
    const qp=new Poly(Q);
    const st=[{
      h:"Замена t = "+v+"²",
      b:"<p>В уравнении только чётные степени неизвестного. Обозначим t = "+v+"², тогда "+v+"⁴ = t² и так далее — "+
        "получится квадратное уравнение относительно t.</p>"+
        eq(polyHtml(qp,"t")+" = 0")
    }];
    if(qp.deg()===2){
      const q=quadRootsOfPoly(qp);
      q.steps.forEach(function(s){ st.push(s); });
      if(q.roots.length){
        const back=[];
        q.roots.forEach(function(t){
          if(t.n<0){
            back.push("<p>t = "+fracStr(t)+" — отрицательное, значит "+v+"² = "+fracStr(t)+" решений не даёт "+
              "(квадрат не бывает отрицательным).</p>");
          } else {
            const sp=sqrtParts(t);
            if(sp.rad===1 && sp.out.isInt()){
              const a=sp.out;
              back.push("<p>t = "+fracStr(t)+" → "+v+" = ±"+fracStr(a)+".</p>");
              roots.push(a, a.neg());
            } else {
              back.push("<p>t = "+fracStr(t)+" → "+v+" = ±"+sqrtHtml(t)+".</p>");
              surdAns.push(sqrtHtml(t), "−"+sqrtHtml(t));
            }
          }
        });
        st.push({h:"Возвращаемся к "+v, b:back.join("")});
        if(roots.length || surdAns.length){
          const uniq=[];
          roots.forEach(function(r){ if(!uniq.some(function(u){ return u.n===r.n&&u.d===r.d; })) uniq.push(r); });
          const parts=uniq.map(function(r){ return fracStr(r); }).concat(surdAns);
          return {kind:"Уравнение выше второй степени", steps:steps.concat(st),
                  answer: parts.map(function(txt,i){ return v+(parts.length>1? (["₁","₂","₃","₄"][i]||"") : "")+" = "+txt; }).join(",&nbsp; ")};
        }
        return {kind:"Уравнение выше второй степени", steps:steps.concat(st), answer:"корней нет"};
      }
      return {kind:"Уравнение выше второй степени", steps:steps.concat(st), answer:"корней нет"};
    }
  }

  const uniq=[];
  roots.forEach(function(r){ if(!uniq.some(function(u){ return u.n===r.n&&u.d===r.d; })) uniq.push(r); });
  if(!uniq.length && !surdAns.length){
    throw new Error("Уравнение выше второй степени, и целых корней у него не находится. Такое я пока не решаю.");
  }
  uniq.sort(function(a,b){ return a.val()-b.val(); });

  /* проверка */
  const chk=[];
  uniq.forEach(function(r){
    chk.push("<p>При "+v+" = "+fracStr(r)+": "+polySubstNum(L,v,r)+" = "+fracStr(L.evalAt(r))+
             ", справа "+polySubstNum(R,v,r)+" = "+fracStr(R.evalAt(r))+" — совпало.</p>");
  });
  steps.push({h:"Проверяем подстановкой", b:chk.join("")});

  const allParts=uniq.map(function(r){ return fracStr(r); }).concat(surdAns);
  return {
    kind:"Уравнение выше второй степени",
    steps:steps,
    answer: allParts.map(function(txt,i){
      return v+(allParts.length>1? (["₁","₂","₃","₄","₅"][i]||"") : "")+" = "+txt;
    }).join(",&nbsp; ")
  };
}

function gNums(text){
  const out=[]; let m;
  const re=/(\d+(?:[.,]\d+)?)\s*(мм|см|дм|км|м)(?![а-яё])/g;
  while((m=re.exec(text))) out.push({v:parseFloat(m[1].replace(",",".")), u:m[2], i:m.index, raw:m[1]});
  return out;
}
function gAllNums(text){
  const out=[]; let m;
  const re=/(\d+(?:[.,]\d+)?)/g;
  while((m=re.exec(text))) out.push({v:parseFloat(m[1].replace(",",".")), u:null, i:m.index, raw:m[1]});
  return out;
}
function gn(x){ 
  const r=Math.round(x*1e6)/1e6;
  return String(r).replace(".",",");
}
function sq2(x){ return x*x; }
function exactSqrt(x){
  /* x — неотрицательное число; возвращает {exact:bool, v:number, html:string} */
  const r=Math.round(Math.sqrt(x)*1e6)/1e6;
  const isInt=(Math.abs(r-Math.round(r))<1e-9);
  if(isInt) return {exact:true, v:Math.round(r), html:String(Math.round(r))};
  /* проверяем, представим ли корень как k√m с целыми k,m */
  const n=Math.round(x*1e6);
  for(let k=2;k<=40;k++){
    const m2=x/(k*k);
    const mm=Math.round(m2*1e6)/1e6;
    if(mm>0 && Math.abs(mm-Math.round(mm))<1e-9 && mm<=1000){
      return {exact:false, v:r, html:k+"√"+Math.round(mm)};
    }
  }
  return {exact:false, v:r, html:"√"+gn(x)};
}
function gRes(what, steps, answer){
  return {kind:"Задача по геометрии · "+what, steps:steps, answer:answer};
}
function unitOf(nums){
  const u=nums.filter(function(n){ return n.u; })[0];
  return u? u.u : "";
}
function areaU(u){ return u? u+"²" : ""; }
function volU(u){ return u? u+"³" : ""; }

function mGeometry(low, t){
  if(!/(площад|периметр|объ[её]м|катет|гипотенуз|радиус|диаметр|окружност|квадрат|прямоугольник|треугольник|параллелепипед|куб|подобн|сторон)/.test(low)) return null;

  let numsW=gNums(low);
  if(!numsW.length) numsW=gAllNums(low).map(function(n){ n.u=null; return n; });

  let r=null;
  r=gSquare(low,numsW);        if(r) return r;
  r=gRect(low,numsW);          if(r) return r;
  r=gBox(low,numsW);           if(r) return r;
  r=gCircle(low,numsW);        if(r) return r;
  r=gSimilar(low,numsW);       if(r) return r;
  r=gTriangle(low,numsW);      if(r) return r;
  return null;
}

/* роль числа: ближайшее ключевое слово перед ним */
const G_WORDS=[
  [/периметр/, "per"], [/площад/, "area"], [/объ[её]м/, "vol"],
  [/ребр/, "side"], [/сторон/, "side"], [/основани/, "base"],
  [/высот/, "height"], [/катет/, "cat"], [/гипотенуз/, "hyp"],
  [/радиус/, "rad"], [/диаметр/, "diam"], [/длин/, "len"]
];
function gRole(low, n){
  let best=null, bestI=-1;
  G_WORDS.forEach(function(w){
    const re=new RegExp(w[0].source,"g");
    let m;
    while((m=re.exec(low))){
      if(m.index+m[0].length<=n.i && m.index>bestI){ bestI=m.index; best=w[1]; }
    }
  });
  return best;
}
function gAsked(low, from){
  const tail=low.slice(from);
  const map=[["per",/периметр/],["area",/площад/],["vol",/объ[её]м/],
             ["side",/сторон/],["hyp",/гипотенуз/],["cat",/катет/],
             ["len",/длин[а-яё]* окружност/],["rad",/радиус/],["diam",/диаметр/]];
  let best=null, bestI=1e9;
  map.forEach(function(p){
    const m=p[1].exec(tail);
    if(m && m.index<bestI){ bestI=m.index; best=p[0]; }
  });
  return best;
}

/* --- квадрат --- */
function gSquare(low, nums){
  if(!/квадрат/.test(low)) return null;
  if(/прямоугольник|куб|параллелепипед/.test(low)) return null;
  if(!nums.length) return null;
  const u=unitOf(nums);
  const first=nums[0];
  const given=gRole(low,first)||"side";
  /* «Периметр квадрата со стороной 7»: вопрос задан ДО числа, и после числа
     его нет. Раньше в таком случае молча считалась площадь — неверный ответ.
     Если в условии назван только периметр, спрашивают периметр. */
  let asked=gAsked(low, first.i);
  if(!asked){
    const hasP=/периметр/.test(low), hasS=/площад/.test(low);
    asked = (hasP && !hasS)? "per" : "area";
  }

  if(given==="per"){
    const P=first.v, a=P/4, S=a*a;
    return gRes("квадрат",[
      {h:"Вспоминаем формулы", b:"<p>У квадрата четыре равные стороны:</p>"+eq("P = 4a,&nbsp;&nbsp; S = a²", true)},
      {h:"Находим сторону по периметру", b:eq("a = P : 4 = "+gn(P)+" : 4 = "+gn(a)+" "+u)},
      {h:"Считаем площадь", b:eq("S = a² = "+gn(a)+" · "+gn(a)+" = "+gn(S)+" "+areaU(u), true)}
    ], (asked==="side"||asked==="per")? "сторона = "+gn(a)+" "+u : "площадь = "+gn(S)+" "+areaU(u));
  }

  if(given==="area"){
    const S=first.v, rt=exactSqrt(S), a=rt.v, P=4*a;
    return gRes("квадрат",[
      {h:"Вспоминаем формулы", b:"<p>Площадь квадрата S = a², периметр P = 4a. Сторона — квадратный корень из площади.</p>"+
        eq("a = √S,&nbsp;&nbsp; P = 4a", true)},
      {h:"Находим сторону", b:eq("a = √"+gn(S)+" = "+rt.html+" "+u)+
        (rt.exact? "<p>Корень извлёкся нацело — сторона точная.</p>"
                 : "<p>Корень нацело не извлекается, сторона приближённая.</p>")},
      {h:"Считаем периметр", b:eq("P = 4 · "+gn(a)+" = "+gn(P)+" "+u, true)}
    ], (asked==="side"||asked==="area")? "сторона = "+rt.html+" "+u : "периметр = "+gn(P)+" "+u);
  }

  const a=first.v, S=sq2(a), P=4*a;
  const steps=[
    {h:"Вспоминаем формулы", b:"<p>У квадрата все стороны равны:</p>"+eq("S = a²,&nbsp;&nbsp; P = 4a", true)},
    {h:"Подставляем сторону", b:eq("a = "+gn(a)+" "+u)}
  ];
  const both=/периметр/.test(low) && /площад/.test(low);
  if(asked==="per" && !both){
    steps.push({h:"Считаем периметр", b:eq("P = 4 · "+gn(a)+" = "+gn(P)+" "+u, true)});
    return gRes("квадрат", steps, "периметр = "+gn(P)+" "+u);
  }
  steps.push({h:"Считаем площадь", b:eq("S = "+gn(a)+" · "+gn(a)+" = "+gn(S)+" "+areaU(u), true)});
  if(both){
    steps.push({h:"Считаем периметр", b:eq("P = 4 · "+gn(a)+" = "+gn(P)+" "+u, true)});
    return gRes("квадрат", steps, "площадь = "+gn(S)+" "+areaU(u)+", периметр = "+gn(P)+" "+u);
  }
  return gRes("квадрат", steps, "площадь = "+gn(S)+" "+areaU(u));
}

/* --- прямоугольник --- */
function gRect(low, nums){
  if(!/прямоугольник/.test(low)) return null;
  if(!nums.length) return null;
  const u=unitOf(nums);
  const roles=nums.map(function(n){ return {v:n.v, i:n.i, role:gRole(low,n)}; });
  const fmt=function(f){ return fracStr(f); };
  const steps=[{h:"Вспоминаем формулы",
    b:"<p>Площадь прямоугольника — произведение сторон, периметр — удвоенная сумма:</p>"+
      eq("S = a · b,&nbsp;&nbsp; P = 2(a + b)", true)}];

  const first=roles[0];
  /* та же логика, что у квадрата: если в условии назван только периметр,
     а после чисел вопроса нет — спрашивают периметр */
  let asked=gAsked(low, first.i);
  if(!asked){
    const hasP=/периметр/.test(low), hasS=/площад/.test(low);
    asked = (hasP && !hasS)? "per" : "area";
  }
  let a=null, b=null;

  /* «прямоугольник 6 на 8» — так обычно называют две стороны, а не «периметр 6».
     Без этой проверки выходило «площадь = -40, периметр = 6». */
  const pair=/(\d+(?:[.,]\d+)?)\s*(?:см|м|мм|дм|км)?\s*(?:на|х|×)\s*(\d+(?:[.,]\d+)?)/.exec(low);
  const pairSides = pair && nums.length>=2 &&
    Math.abs(parseFloat(pair[1].replace(",","."))-nums[0].v)<1e-9 &&
    Math.abs(parseFloat(pair[2].replace(",","."))-nums[1].v)<1e-9;
  const dm=/на\s*(\d+(?:[.,]\d+)?)\s*(см|м|мм|дм|км)?\s*(больше|меньше)/.exec(low);
  const km=/в\s*(\d+(?:[.,]\d+)?)\s*раз[а-яё]*\s*(больше|меньше)/.exec(low);

  if(dm && /сторон|длин|ширин/.test(low)){
    a=first.v;
    const d=parseFloat(dm[1].replace(",","."));
    const more=dm[3]==="больше";
    b = more? a+d : a-d;
    steps.push({h:"Находим вторую сторону",
      b:"<p>Одна сторона "+gn(a)+" "+(u||"")+", другая на "+gn(d)+" "+(u||"")+" "+(more?"больше":"меньше")+":</p>"+
        eq("b = "+gn(a)+" "+(more?"+":"−")+" "+gn(d)+" = "+gn(b)+" "+u)});
  } else if(km && /сторон|длин|ширин/.test(low)){
    a=first.v;
    const k=parseFloat(km[1].replace(",","."));
    const more=km[2]==="больше";
    b = more? a*k : a/k;
    steps.push({h:"Находим вторую сторону",
      b:"<p>Вторая сторона в "+gn(k)+" раза "+(more?"больше":"меньше")+" первой:</p>"+
        eq("b = "+gn(a)+(more?" · ":" : ")+gn(k)+" = "+gn(b)+" "+u)});
  } else if(pairSides){
    a=nums[0].v; b=nums[1].v;
    steps.push({h:"Подставляем стороны", b:eq("a = "+gn(a)+" "+u+",&nbsp;&nbsp; b = "+gn(b)+" "+u)});
  } else if(first.role==="per"){
    const P=first.v, half=P/2;
    steps.push({h:"Работаем с периметром",
      b:"<p>P = 2(a + b), значит сумма сторон — половина периметра:</p>"+
        eq("a + b = "+gn(P)+" : 2 = "+gn(half)+" "+u)});
    const side=roles.filter(function(r){ return r.i>first.i && r.role==="side"; })[0]
            || roles.filter(function(r){ return r.i>first.i; })[0];
    if(side){
      a=side.v;
      b=half-a;
      steps.push({h:"Находим вторую сторону", b:eq("b = "+gn(half)+" − "+gn(a)+" = "+gn(b)+" "+u)});
    } else {
      return gRes("прямоугольник",steps,
        "стороны могут быть любыми: a + b = "+gn(half)+" "+u+", площадь зависит от их выбора");
    }
  } else if(first.role==="area"){
    return gRes("прямоугольник",steps,
      "по одной площади стороны не находятся — нужна ещё длина хотя бы одной стороны");
  } else {
    const two=roles.filter(function(r){ return r.role!=="per" && r.role!=="area"; });
    if(two.length<2) return null;
    a=two[0].v; b=two[1].v;
    steps.push({h:"Подставляем стороны", b:eq("a = "+gn(a)+" "+u+",&nbsp;&nbsp; b = "+gn(b)+" "+u)});
  }

  if(!(a>0) || !(b>0)){
    return gRes("прямоугольник",steps,
      "так стороны не получаются: проверьте, что в условии дано, а что нужно найти");
  }
  const S=a*b, P=2*(a+b);
  steps.push({h:"Считаем площадь", b:eq("S = "+gn(a)+" · "+gn(b)+" = "+gn(S)+" "+areaU(u))});
  steps.push({h:"Считаем периметр", b:eq("P = 2("+gn(a)+" + "+gn(b)+") = "+gn(P)+" "+u, true)});
  /* просят и то и другое — отдаём оба, а не половину */
  const wantBoth=/периметр/.test(low) && /площад/.test(low);
  if(asked==="per" && !wantBoth) return gRes("прямоугольник",steps,"периметр = "+gn(P)+" "+u);
  if(asked==="area" && !wantBoth) return gRes("прямоугольник",steps,"площадь = "+gn(S)+" "+areaU(u));
  return gRes("прямоугольник",steps,"площадь = "+gn(S)+" "+areaU(u)+", периметр = "+gn(P)+" "+u);
}

/* --- треугольник --- */
function gTriangle(low, nums){
  if(/подобн/.test(low)) return null;
  const right=/прямоугольн/.test(low) || /катет|гипотенуз/.test(low);
  if(!/треугольник/.test(low) && !right) return null;
  if(!nums.length) return null;
  const u=unitOf(nums);
  const roles=nums.map(function(n){ return {v:n.v, i:n.i, role:gRole(low,n)}; });

  if(right && roles.length>=2){
    const hyp=roles.filter(function(r){ return r.role==="hyp"; })[0];
    const cats=roles.filter(function(r){ return r.role==="cat"; });
    if(hyp && cats.length){
      const c=hyp.v, a1=cats[0].v, b2=c*c-a1*a1;
      if(b2>0){
        const rt=exactSqrt(b2);
        return gRes("прямоугольный треугольник",[
          {h:"Вспоминаем теорему Пифагора", b:"<p>Квадрат гипотенузы равен сумме квадратов катетов:</p>"+eq("c² = a² + b²", true)},
          {h:"Выражаем неизвестный катет", b:eq("b² = c² − a² = "+gn(c)+"² − "+gn(a1)+"² = "+gn(c*c)+" − "+gn(a1*a1)+" = "+gn(b2))},
          {h:"Извлекаем корень", b:eq("b = √"+gn(b2)+" = "+rt.html+" "+u, true)+
            (rt.exact? "<p>Корень извлёкся нацело.</p>":"<p>Корень нацело не извлекается: b ≈ "+gn(rt.v)+" "+u+".</p>")}
        ], "катет = "+rt.html+" "+u+(rt.exact? "":" ≈ "+gn(rt.v)+" "+u));
      }
    }
    const catsAll=roles.filter(function(r){ return r.role!=="hyp"; });
    if(catsAll.length>=2){
      const a1=catsAll[0].v, b1=catsAll[1].v, c2=a1*a1+b1*b1;
      const rt=exactSqrt(c2);
      const steps=[
        {h:"Вспоминаем теорему Пифагора", b:"<p>В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов:</p>"+
          eq("c² = a² + b²", true)},
        {h:"Подставляем катеты", b:eq("c² = "+gn(a1)+"² + "+gn(b1)+"² = "+gn(a1*a1)+" + "+gn(b1*b1)+" = "+gn(c2))},
        {h:"Извлекаем корень", b:eq("c = √"+gn(c2)+" = "+rt.html+" "+u, true)+
          (rt.exact? "<p>Корень извлёкся нацело — гипотенуза точная.</p>"
                   : "<p>Корень нацело не извлекается: c ≈ "+gn(rt.v)+" "+u+".</p>")}
      ];
      if(/площад/.test(low)){
        const S=a1*b1/2;
        steps.push({h:"Площадь прямоугольного треугольника",
          b:eq("S = (a · b) : 2 = ("+gn(a1)+" · "+gn(b1)+") : 2 = "+gn(S)+" "+areaU(u), true)});
        return gRes("прямоугольный треугольник",steps,"гипотенуза = "+rt.html+" "+u+", площадь = "+gn(S)+" "+areaU(u));
      }
      return gRes("прямоугольный треугольник",steps,"гипотенуза = "+rt.html+" "+u+(rt.exact? "":" ≈ "+gn(rt.v)+" "+u));
    }
  }

  const base=roles.filter(function(r){ return r.role==="base"; })[0]||roles[0];
  const height=roles.filter(function(r){ return r.role==="height"; })[0];
  if(height && roles.length>=2){
    const S=base.v*height.v/2;
    return gRes("треугольник",[
      {h:"Вспоминаем формулу площади", b:"<p>Площадь треугольника — половина произведения основания на высоту:</p>"+
        eq("S = (a · h) : 2", true)},
      {h:"Подставляем", b:eq("a = "+gn(base.v)+" "+u+",&nbsp; h = "+gn(height.v)+" "+u)},
      {h:"Считаем", b:eq("S = ("+gn(base.v)+" · "+gn(height.v)+") : 2 = "+gn(S)+" "+areaU(u), true)}
    ],"площадь = "+gn(S)+" "+areaU(u));
  }
  if(roles.length>=2 && /площад/.test(low)){
    const S=roles[0].v*roles[1].v/2;
    return gRes("треугольник",[
      {h:"Вспоминаем формулу площади", b:"<p>Площадь треугольника — половина произведения основания на высоту:</p>"+
        eq("S = (a · h) : 2", true)},
      {h:"Подставляем", b:eq("a = "+gn(roles[0].v)+" "+u+",&nbsp; h = "+gn(roles[1].v)+" "+u)},
      {h:"Считаем", b:eq("S = ("+gn(roles[0].v)+" · "+gn(roles[1].v)+") : 2 = "+gn(S)+" "+areaU(u), true)}
    ],"площадь = "+gn(S)+" "+areaU(u));
  }
  return null;
}

/* --- подобие --- */
function gSimilar(low, nums){
  if(!/подобн|коэффициент подобия|относятся как/.test(low)) return null;
  if(!nums.length) return null;
  let k=null;
  const steps=[{h:"Что такое коэффициент подобия",
    b:"<p>У подобных фигур все линейные размеры относятся с одним коэффициентом k, "+
      "площади — как k², объёмы — как k³.</p>"+eq("S₂ : S₁ = k²,&nbsp;&nbsp; V₂ : V₁ = k³", true)}];
  const km=/коэффициент[а-яё]*\s*подоби[а-яё]*\s*(?:равен|=|:)?\s*(\d+(?:[.,]\d+)?)/.exec(low);
  const rm=/как\s*(\d+(?:[.,]\d+)?)\s*:\s*(\d+(?:[.,]\d+)?)/.exec(low);
  if(km) k=parseFloat(km[1].replace(",","."));
  else if(rm){
    const a=parseFloat(rm[1].replace(",",".")), b=parseFloat(rm[2].replace(",","."));
    k=b/a;
    steps.push({h:"Находим коэффициент", b:eq("k = "+gn(b)+" : "+gn(a)+" = "+gn(k))});
  }
  if(k===null || !isFinite(k) || k<=0) return null;
  steps.push({h:"Коэффициент подобия", b:eq("k = "+gn(k))});

  const isVol=/объ[её]м/.test(low);
  const val=nums.filter(function(n){ return Math.abs(n.v-k)>1e-9; })[0];
  if(!val) return null;
  if(isVol){
    const res=val.v*Math.pow(k,3);
    steps.push({h:"Объём растёт как k³", b:eq("V₂ = V₁ · k³ = "+gn(val.v)+" · "+gn(k)+"³ = "+gn(res), true)});
    return gRes("подобные тела",steps,"объём = "+gn(res));
  }
  const res=val.v*k*k;
  steps.push({h:"Площадь растёт как k²",
    b:eq("S₂ = S₁ · k² = "+gn(val.v)+" · "+gn(k)+"² = "+gn(res), true)+
      "<p>Площадь — величина «квадратная»: при увеличении всех размеров вдвое площадь растёт вчетверо.</p>"});
  return gRes("подобные фигуры",steps,"площадь = "+gn(res));
}

/* --- куб и параллелепипед --- */
function gBox(low, nums){
  const isCube=/куб/.test(low) && !/кубическ/.test(low);
  const isBox=/параллелепипед|коробк|брусок/.test(low);
  if(!isCube && !isBox) return null;
  if(!nums.length) return null;
  const u=unitOf(nums);
  if(isCube){
    const a=nums[0].v, V=a*a*a, S=6*a*a;
    return gRes("куб",[
      {h:"Вспоминаем формулы", b:"<p>У куба все рёбра равны:</p>"+eq("V = a³,&nbsp;&nbsp; S = 6a²", true)},
      {h:"Подставляем ребро", b:eq("a = "+gn(a)+" "+u)},
      {h:"Считаем объём", b:eq("V = "+gn(a)+"³ = "+gn(V)+" "+volU(u))},
      {h:"Считаем площадь поверхности", b:eq("S = 6 · "+gn(a)+"² = "+gn(S)+" "+areaU(u), true)}
    ], "объём = "+gn(V)+" "+volU(u)+", площадь поверхности = "+gn(S)+" "+areaU(u));
  }
  if(nums.length<3) return null;
  const a=nums[0].v, b=nums[1].v, c=nums[2].v;
  const V=a*b*c, S=2*(a*b+b*c+a*c);
  return gRes("прямоугольный параллелепипед",[
    {h:"Вспоминаем формулы", b:"<p>Объём — произведение трёх измерений, площадь поверхности — сумма площадей всех граней:</p>"+
      eq("V = a · b · c,&nbsp;&nbsp; S = 2(ab + bc + ac)", true)},
    {h:"Подставляем измерения", b:eq("a = "+gn(a)+",&nbsp; b = "+gn(b)+",&nbsp; c = "+gn(c)+" "+(u||""))},
    {h:"Считаем объём", b:eq("V = "+gn(a)+" · "+gn(b)+" · "+gn(c)+" = "+gn(V)+" "+volU(u))},
    {h:"Считаем площадь поверхности", b:eq("S = 2("+gn(a*b)+" + "+gn(b*c)+" + "+gn(a*c)+") = "+gn(S)+" "+areaU(u), true)}
  ], "объём = "+gn(V)+" "+volU(u)+", площадь поверхности = "+gn(S)+" "+areaU(u));
}

/* --- круг --- */
function gCircle(low, nums){
  if(!/окружност|круг|радиус|диаметр/.test(low)) return null;
  if(!nums.length) return null;
  const u=unitOf(nums);
  const isDiam=/диаметр/.test(low.slice(0,nums[0].i+1)) && !/радиус/.test(low.slice(0,nums[0].i+1));
  let r=nums[0].v;
  const steps=[];
  if(isDiam){
    steps.push({h:"Находим радиус", b:"<p>Диаметр — это два радиуса:</p>"+eq("r = d : 2 = "+gn(r)+" : 2 = "+gn(r/2)+" "+u)});
    r=r/2;
  }
  steps.unshift({h:"Вспоминаем формулы",
    b:"<p>Длина окружности C = 2πr, площадь круга S = πr². Считаем с π ≈ 3,14, точное значение оставляем с π.</p>"});
  const C=2*Math.PI*r, S=Math.PI*r*r;
  steps.push({h:"Подставляем радиус", b:eq("r = "+gn(r)+" "+u)});
  if(/длину окружности|длина окружности|периметр/.test(low)){
    steps.push({h:"Считаем длину окружности", b:eq("C = 2πr = 2 · π · "+gn(r)+" = "+gn(2*r)+"π ≈ "+gn(C)+" "+u, true)});
    return gRes("круг",steps,"C = "+gn(2*r)+"π ≈ "+gn(C)+" "+u);
  }
  steps.push({h:"Считаем площадь", b:eq("S = πr² = π · "+gn(r)+"² = "+gn(r*r)+"π ≈ "+gn(S)+" "+areaU(u), true)});
  return gRes("круг",steps,"S = "+gn(r*r)+"π ≈ "+gn(S)+" "+areaU(u));
}

/* --- треугольник --- */
/* ============================================================ */
/*  9г. Движение по воде                                         */
/* ============================================================ */
function mWater(low, t){
  if(!/течени/.test(low)) return null;
  const idxPo=low.search(/по течению/);
  const idxPr=low.search(/против течения/);
  const speeds=[];
  const re=/(\d+(?:[.,]\d+)?)\s*(?:км\/ч|км в час|км\/час)/g;
  let m;
  while((m=re.exec(low))) speeds.push({v:parseFloat(m[1].replace(",",".")), i:m.index});
  if(!speeds.length) return null;

  function near(idx, keys){
    if(idx<0) return null;
    const cand=speeds.filter(function(s){ return s.i>idx && s.i<idx+70; });
    if(!cand.length) return null;
    const chunk=low.slice(idx, cand[0].i);
    if(keys && !keys.test(chunk)) return null;
    return cand[0].v;
  }

  const vPo=near(idxPo);
  const vPr=near(idxPr);
  const vOwn=near(low.search(/собственн/));
  const vTek=near(low.search(/скорост[а-яё]*\s+течени|течение\s+(?:реки\s+)?(\d)|течения/));

  const base={h:"Что происходит", b:"<p>По течению река помогает: скорости складываются. Против течения мешает: скорость течения вычитается.</p>"+
    eq("v по теч. = v собств. + v теч.&nbsp;&nbsp;&nbsp; v прот. = v собств. − v теч.", true)};

  if(vPo!==null && vPr!==null){
    const own=(vPo+vPr)/2, tek=(vPo-vPr)/2;
    return {kind:"Задача на движение по воде", steps:[base,
      {h:"Что известно", b:eq("по течению "+gn(vPo)+" км/ч,&nbsp; против течения "+gn(vPr)+" км/ч")},
      {h:"Складываем и делим пополам", b:"<p>Сумма скоростей — это удвоенная собственная скорость, разность — удвоенная скорость течения:</p>"+
        eq("v собств. = ("+gn(vPo)+" + "+gn(vPr)+") : 2 = "+gn(own)+" км/ч")},
      {h:"Скорость течения", b:eq("v теч. = ("+gn(vPo)+" − "+gn(vPr)+") : 2 = "+gn(tek)+" км/ч", true)}
    ], answer:"собственная скорость = "+gn(own)+" км/ч, скорость течения = "+gn(tek)+" км/ч"};
  }

  if(vOwn!==null && vTek!==null){
    return {kind:"Задача на движение по воде", steps:[base,
      {h:"Что известно", b:eq("v собств. = "+gn(vOwn)+" км/ч,&nbsp; v теч. = "+gn(vTek)+" км/ч")},
      {h:"По течению", b:eq("v по теч. = "+gn(vOwn)+" + "+gn(vTek)+" = "+gn(vOwn+vTek)+" км/ч")},
      {h:"Против течения", b:eq("v прот. = "+gn(vOwn)+" − "+gn(vTek)+" = "+gn(vOwn-vTek)+" км/ч", true)}
    ], answer:"по течению "+gn(vOwn+vTek)+" км/ч, против течения "+gn(vOwn-vTek)+" км/ч"};
  }

  if(vPo!==null && vTek!==null){
    return {kind:"Задача на движение по воде", steps:[base,
      {h:"Что известно", b:eq("по течению "+gn(vPo)+" км/ч,&nbsp; v теч. = "+gn(vTek)+" км/ч")},
      {h:"Вычитаем скорость течения", b:"<p>По течению течение подгоняет лодку, значит собственная скорость меньше:</p>"+
        eq("v собств. = "+gn(vPo)+" − "+gn(vTek)+" = "+gn(vPo-vTek)+" км/ч", true)}
    ], answer:"собственная скорость = "+gn(vPo-vTek)+" км/ч"};
  }

  if(vPr!==null && vTek!==null){
    return {kind:"Задача на движение по воде", steps:[base,
      {h:"Что известно", b:eq("против течения "+gn(vPr)+" км/ч,&nbsp; v теч. = "+gn(vTek)+" км/ч")},
      {h:"Прибавляем скорость течения", b:"<p>Против течения река тормозит лодку, значит собственная скорость больше:</p>"+
        eq("v собств. = "+gn(vPr)+" + "+gn(vTek)+" = "+gn(vPr+vTek)+" км/ч", true)}
    ], answer:"собственная скорость = "+gn(vPr+vTek)+" км/ч"};
  }

  /* просто путь по течению: скорость и время известны */
  if(vPo!==null && !/собственн|скорост[а-яё]*\s+течени/.test(low)){
    const S2=/(\d+(?:[.,]\d+)?)\s*км(?![\/а-яё])/.exec(low);
    const T2=/(\d+(?:[.,]\d+)?)\s*(?:час[а-яё]*|ч)(?![а-яё\/])/.exec(low);
    if(S2 || T2){
      if(T2 && !S2){
        const tt=parseFloat(T2[1].replace(",","."));
        const dist=vPo*tt;
        return {kind:"Задача на движение по воде", steps:[base,
          {h:"Что известно", b:eq("v по течению = "+gn(vPo)+" км/ч,&nbsp; t = "+gn(tt)+" ч")},
          {h:"Считаем путь", b:eq("S = v · t = "+gn(vPo)+" · "+gn(tt)+" = "+gn(dist)+" км", true)}
        ], answer:gn(dist)+" км"};
      }
      if(S2 && T2){
        const s2=parseFloat(S2[1].replace(",",".")), tt=parseFloat(T2[1].replace(",","."));
        return {kind:"Задача на движение по воде", steps:[base,
          {h:"Что известно", b:eq("S = "+gn(s2)+" км,&nbsp; t = "+gn(tt)+" ч")},
          {h:"Считаем скорость по течению", b:eq("v по теч. = S : t = "+gn(s2)+" : "+gn(tt)+" = "+gn(s2/tt)+" км/ч", true)}
        ], answer:"скорость по течению = "+gn(s2/tt)+" км/ч"};
      }
    }
  }

  /* путь и время по течению, известна скорость течения */
  if(vTek!==null && /по течению/.test(low)){
    const S=/(\d+(?:[.,]\d+)?)\s*км/.exec(low);
    const T=/(\d+(?:[.,]\d+)?)\s*(?:час|ч)/.exec(low);
    if(S && T){
      const s=parseFloat(S[1].replace(",",".")), tt=parseFloat(T[1].replace(",","."));
      const vp=s/tt, own=vp-vTek;
      return {kind:"Задача на движение по воде", steps:[base,
        {h:"Находим скорость по течению", b:eq("v по теч. = S : t = "+gn(s)+" : "+gn(tt)+" = "+gn(vp)+" км/ч")},
        {h:"Убираем помощь течения", b:eq("v собств. = "+gn(vp)+" − "+gn(vTek)+" = "+gn(own)+" км/ч", true)}
      ], answer:"собственная скорость = "+gn(own)+" км/ч"};
    }
  }
  return null;
}
